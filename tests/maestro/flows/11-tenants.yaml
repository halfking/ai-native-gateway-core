appId: com.llmgateway.web
---
# 测试：租户管理功能

- launchApp:
    clearState: false

# 进入租户管理页面
- assertVisible: "租户管理"
- tapOn: "租户管理"

# 验证租户列表
- assertVisible: "租户列表"
- assertVisible: "添加租户"
- assertVisible: "搜索租户"

# 创建新租户
- tapOn: "添加租户"
- assertVisible: "租户信息"

# 填写基本信息
- tapOn: "租户名称"
- inputText: "测试租户"

- tapOn: "租户ID"
- inputText: "test-tenant-001"

- tapOn: "联系人"
- inputText: "张三"

- tapOn: "联系邮箱"
- inputText: "[REDACTED:email]"

- tapOn: "联系电话"
- inputText: "13800138000"

# 租户配置
- scrollUntilVisible: "租户配置"
- tapOn: "租户类型"
- assertVisible: "标准版"
- assertVisible: "企业版"
- assertVisible: "试用版"
- tapOn: "企业版"

# 配额设置
- scrollUntilVisible: "配额设置"
- tapOn: "每日请求限制"
- inputText: "100000"

- tapOn: "并发限制"
- inputText: "100"

- tapOn: "Token限制"
- inputText: "10000000"

- tapOn: "存储限制(GB)"
- inputText: "100"

# 费率设置
- scrollUntilVisible: "费率设置"
- tapOn: "启用自定义费率"

- tapOn: "基础费率"
- inputText: "0.002"

- tapOn: "流量费用"
- inputText: "0.001"

# 功能权限
- scrollUntilVisible: "功能权限"
- tapOn: "路由策略"
- tapOn: "故障转移"
- tapOn: "实时监控"
- tapOn: "自定义模型"

# 供应商权限
- scrollUntilVisible: "供应商权限"
- tapOn: "OpenAI"
- tapOn: "Azure"
- tapOn: "Anthropic"

# 安全设置
- scrollUntilVisible: "安全设置"
- tapOn: "启用IP白名单"

- tapOn: "IP地址"
- inputText: "192.168.1.0/24"

- tapOn: "添加IP"

- tapOn: "API密钥过期时间"
- inputText: "90"

- tapOn: "启用双因素认证"

# 保存租户
- tapOn: "保存"
- assertVisible: "租户创建成功"

# 验证租户列表
- assertVisible: "测试租户"
- assertVisible: "test-tenant-001"
- assertVisible: "企业版"
- assertVisible: "启用"

# 测试搜索租户
- tapOn: "搜索租户"
- inputText: "测试"
- assertVisible: "测试租户"

# 清除搜索
- tapOn: "清除"

# 查看租户详情
- tapOn: "测试租户"
- assertVisible: "租户详情"
- assertVisible: "基本信息"
- assertVisible: "配额使用"
- assertVisible: "API密钥"

# 查看配额使用
- tapOn: "配额使用"
- assertVisible: "请求量"
- assertVisible: "Token使用"
- assertVisible: "存储使用"
- assertVisible: "使用趋势"

# 查看使用百分比
- assertVisible:
    text: ".*\\d+%.*"
    regex: true

# 管理API密钥
- tapOn: "API密钥"
- assertVisible: "密钥列表"
- tapOn: "生成密钥"

- tapOn: "密钥名称"
- inputText: "生产环境密钥"

- tapOn: "权限范围"
- tapOn: "读写"

- tapOn: "过期时间"
- tapOn: "90天"

- tapOn: "生成"
- assertVisible: "密钥已生成"
- assertVisible: "请妥善保管"

# 复制密钥
- tapOn: "复制密钥"
- assertVisible: "已复制"

- tapOn: "我已保存"

# 测试编辑租户
- tapOn: "返回"
- tapOn: "编辑"
- assertVisible: "编辑租户"

- tapOn: "每日请求限制"
- inputText: "200000"

- tapOn: "保存"
- assertVisible: "租户更新成功"

# 查看租户统计
- tapOn: "统计"
- assertVisible: "租户统计"
- assertVisible: "总请求数"
- assertVisible: "成功率"
- assertVisible: "平均响应时间"
- assertVisible: "费用统计"

# 按模型统计
- scrollUntilVisible: "模型使用"
- assertVisible: "gpt-4"
- assertVisible: "claude-3"

# 按供应商统计
- scrollUntilVisible: "供应商分布"
- assertVisible: "OpenAI"
- assertVisible: "Azure"

# 时间趋势
- scrollUntilVisible: "使用趋势"
- assertVisible: "7天趋势"

# 费用报表
- tapOn: "费用报表"
- assertVisible: "总费用"
- assertVisible: "本月费用"
- assertVisible: "费用明细"

# 导出报表
- tapOn: "导出"
- tapOn: "PDF"
- assertVisible: "报表导出成功"

# 测试租户禁用
- tapOn: "返回"
- tapOn: "禁用租户"
- assertVisible: "确认禁用"
- inputText: "维护升级"
- tapOn: "确认"
- assertVisible: "租户已禁用"

# 验证禁用状态
- assertVisible: "已禁用"

# 测试租户启用
- tapOn: "启用租户"
- assertVisible: "租户已启用"

# 租户分组管理
- tapOn: "返回"
- tapOn: "分组管理"
- assertVisible: "租户分组"

- tapOn: "创建分组"
- tapOn: "分组名称"
- inputText: "企业客户"

- tapOn: "保存"
- assertVisible: "分组创建成功"

# 添加租户到分组
- tapOn: "添加租户"
- tapOn: "测试租户"
- tapOn: "确认"
- assertVisible: "租户已添加"

# 批量操作
- tapOn: "返回"
- tapOn: "批量操作"
- assertVisible: "选择租户"

- tapOn: "测试租户"
- tapOn: "操作"
- tapOn: "调整配额"

- tapOn: "每日请求限制"
- inputText: "150000"

- tapOn: "应用"
- assertVisible: "批量更新成功"

# 租户迁移
- tapOn: "返回"
- tapOn: "测试租户"
- tapOn: "高级操作"
- tapOn: "数据迁移"

- assertVisible: "迁移选项"
- tapOn: "导出租户数据"
- assertVisible: "导出格式"
- tapOn: "JSON"

- tapOn: "开始导出"
- assertVisible: "导出成功"

# 测试删除租户
- tapOn: "返回"
- tapOn: "删除租户"
- assertVisible: "危险操作"
- assertVisible: "此操作不可恢复"

- tapOn: "确认删除"
- inputText: "test-tenant-001"
- tapOn: "确认"
- assertVisible: "租户删除成功"

# 截图验证
- takeScreenshot: "tests/screenshots/11-tenants-light.png"

# 深色模式验证
- tapOn: "设置"
- tapOn: "深色模式"
- tapOn: "租户管理"
- takeScreenshot: "tests/screenshots/11-tenants-dark.png"
