appId: com.llmgateway.web
---
# 测试：审计日志功能

- launchApp:
    clearState: false

# 进入审计日志页面
- assertVisible: "审计日志"
- tapOn: "审计日志"

# 验证审计日志界面
- assertVisible: "审计记录"
- assertVisible: "操作类型"
- assertVisible: "时间范围"
- assertVisible: "搜索"

# 查看审计记录列表
- assertVisible: "操作时间"
- assertVisible: "操作人"
- assertVisible: "操作类型"
- assertVisible: "资源类型"
- assertVisible: "结果"

# 按操作类型过滤
- tapOn: "操作类型"
- assertVisible: "全部"
- assertVisible: "创建"
- assertVisible: "更新"
- assertVisible: "删除"
- assertVisible: "登录"
- assertVisible: "登出"
- tapOn: "创建"

- assertVisible:
    text: ".*创建.*"
    regex: true

# 清除过滤
- tapOn: "操作类型"
- tapOn: "全部"

# 按资源类型过滤
- tapOn: "资源类型"
- assertVisible: "用户"
- assertVisible: "角色"
- assertVisible: "租户"
- assertVisible: "API密钥"
- assertVisible: "模型"
- tapOn: "API密钥"

- assertVisible: "密钥"

# 按时间范围过滤
- tapOn: "时间范围"
- assertVisible: "最近1小时"
- assertVisible: "最近24小时"
- assertVisible: "最近7天"
- assertVisible: "最近30天"
- assertVisible: "自定义"
- tapOn: "最近24小时"

# 自定义时间范围
- tapOn: "时间范围"
- tapOn: "自定义"

- tapOn: "开始时间"
- assertVisible: "日期选择器"
- tapOn:
    text: ".*\\d+.*"
    regex: true
    index: 0

- tapOn: "结束时间"
- tapOn:
    text: ".*\\d+.*"
    regex: true
    index: 0

- tapOn: "应用"

# 按操作人过滤
- tapOn: "操作人"
- inputText: "admin"
- assertVisible: "admin"

# 清除搜索
- tapOn: "清除"

# 按结果过滤
- tapOn: "结果"
- assertVisible: "全部"
- assertVisible: "成功"
- assertVisible: "失败"
- tapOn: "失败"

- assertVisible: "失败"

# 搜索审计记录
- tapOn: "搜索"
- inputText: "密钥"

- assertVisible:
    text: ".*密钥.*"
    regex: true

# 清除搜索
- tapOn: "清除"

# 查看审计详情
- tapOn:
    text: ".*创建.*|.*更新.*|.*删除.*"
    regex: true
    index: 0

- assertVisible: "审计详情"
- assertVisible: "基本信息"
- assertVisible: "操作详情"
- assertVisible: "变更内容"

# 基本信息
- assertVisible: "操作ID"
- assertVisible: "操作时间"
- assertVisible: "操作人"
- assertVisible: "IP地址"
- assertVisible: "User Agent"

# 操作详情
- scrollUntilVisible: "操作详情"
- assertVisible: "操作类型"
- assertVisible: "资源类型"
- assertVisible: "资源ID"
- assertVisible: "操作结果"

# 变更内容
- scrollUntilVisible: "变更内容"
- assertVisible: "变更前"
- assertVisible: "变更后"
- assertVisible: "差异对比"

# 查看JSON格式
- tapOn: "查看JSON"
- assertVisible: "原始数据"

# 复制审计记录
- tapOn: "复制"
- assertVisible: "已复制"

# 关联记录
- tapOn: "关联记录"
- assertVisible: "相关操作"

# 关闭详情
- tapOn: "关闭"

# 审计统计
- tapOn: "统计"
- assertVisible: "审计统计"
- assertVisible: "总操作数"
- assertVisible: "成功率"
- assertVisible: "活跃用户"

# 按操作类型统计
- assertVisible: "操作类型分布"
- assertVisible: "创建"
- assertVisible: "更新"
- assertVisible: "删除"

# 按资源类型统计
- scrollUntilVisible: "资源类型分布"
- assertVisible: "用户"
- assertVisible: "角色"
- assertVisible: "租户"

# 按用户统计
- scrollUntilVisible: "用户活动"
- assertVisible: "操作次数"

# 时间趋势
- scrollUntilVisible: "操作趋势"
- assertVisible: "24小时趋势"

# 风险操作统计
- scrollUntilVisible: "风险操作"
- assertVisible: "失败登录"
- assertVisible: "批量删除"
- assertVisible: "权限变更"

# 审计报表
- tapOn: "返回"
- tapOn: "报表"
- assertVisible: "审计报表"

# 生成报表
- tapOn: "生成报表"
- assertVisible: "报表配置"

- tapOn: "报表类型"
- assertVisible: "操作汇总"
- assertVisible: "用户活动"
- assertVisible: "安全事件"
- assertVisible: "合规检查"
- tapOn: "操作汇总"

- tapOn: "时间范围"
- tapOn: "最近7天"

- tapOn: "包含内容"
- tapOn: "统计图表"
- tapOn: "详细记录"
- tapOn: "风险分析"

- tapOn: "生成"
- assertVisible: "报表生成中"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible: "报表生成成功"

# 查看报表
- tapOn: "查看报表"
- assertVisible: "报表内容"
- assertVisible: "执行摘要"
- assertVisible: "数据分析"

# 导出报表
- tapOn: "导出"
- assertVisible: "导出格式"
- assertVisible: "PDF"
- assertVisible: "Excel"
- assertVisible: "HTML"
- tapOn: "PDF"

- assertVisible: "导出成功"

# 审计配置
- tapOn: "返回"
- tapOn: "配置"
- assertVisible: "审计配置"

# 审计范围
- assertVisible: "审计范围"
- tapOn: "审计所有操作"

# 特定操作配置
- scrollUntilVisible: "特定操作"
- tapOn: "登录/登出"
- tapOn: "用户管理"
- tapOn: "权限变更"
- tapOn: "数据删除"

# 保留策略
- scrollUntilVisible: "保留策略"
- tapOn: "保留天数"
- inputText: "90"

- tapOn: "归档策略"
- tapOn: "自动归档"

- tapOn: "归档后保留天数"
- inputText: "365"

# 告警配置
- scrollUntilVisible: "告警配置"
- tapOn: "启用异常检测"

- tapOn: "检测规则"
- tapOn: "添加规则"

- tapOn: "规则名称"
- inputText: "批量删除告警"

- tapOn: "操作类型"
- tapOn: "删除"

- tapOn: "阈值"
- inputText: "10"

- tapOn: "时间窗口"
- inputText: "5"

- tapOn: "保存"
- assertVisible: "规则已保存"

# 导出配置
- scrollUntilVisible: "导出配置"
- tapOn: "启用自动导出"

- tapOn: "导出频率"
- tapOn: "每日"

- tapOn: "导出路径"
- inputText: "/var/audit/export"

- tapOn: "保存配置"
- assertVisible: "配置已保存"

# 合规检查
- tapOn: "返回"
- tapOn: "合规检查"
- assertVisible: "合规规则"

# 添加合规规则
- tapOn: "添加规则"
- tapOn: "规则名称"
- inputText: "密码策略合规"

- tapOn: "规则类型"
- tapOn: "密码强度"

- tapOn: "检查项"
- tapOn: "最小长度"
- tapOn: "包含特殊字符"
- tapOn: "定期更换"

- tapOn: "保存"
- assertVisible: "规则创建成功"

# 执行合规检查
- tapOn: "执行检查"
- assertVisible: "检查中"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible: "检查完成"
- assertVisible: "合规项"
- assertVisible: "不合规项"

# 查看不合规详情
- tapOn: "不合规项"
- assertVisible: "不合规详情"
- assertVisible: "问题描述"
- assertVisible: "建议措施"

# 导出合规报告
- tapOn: "导出报告"
- assertVisible: "报告导出成功"

# 审计归档管理
- tapOn: "返回"
- tapOn: "归档管理"
- assertVisible: "归档列表"

# 查看归档
- tapOn:
    text: ".*\\d{4}-\\d{2}.*"
    regex: true
    index: 0

- assertVisible: "归档详情"
- assertVisible: "记录数"
- assertVisible: "文件大小"

# 恢复归档
- tapOn: "恢复"
- assertVisible: "确认恢复"
- tapOn: "确认"
- assertVisible: "恢复成功"

# 截图验证
- takeScreenshot: "tests/screenshots/13-audit-light.png"

# 深色模式验证
- tapOn: "设置"
- tapOn: "深色模式"
- tapOn: "审计日志"
- takeScreenshot: "tests/screenshots/13-audit-dark.png"
