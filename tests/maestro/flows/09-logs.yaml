appId: com.llmgateway.web
---
# 测试：日志管理功能

- launchApp:
    clearState: false

# 进入日志管理页面
- assertVisible: "日志"
- tapOn: "日志"

# 验证日志列表
- assertVisible: "日志列表"
- assertVisible: "实时日志"
- assertVisible: "历史日志"

# 切换到实时日志
- tapOn: "实时日志"
- assertVisible: "日志流"
- assertVisible: "暂停"
- assertVisible: "清空"

# 验证日志条目
- assertVisible:
    text: ".*\\[INFO\\].*|.*\\[ERROR\\].*|.*\\[WARN\\].*"
    regex: true

# 测试日志过滤
- tapOn: "过滤"
- assertVisible: "日志级别"
- assertVisible: "时间范围"
- assertVisible: "来源"

# 按级别过滤
- tapOn: "日志级别"
- tapOn: "ERROR"
- tapOn: "应用"
- assertVisible:
    text: ".*\\[ERROR\\].*"
    regex: true

# 清除过滤器
- tapOn: "清除过滤"
- assertVisible: "全部日志"

# 按来源过滤
- tapOn: "过滤"
- tapOn: "来源"
- tapOn: "API网关"
- tapOn: "应用"

# 按时间范围过滤
- tapOn: "过滤"
- tapOn: "时间范围"
- tapOn: "最近1小时"
- tapOn: "应用"

# 测试日志搜索
- tapOn: "搜索"
- inputText: "request"
- assertVisible:
    text: ".*request.*"
    regex: true

# 清除搜索
- tapOn: "清除"

# 查看日志详情
- tapOn:
    text: ".*\\[.*\\].*"
    regex: true
    index: 0

- assertVisible: "日志详情"
- assertVisible: "时间戳"
- assertVisible: "级别"
- assertVisible: "消息"
- assertVisible: "追踪ID"
- assertVisible: "上下文"

# 复制日志内容
- tapOn: "复制"
- assertVisible: "已复制到剪贴板"

# 查看相关日志
- tapOn: "相关日志"
- assertVisible: "追踪链路"

# 关闭详情
- tapOn: "关闭"

# 切换到历史日志
- tapOn: "历史日志"
- assertVisible: "日志归档"

# 选择日期
- tapOn: "选择日期"
- assertVisible: "日历"
- tapOn:
    text: ".*\\d+.*"
    regex: true
    index: 0

# 下载日志文件
- tapOn: "下载日志"
- assertVisible: "日志文件"
- tapOn:
    text: ".*\\.log"
    regex: true
    index: 0

- assertVisible: "下载中"
- waitForAnimationToEnd:
    timeout: 5000

# 日志导出
- tapOn: "导出"
- assertVisible: "导出格式"
- assertVisible: "JSON"
- assertVisible: "CSV"
- assertVisible: "文本"

- tapOn: "JSON"
- tapOn: "时间范围"
- tapOn: "今天"

- tapOn: "导出"
- assertVisible: "导出成功"

# 日志统计
- tapOn: "统计"
- assertVisible: "日志统计"
- assertVisible: "总日志数"
- assertVisible: "错误数"
- assertVisible: "警告数"

# 按级别统计
- assertVisible: "级别分布"
- assertVisible: "INFO"
- assertVisible: "WARN"
- assertVisible: "ERROR"

# 按来源统计
- scrollUntilVisible: "来源分布"
- assertVisible: "API网关"
- assertVisible: "路由"
- assertVisible: "认证"

# 时间趋势
- scrollUntilVisible: "时间趋势"
- assertVisible: "小时趋势图"

# 日志配置
- tapOn: "返回"
- tapOn: "配置"
- assertVisible: "日志配置"

# 日志级别设置
- tapOn: "全局日志级别"
- tapOn: "INFO"

# 模块级别设置
- scrollUntilVisible: "模块日志级别"
- tapOn: "添加模块"

- tapOn: "模块名称"
- inputText: "auth"

- tapOn: "级别"
- tapOn: "DEBUG"

- tapOn: "保存"
- assertVisible: "配置已保存"

# 日志保留策略
- scrollUntilVisible: "保留策略"
- tapOn: "保留天数"
- inputText: "30"

- tapOn: "最大文件大小"
- inputText: "100"

- tapOn: "启用自动清理"

- tapOn: "保存"
- assertVisible: "策略已更新"

# 日志采样配置
- scrollUntilVisible: "采样配置"
- tapOn: "启用采样"

- tapOn: "采样率"
- inputText: "10"

- tapOn: "保存"
- assertVisible: "采样配置已保存"

# 截图验证
- takeScreenshot: "tests/screenshots/09-logs-light.png"

# 深色模式验证
- tapOn: "设置"
- tapOn: "深色模式"
- tapOn: "日志"
- takeScreenshot: "tests/screenshots/09-logs-dark.png"
