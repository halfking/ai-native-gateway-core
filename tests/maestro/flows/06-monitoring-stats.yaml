appId: com.llmgateway.web
---
# 测试：监控统计功能

- launchApp:
    clearState: false

# 进入监控页面
- assertVisible: "监控"
- tapOn: "监控"

# 验证统计概览
- assertVisible: "统计概览"
- assertVisible: "总请求数"
- assertVisible: "成功率"
- assertVisible: "平均延迟"
- assertVisible: "Token用量"

# 验证图表展示
- assertVisible: "请求趋势"
- assertVisible: "成功率趋势"
- assertVisible: "延迟分布"

# 测试时间范围选择
- tapOn: "时间范围"
- tapOn: "最近24小时"
- waitForAnimationToEnd
- assertVisible: "最近24小时"

- tapOn: "时间范围"
- tapOn: "最近7天"
- waitForAnimationToEnd
- assertVisible: "最近7天"

- tapOn: "时间范围"
- tapOn: "最近30天"
- waitForAnimationToEnd
- assertVisible: "最近30天"

# 验证模型维度统计
- scrollUntilVisible: "模型统计"
- assertVisible: "模型统计"
- assertVisible: "请求分布"

# 查看具体模型详情
- tapOn: "gpt-4"
- assertVisible: "模型详情"
- assertVisible: "请求次数"
- assertVisible: "成功率"
- assertVisible: "平均延迟"
- assertVisible: "Token消耗"

# 返回
- tapOn: "返回"

# 验证供应商维度统计
- scrollUntilVisible: "供应商统计"
- assertVisible: "供应商统计"

# 验证用户维度统计
- scrollUntilVisible: "用户统计"
- assertVisible: "用户统计"
- assertVisible: "Top用户"

# 测试导出功能
- tapOn: "导出数据"
- assertVisible: "导出格式"
- tapOn: "CSV"
- assertVisible: "导出成功"

# 验证刷新功能
- tapOn: "刷新"
- waitForAnimationToEnd

# 截图验证
- takeScreenshot: "tests/screenshots/06-monitoring-light.png"

# 深色模式
- tapOn: "设置"
- tapOn: "深色模式"
- takeScreenshot: "tests/screenshots/06-monitoring-dark.png"

# 验证暗色模式下的图表
- assertVisible: "请求趋势"
- assertVisible: "成功率趋势"
