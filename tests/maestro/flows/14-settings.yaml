appId: com.llmgateway.web
---
# 测试：系统设置功能

- launchApp:
    clearState: false

# 进入设置页面
- assertVisible: "设置"
- tapOn: "设置"

# 验证设置分类
- assertVisible: "通用设置"
- assertVisible: "安全设置"
- assertVisible: "集成配置"
- assertVisible: "外观设置"

# 通用设置
- tapOn: "通用设置"
- assertVisible: "系统名称"
- assertVisible: "时区"
- assertVisible: "语言"

# 修改系统名称
- tapOn: "系统名称"
- inputText: "LLM Gateway Pro"

- tapOn: "保存"
- assertVisible: "设置已保存"

# 时区设置
- tapOn: "时区"
- assertVisible: "选择时区"
- tapOn: "Asia/Shanghai"

# 语言设置
- tapOn: "语言"
- assertVisible: "简体中文"
- assertVisible: "English"
- assertVisible: "日本語"
- tapOn: "简体中文"

# 日期格式
- scrollUntilVisible: "日期格式"
- tapOn: "日期格式"
- assertVisible: "YYYY-MM-DD"
- assertVisible: "DD/MM/YYYY"
- assertVisible: "MM/DD/YYYY"
- tapOn: "YYYY-MM-DD"

# 时间格式
- tapOn: "时间格式"
- assertVisible: "24小时制"
- assertVisible: "12小时制"
- tapOn: "24小时制"

# 分页设置
- scrollUntilVisible: "分页设置"
- tapOn: "每页显示"
- inputText: "50"

# 保存通用设置
- tapOn: "保存"
- assertVisible: "设置已保存"

# 安全设置
- tapOn: "安全设置"
- assertVisible: "密码策略"
- assertVisible: "会话管理"
- assertVisible: "IP限制"

# 密码策略
- tapOn: "密码策略"
- assertVisible: "最小长度"

- tapOn: "最小长度"
- inputText: "12"

- tapOn: "包含大写字母"
- tapOn: "包含小写字母"
- tapOn: "包含数字"
- tapOn: "包含特殊字符"

- tapOn: "密码有效期(天)"
- inputText: "90"

- tapOn: "密码历史记录"
- inputText: "5"

- tapOn: "保存"
- assertVisible: "密码策略已更新"

# 会话管理
- tapOn: "会话管理"
- assertVisible: "会话超时"

- tapOn: "会话超时(分钟)"
- inputText: "30"

- tapOn: "空闲超时(分钟)"
- inputText: "15"

- tapOn: "启用单点登录"

- tapOn: "最大并发会话"
- inputText: "3"

- tapOn: "保存"
- assertVisible: "会话设置已更新"

# IP限制
- tapOn: "IP限制"
- assertVisible: "IP白名单"

- tapOn: "启用IP白名单"

- tapOn: "添加IP"
- inputText: "192.168.1.0/24"
- tapOn: "添加"

- tapOn: "添加IP"
- inputText: "10.0.0.0/8"
- tapOn: "添加"

- tapOn: "保存"
- assertVisible: "IP限制已更新"

# 双因素认证
- scrollUntilVisible: "双因素认证"
- tapOn: "启用双因素认证"

- tapOn: "认证方式"
- tapOn: "TOTP"
- tapOn: "短信"
- tapOn: "邮件"

- tapOn: "强制启用"

- tapOn: "保存"
- assertVisible: "双因素认证已启用"

# API安全
- scrollUntilVisible: "API安全"
- tapOn: "启用速率限制"

- tapOn: "全局速率限制"
- inputText: "10000"

- tapOn: "单用户速率限制"
- inputText: "100"

- tapOn: "启用API签名验证"

- tapOn: "保存"
- assertVisible: "API安全设置已更新"

# 集成配置
- tapOn: "集成配置"
- assertVisible: "邮件服务"
- assertVisible: "短信服务"
- assertVisible: "消息通知"

# 邮件服务
- tapOn: "邮件服务"
- assertVisible: "SMTP配置"

- tapOn: "SMTP服务器"
- inputText: "smtp.example.com"

- tapOn: "端口"
- inputText: "587"

- tapOn: "启用TLS"

- tapOn: "用户名"
- inputText: "[REDACTED:email]"

- tapOn: "密码"
- inputText: "password123"

- tapOn: "发件人地址"
- inputText: "[REDACTED:email]"

- tapOn: "发件人名称"
- inputText: "LLM Gateway"

- tapOn: "测试邮件"
- inputText: "[REDACTED:email]"
- tapOn: "发送"
- assertVisible: "测试邮件已发送"

- tapOn: "保存"
- assertVisible: "邮件配置已保存"

# 短信服务
- tapOn: "短信服务"
- assertVisible: "短信提供商"

- tapOn: "提供商"
- assertVisible: "阿里云"
- assertVisible: "腾讯云"
- assertVisible: "Twilio"
- tapOn: "阿里云"

- tapOn: "AccessKey ID"
- inputText: "LTAI5txxxx"

- tapOn: "AccessKey Secret"
- inputText: "xxxxxxxx"

- tapOn: "签名"
- inputText: "LLM Gateway"

- tapOn: "测试短信"
- inputText: "[REDACTED:phone]"
- tapOn: "发送"
- assertVisible: "测试短信已发送"

- tapOn: "保存"
- assertVisible: "短信配置已保存"

# 消息通知
- tapOn: "消息通知"
- assertVisible: "Webhook配置"

- tapOn: "添加Webhook"
- tapOn: "名称"
- inputText: "Slack通知"

- tapOn: "URL"
- inputText: "https://hooks.slack.com/services/xxx"

- tapOn: "事件类型"
- tapOn: "告警"
- tapOn: "故障转移"
- tapOn: "配额告警"

- tapOn: "保存"
- assertVisible: "Webhook已添加"

# 测试Webhook
- tapOn: "测试"
- assertVisible: "测试消息已发送"

# 外观设置
- tapOn: "外观设置"
- assertVisible: "主题"
- assertVisible: "Logo"
- assertVisible: "自定义样式"

# 主题设置
- tapOn: "主题"
- assertVisible: "浅色"
- assertVisible: "深色"
- assertVisible: "自动"
- tapOn: "自动"

# Logo设置
- scrollUntilVisible: "Logo"
- tapOn: "上传Logo"
- assertVisible: "选择文件"

# 品牌颜色
- scrollUntilVisible: "品牌颜色"
- tapOn: "主色调"
- inputText: "#1890ff"

- tapOn: "辅助色"
- inputText: "#52c41a"

- tapOn: "预览"
- assertVisible: "颜色预览"

# 自定义CSS
- scrollUntilVisible: "自定义样式"
- tapOn: "自定义CSS"
- inputText: ".header { background: #1890ff; }"

- tapOn: "保存"
- assertVisible: "外观设置已保存"

# 备份与恢复
- tapOn: "备份与恢复"
- assertVisible: "数据备份"
- assertVisible: "配置导出"

# 创建备份
- tapOn: "创建备份"
- assertVisible: "备份选项"

- tapOn: "备份内容"
- tapOn: "数据库"
- tapOn: "配置文件"
- tapOn: "日志文件"

- tapOn: "备份说明"
- inputText: "定期备份"

- tapOn: "开始备份"
- assertVisible: "备份中"

- waitForAnimationToEnd:
    timeout: 10000

- assertVisible: "备份成功"

# 查看备份列表
- assertVisible: "备份列表"
- assertVisible:
    text: ".*\\d{4}-\\d{2}-\\d{2}.*"
    regex: true

# 下载备份
- tapOn:
    text: ".*\\d{4}-\\d{2}-\\d{2}.*"
    regex: true
    index: 0

- tapOn: "下载"
- assertVisible: "下载中"

# 恢复备份
- tapOn: "恢复"
- assertVisible: "危险操作"
- assertVisible: "此操作将覆盖当前数据"

- tapOn: "确认恢复"
- inputText: "RESTORE"
- tapOn: "确认"
- assertVisible: "恢复成功"

# 配置导出
- tapOn: "配置导出"
- assertVisible: "导出格式"
- assertVisible: "JSON"
- assertVisible: "YAML"
- tapOn: "JSON"

- tapOn: "导出范围"
- tapOn: "全部配置"

- tapOn: "导出"
- assertVisible: "配置导出成功"

# 配置导入
- tapOn: "导入配置"
- assertVisible: "选择文件"

- tapOn: "验证配置"
- assertVisible: "配置验证通过"

- tapOn: "导入"
- assertVisible: "配置导入成功"

# 系统信息
- tapOn: "系统信息"
- assertVisible: "版本信息"
- assertVisible: "系统状态"

# 版本信息
- assertVisible: "版本号"
- assertVisible: "构建日期"
- assertVisible: "Git提交"

# 系统状态
- scrollUntilVisible: "系统状态"
- assertVisible: "运行时间"
- assertVisible: "CPU使用率"
- assertVisible: "内存使用"
- assertVisible: "磁盘空间"

# 检查更新
- tapOn: "检查更新"
- assertVisible: "检查中"

- waitForAnimationToEnd:
    timeout: 3000

- assertVisible: "当前已是最新版本"

# 许可证信息
- scrollUntilVisible: "许可证"
- assertVisible: "许可证类型"
- assertVisible: "到期时间"
- assertVisible: "授权用户数"

# 重置设置
- tapOn: "高级"
- tapOn: "重置设置"
- assertVisible: "确认重置"
- assertVisible: "所有自定义设置将被重置"

# 取消重置
- tapOn: "取消"

# 截图验证
- takeScreenshot: "tests/screenshots/14-settings-light.png"

# 深色模式验证
- tapOn: "外观设置"
- tapOn: "主题"
- tapOn: "深色"
- takeScreenshot: "tests/screenshots/14-settings-dark.png"
