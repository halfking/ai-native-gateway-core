appId: com.llmgateway.admin
---
# 测试3：凭据管理功能

# 1. 登录
- launchApp
- tapOn: "用户名"
- inputText: "admin"
- tapOn: "密码"
- inputText: "${ADMIN_PASSWORD}"
- tapOn: "登录"

# 2. 进入凭据管理页面
- tapOn: "凭据管理"
- assertVisible: "凭据列表"
- assertVisible: "添加凭据"

# 3. 明主题验证
- assertVisible: "凭据名称"
- assertVisible: "提供商"
- assertVisible: "状态"
- assertVisible: "操作"

# 4. 切换暗主题验证
- tapOn:
    id: "theme-toggle"
- assertVisible:
    id: "dark-theme-indicator"
- assertVisible: "凭据列表"

# 5. 测试凭据搜索
- tapOn:
    id: "credential-search-input"
- inputText: "test"
- assertVisible: "搜索结果"

# 6. 清空搜索
- tapOn:
    id: "clear-search"

# 7. 测试凭据详情
- tapOn:
    text: "查看"
    index: 0
- assertVisible: "凭据详情"
- assertVisible: "基本信息"
- tapOn: "关闭"

# 8. 测试凭据状态筛选
- tapOn:
    id: "status-filter"
- tapOn: "启用"
- assertVisible: "凭据列表"

# 9. 测试自检功能
- tapOn:
    text: "自检"
    index: 0
- assertVisible: "自检中"

# 10. 退出
- tapOn:
    id: "user-menu"
- tapOn: "退出登录"
