- tapOn: "确认"
- assertVisible: "成员添加成功"

# 查看成员权限
- tapOn: "李四"
- assertVisible: "用户权限"
- assertVisible: "继承的角色权限"

# 移除成员
- tapOn: "移除"
- assertVisible: "确认移除"
- tapOn: "确认"
- assertVisible: "成员已移除"

# 测试编辑角色
