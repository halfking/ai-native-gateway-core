appId: com.llmgateway.web
---
# 测试：角色与权限管理功能

- launchApp:
    clearState: false

# 进入角色管理页面
- assertVisible: "角色管理"
- tapOn: "角色管理"

# 验证角色列表
- assertVisible: "角色列表"
- assertVisible: "添加角色"
- assertVisible: "系统角色"
- assertVisible: "自定义角色"

# 查看系统角色
- assertVisible: "管理员"
- assertVisible: "开发者"
- assertVisible: "运维"
- assertVisible: "只读"

# 创建自定义角色
- tapOn: "添加角色"
- assertVisible: "角色信息"

# 填写基本信息
- tapOn: "角色名称"
- inputText: "API管理员"

- tapOn: "角色标识"
- inputText: "api-admin"

- tapOn: "描述"
- inputText: "负责API配置和管理"

# 功能权限配置
- scrollUntilVisible: "功能权限"
- assertVisible: "仪表板"
- assertVisible: "请求管理"
- assertVisible: "模型管理"
- assertVisible: "密钥管理"

# 选择权限
- tapOn: "仪表板"
- tapOn: "查看"

- tapOn: "请求管理"
- tapOn: "查看"
- tapOn: "创建"
- tapOn: "编辑"

- tapOn: "模型管理"
- tapOn: "查看"
- tapOn: "创建"
- tapOn: "编辑"
- tapOn: "删除"

- tapOn: "密钥管理"
- tapOn: "查看"
- tapOn: "创建"

# 数据权限配置
- scrollUntilVisible: "数据权限"
- tapOn: "数据范围"
- assertVisible: "全部数据"
- assertVisible: "本部门数据"
- assertVisible: "本人数据"
- tapOn: "本部门数据"

# 租户权限
- scrollUntilVisible: "租户权限"
- tapOn: "可访问租户"
- tapOn: "选择租户"
- tapOn: "租户A"
- tapOn: "租户B"
- tapOn: "确认"

# API权限
- scrollUntilVisible: "API权限"
- tapOn: "允许的端点"
- tapOn: "/v1/chat/completions"
- tapOn: "/v1/models"
- tapOn: "/v1/admin/keys"

# 速率限制
- scrollUntilVisible: "速率限制"
- tapOn: "每分钟请求数"
- inputText: "1000"

- tapOn: "每日请求数"
- inputText: "100000"

# 时间限制
- scrollUntilVisible: "时间限制"
- tapOn: "启用时间限制"

- tapOn: "工作日"
- tapOn: "周一"
- tapOn: "周二"
- tapOn: "周三"
- tapOn: "周四"
- tapOn: "周五"

- tapOn: "工作时间"
- tapOn: "开始时间"
- inputText: "09:00"

- tapOn: "结束时间"
- inputText: "18:00"

# 保存角色
- tapOn: "保存"
- assertVisible: "角色创建成功"

# 验证角色列表
- assertVisible: "API管理员"
- assertVisible: "自定义角色"

# 查看角色详情
- tapOn: "API管理员"
- assertVisible: "角色详情"
- assertVisible: "基本信息"
- assertVisible: "权限列表"
- assertVisible: "成员列表"

