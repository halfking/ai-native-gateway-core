- tapOn: "有效权限"
- assertVisible: "功能权限"
- assertVisible: "数据权限"
- assertVisible: "API权限"

# 临时授权
- tapOn: "临时授权"
- tapOn: "选择权限"
- tapOn: "租户管理"

- tapOn: "有效期"
- inputText: "24"

- tapOn: "授权原因"
- inputText: "临时处理问题"

- tapOn: "确认"
- assertVisible: "临时授权成功"

