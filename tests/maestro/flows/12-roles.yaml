- tapOn: "返回"
- tapOn: "用户管理"
- assertVisible: "用户列表"

# 创建用户
- tapOn: "添加用户"
- tapOn: "用户名"
- inputText: "testuser"

- tapOn: "邮箱"
- inputText: "[REDACTED:email]"

- tapOn: "手机"
- inputText: "[REDACTED:phone]"

# 分配角色
- scrollUntilVisible: "角色分配"
- tapOn: "选择角色"
- tapOn: "API管理员"
- tapOn: "开发者"

# 部门设置
- scrollUntilVisible: "部门"
- tapOn: "选择部门"
