- assertVisible: "模型管理"

# 覆盖权限
- tapOn: "覆盖权限"
- tapOn: "模型管理"
- tapOn: "删除"

- tapOn: "保存"
- assertVisible: "子角色创建成功"

# 角色克隆
- tapOn: "API管理员"
- tapOn: "克隆"

- tapOn: "新角色名称"
- inputText: "API管理员-副本"

- tapOn: "确认"
- assertVisible: "角色克隆成功"

# 权限审计
- tapOn: "返回"
- tapOn: "权限审计"
- assertVisible: "权限变更历史"

# 查看变更记录
- assertVisible: "操作时间"
- assertVisible: "操作人"
- assertVisible: "操作类型"
- assertVisible: "变更内容"

# 权限对比
