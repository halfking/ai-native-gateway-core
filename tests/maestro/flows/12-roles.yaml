- tapOn: "禁用用户"
- inputText: "离职"
- tapOn: "确认"
- assertVisible: "用户已禁用"

# 测试启用用户
- tapOn: "启用用户"
- assertVisible: "用户已启用"

# 权限测试工具
- tapOn: "返回"
- tapOn: "权限测试"
- assertVisible: "测试工具"

- tapOn: "选择用户"
- tapOn: "testuser"

- tapOn: "测试权限"
- inputText: "model:create"

- tapOn: "测试"
- assertVisible: "权限检查结果"
- assertVisible: "允许"

# 批量授权
- tapOn: "返回"
- tapOn: "批量授权"
- tapOn: "选择用户"
- tapOn: "testuser"
- tapOn: "user2"

- tapOn: "选择角色"
- tapOn: "只读"

- tapOn: "确认"
- assertVisible: "批量授权成功"

# 截图验证
- takeScreenshot: "tests/screenshots/12-roles-light.png"

# 深色模式验证
- tapOn: "设置"
- tapOn: "深色模式"
- tapOn: "角色管理"
- takeScreenshot: "tests/screenshots/12-roles-dark.png"
