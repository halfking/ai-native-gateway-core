version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: llm_gateway_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test123
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d llm_gateway_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  license-authority:
    build:
      context: ../../
      dockerfile: cmd/license-authority/Dockerfile
    environment:
      DB_URL: postgresql://test:test123@postgres:5432/llm_gateway_test
      REDIS_ADDR: redis:6379
      PORT: 8443
      LOG_LEVEL: info
    ports:
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8443/healthz"]
      interval: 3s
      timeout: 5s
      retries: 15

volumes:
  postgres_test_data:
