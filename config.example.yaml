# LLM Gateway 配置文件

service:
  name: llm-gateway
  version: 1.0.0
  environment: production

server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 90s

# 性能组件
cache:
  algorithm: lru
  capacity: 10000
  ttl: 5m
  enable_metrics: true

pool:
  max_idle_conns: 100
  max_idle_conns_per_host: 10
  idle_conn_timeout: 90s

batcher:
  max_batch_size: 10
  max_wait_time: 100ms
  max_workers: 4

# 可靠性组件
circuit_breaker:
  max_requests: 3
  interval: 10s
  timeout: 60s
  min_requests: 10
  failure_threshold: 0.5

rate_limiter:
  algorithm: token_bucket
  rate: 100
  burst: 200

retry:
  strategy: exponential
  max_attempts: 3
  initial_delay: 100ms
  max_delay: 10s
  multiplier: 2.0

timeout:
  request: 30s
  connect: 10s
  read_header: 5s
  read_body: 30s
  write: 10s

# 可观测性
logging:
  level: info
  format: json
  output: stdout

tracing:
  enabled: true
  endpoint: localhost:4317
  sample_rate: 1.0

# 安全
safety:
  enabled: true
  block_harmful: true
  block_pii: true
  block_profanity: false
