# LLM Gateway configuration example.
# Copy to config.yml and provide all secrets through LLM_GATEWAY_* environment
# variables. Environment values take precedence over this file.

listen: ":8781"
log_level: "info"
static_dir: "web/dist"
bg_mode: "full"
# active owns background workers; traffic-only is for a warmed blue-green candidate.
runtime_role: "active"
deploy_env: "development"
default_language: "en"
session_ttl_hours: 168
upstream_timeout_seconds: 120
stream_timeout_seconds: 900
stream_chunk_timeout_seconds: 300
# Maximum bytes in one physical upstream SSE line, including its LF/CRLF terminator.
# This is per-line, not a cumulative response limit; non-stream responses retain 128 MiB.
sse_max_line_bytes: 16777216
first_byte_timeout_seconds: 30
keepalive_interval_seconds: 15
enable_empty_stream_gate: true
enable_credential_fp_slots: true
credential_fp_slot_active_gate_seconds: 300
credential_fp_slot_reclaim_idle_seconds: 1800

# ── Request survival (docs/修订0811/18+19) ─────────────────────────────
# Protocol-safe keepalive + recoverable-error retry inside the client
# connection (Phase 1) and durable task takeover across disconnect/restart
# (Phase 2). ALL OFF by default; mutually exclusive with
# LLM_GATEWAY_STREAM_RETRY_ENABLED (survival wins at startup).
request_survival_enabled: false
request_survival_durable_enabled: false
request_survival_interactive_deadline_seconds: 18000
request_survival_retry_interval_seconds: 30
request_survival_night_max_attempts: 600
request_survival_night_start_hour: 20
request_survival_durable_deadline_seconds: 86400
request_survival_status_interval_seconds: 60
request_survival_retry_base_seconds: 30
request_survival_retry_max_seconds: 120
request_survival_worker_count: 4
request_survival_worker_lease_seconds: 60
request_survival_max_attempts: 100
request_survival_max_active_tasks_per_tenant: 100
# Empty allowlist = all tenants once enabled; set tenants for canary rollout.
# request_survival_tenant_allowlist:
#   - "alpha"

# ── 双模式存储架构（storage）─────────────────────────────────────────────
# 网关支持两种存储后端，通过 storage_mode 切换：
#
#   1. full 模式（生产/多实例部署）：PostgreSQL + Redis，全部状态落外部
#      数据库，支持水平扩展与蓝绿发布。明细配置在 full_storage 段，
#      postgres_url 与 redis_url 为必填项。
#   2. lite 模式（单机/轻量部署）：SQLite 数据库 + 本地文件目录，零外部
#      依赖，开箱即用。明细配置在 lite_storage 段，sqlite_path 为必填项，
#      其余字段缺省时自动采用下列默认值。
#
# 切换方法：修改本文件的 storage_mode，或设置环境变量
# LLM_GATEWAY_STORAGE_MODE=full|lite（各明细字段也有对应的
# LLM_GATEWAY_* 环境变量，见 config/storage.go 的 env tag）。
# 模式切换后需重启网关进程生效；从 lite 迁移到 full 时请先完成
# 数据迁移（sqlite → postgres），详见现有部署文档。
# 默认 full（生产安全默认值）：本文件会被复制为镜像内的 config.yaml，
# 误设为 lite 会静默禁用 PostgreSQL。本地开发请显式改为 "lite"
# 或设置 LLM_GATEWAY_STORAGE_MODE=lite。
storage_mode: "full"

# full 模式明细（storage_mode=full 时必填 postgres_url 与 redis_url）。
full_storage:
  postgres_url: "postgres://user:password@127.0.0.1:5432/llm_gateway?sslmode=disable"
  redis_url: "redis://127.0.0.1:6379/2"
  # 连接池上限；<=0 时默认 100。
  max_connections: 100

# lite 模式明细（storage_mode=lite 时必填 sqlite_path，其余为默认值示例）。
lite_storage:
  sqlite_path: "./data/llm-gateway.db"
  bodies_dir: "./data/session_bodies"
  cache_dir: "./data/cache"
  logs_dir: "./data/request_logs"
  sqlite_pragmas:
    journal_mode: "WAL"
    cache_size_kb: 64000
    synchronous: "NORMAL"
    busy_timeout_ms: 5000
  cache_ttl_hours: 24
  cache_max_size_gb: 10
  async_writers: 4
  retention:
    session_bodies_days: 30
    request_logs_days: 7
    cache_hours: 24
