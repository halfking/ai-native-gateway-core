# R1.12 本地测试 docker-compose
#
# 用法:
#   docker-compose -f docker-compose.local-r112.yml config    # 验证语法
#   ./scripts/local-r112-up.sh                                  # 启动 + 等健康
#   ./scripts/local-r112-down.sh                                # 停止 + 清理 volumes
#
# 端口映射 (避免与本地其他 compose 冲突):
#   - 5432  postgres  (citusdata/citus:11.3.0, 与生产一致)
#   - 6379  redis
#   - 1080  llm-mock       (nginx 健康桩, 供 healthcheck 依赖)
#   - 18080 llm-mock-upstream (真 OpenAI 兼容 mock, aiohttp)
#   - 8781  gateway        (v1 生产入口, cmd/gateway)
#   - 8782  gateway-v2     (v2 演示入口, cmd/gateway-v2)
#   - 10302 memora-mcp     (mock 占位, 注释说明)
#
# 所有 volume 名前缀 r112_ —— 避免与本地其他 docker-compose 冲突

version: "3.9"

x-pg-env: &pg-env
  POSTGRES_USER: kxuser
  POSTGRES_PASSWORD: kxpass
  POSTGRES_DB: postgres

services:
  # ─────────────────────────────────────────────────────────────────────
  # PostgreSQL (Citus 11.3, 与 184/71 生产一致)
  # ─────────────────────────────────────────────────────────────────────
  postgres:
    image: citusdata/citus:11.3.0
    container_name: r112_postgres
    environment:
      <<: *pg-env
    ports:
      - "5432:5432"
    volumes:
      - r112_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kxuser -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: r112_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - r112_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # Memora MCP server (mock 占位)
  # ─────────────────────────────────────────────────────────────────────
  # TODO(r112): 替换为真实 mcp-server 镜像 (registry.internal.example.com/kx-memora-mcp:<tag>)
  # 当前用 nginx:alpine + 假 /healthz 端点保证 gateway-v2 启动不报错
  # ─────────────────────────────────────────────────────────────────────
  memora-mcp:
    image: nginx:alpine
    container_name: r112_memora_mcp
    ports:
      - "10302:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz | grep -q ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      # 注入假 healthz 响应
      - ./scripts/mocks/memora-healthz.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # LLM mock (nginx 健康桩, 供 gateway-v2 启动 healthcheck 依赖)
  # ─────────────────────────────────────────────────────────────────────
  llm-mock:
    image: nginx:alpine
    container_name: r112_llm_mock
    ports:
      - "1080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ | grep -q llm-mock-ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./scripts/mocks/llm-mock.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # LLM mock upstream (真 OpenAI 兼容 mock, aiohttp, 支持 chat/completions)
  # 用于 v1/v2 gateway 的真正端到端转发测试
  # ─────────────────────────────────────────────────────────────────────
  llm-mock-upstream:
    build:
      context: ./scripts/mocks/llm-mock-upstream
      dockerfile: Dockerfile
    image: r112-llm-mock-upstream:local
    container_name: r112_llm_mock_upstream
    ports:
      - "18080:18080"
    environment:
      # 本地快速验证: 50-100ms 延迟 (非 fp_slot 回归的 10-15s)
      MOCK_LATENCY_MS_MIN: "50"
      MOCK_LATENCY_MS_MAX: "100"
      MOCK_TOKEN: "local-mock"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:18080/healthz | grep -q '\\\"ok\\\"' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # Gateway v1 (生产入口, cmd/gateway, 本地构建)
  # 监听 8781, 复用同一套 PG/Redis/mock-upstream
  # ─────────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: r112-gateway:local
    container_name: r112_gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-mock-upstream:
        condition: service_healthy
    ports:
      - "8781:8781"
    environment:
      # ── 监听与运行环境 ──
      LLM_GATEWAY_LISTEN: ":8781"
      LLM_GATEWAY_ENV: "local"           # 非 production, 避免 fail-closed panic
      LOG_LEVEL: "info"
      # ── 依赖 (compose 内服务名) ──
      LLM_GATEWAY_DATABASE_URL: "postgres://kxuser:kxpass@postgres:5432/llm_gateway?sslmode=disable"
      LLM_GATEWAY_REDIS_ADDR: "redis:6379"
      # ── credential 解密 key (与 03-local-mock-credential.sql 配对) ──
      # 32-byte deterministic key, base64url. LOCAL ONLY, never production.
      LLM_GATEWAY_CREDENTIAL_ENCRYPTION_KEY: "AwoRGB8mLTQ7QklQV15lbHN6gYiPlp2kq7K5wMfO1dw"
      # ── JWT signing secret (本地测试用固定值) ──
      LLM_GATEWAY_JWT_SECRET: "local-dev-secret-do-not-use-in-production-12345678"
      # ── 关闭数据面 auth (本地测试, 不设 API_KEY 即默认 off) ──
      # LLM_GATEWAY_API_KEY 留空 → auth middleware 不生效
      # ── CORS (v1 启动时 panic 若未设; 本地用通配) ──
      LLM_GATEWAY_CORS_ORIGINS: "*"
      # ── 附件目录 (容器内可写, 避免启动时 mkdir 失败) ──
      LLM_GATEWAY_ATTACHMENT_DIR: "/tmp/attachments"
      # ── 指向真 mock upstream (仅用于无 credential 命中时的兜底) ──
      LLM_GATEWAY_UPSTREAM: "http://llm-mock-upstream:18080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8781/healthz | grep -q ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # Gateway v2 (本地 build, cmd/gateway-v2/Dockerfile)
  # ─────────────────────────────────────────────────────────────────────
  gateway-v2:
    build:
      context: .
      dockerfile: cmd/gateway-v2/Dockerfile
    image: r112-gateway-v2:local
    container_name: r112_gateway_v2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      memora-mcp:
        condition: service_healthy
      llm-mock:
        condition: service_healthy
      llm-mock-upstream:
        condition: service_healthy
    ports:
      - "8782:8782"
    environment:
      # ── 基础 ──
      GIN_MODE: release
      LOG_LEVEL: info
      LISTEN_ADDR: ":8080"
      # ── 依赖指向 compose 内服务名 (docker DNS 自动解析) ──
      DATABASE_URL: postgres://kxuser:kxpass@postgres:5432/llm_gateway?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      MEMORA_URL: http://memora-mcp:80
      # 指向真 OpenAI 兼容 mock (支持 chat/completions 真实回包)
      OPENAI_BASE_URL: http://llm-mock-upstream:18080
      # ── v2 特性开关 ──
      GATEWAY_V2_ENABLED: "true"
      COMPRESSOR_ENABLED: "true"
      ARMOR_ENABLED: "true"
      CREDENTIAL_FP_SLOTS_ENABLED: "true"
      # ── 关闭外部认证 (本地测试不需要 Casdoor) ──
      AUTH_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8782/healthz | grep -q ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # Test runner (alpine + curl, 用于一次性跑 curl 测试)
  # ─────────────────────────────────────────────────────────────────────
  test-runner:
    image: alpine:3.20
    container_name: r112_test_runner
    entrypoint: ["sleep", "infinity"]
    networks:
      - r112_net
    profiles:
      - test

volumes:
  r112_pg_data:
    name: r112_pg_data
  r112_redis_data:
    name: r112_redis_data

networks:
  r112_net:
    name: r112_net
    driver: bridge
