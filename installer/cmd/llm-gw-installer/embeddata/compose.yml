# llm-gateway-go 全栈 docker-compose
# 由 llm-gw-installer 自动生成，请勿手工修改
# 重要：所有数据通过 bind-mount 到容器外目录（防止容器重启丢失）
#
# 目录结构：
#   ~/llm-gateway/
#   ├── db/data/       → PostgreSQL 数据 (citus 容器 /var/lib/postgresql/data)
#   ├── db/init/       → SQL 初始化文件（备份）
#   ├── redis/data/    → Redis 数据 (redis 容器 /data)
#   ├── attachments/   → 应用附件 (gateway 容器 /opt/llm-gateway-go/data/attachments)
#   ├── app/logs/      → 应用日志 (gateway 容器 /var/log/llm-gateway)
#   └── backups/       → 备份目录
#
# 卸载: docker compose -f <path> down

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  citus:
    image: kx-citus:v11.3.0
    container_name: kx-citus
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: kxuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: llm_gateway
      PGDATA: /var/lib/postgresql/data/pgdata
    # ★ r1041 轮（2026-10-28）：慢 SQL 观测设施。
    #   起因：仓内 ≥19 个门以 pg_stat_statements 为事实源（§143.77~§143.99 等）
    #   ⇒ 而 pg_stat_statements **必须 postmaster preload** 才可用
    #   ⇒ 只 CREATE EXTENSION 不 preload ⇒ 每次查询报
    #     「pg_stat_statements must be loaded via shared_preload_libraries」
    #   ⇒ ⇒ 那些门**永远拿不到数据** = 假绿。
    #   同时 log_min_duration_statement 默认 -1 ⇒ 慢查询日志从不开。
    #   ⇒ 这里显式打开两者，让「慢 SQL」在客户实例上也可观测。
    #   ★ 用 command 的 postgres 参数（而非 ALTER SYSTEM）：逗号列表的引号
    #     在 ALTER SYSTEM 下是已知脚枪（docs/06-deployment/02-database/
    #     local-pg-sync-from-252.md §5 Q6）。
    command:
      - postgres
      - -c
      - shared_preload_libraries=citus,citus_columnar,pg_stat_statements
      - -c
      - log_min_duration_statement=1000
      - -c
      - logging_collector=on
      - -c
      - log_line_prefix=%m [%p] %q%u@%d
      - -c
      - log_statement=none
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      # ⭐ PG 数据全部 bind-mount 到容器外
      - ./db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kxuser"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: kx-redis:v7-alpine
    container_name: kx-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      # ⭐ Redis 数据 bind-mount 到容器外
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  llm-gateway-go:
    image: kx-llm-gateway-go:${APP_IMAGE_TAG}
    container_name: kx-llm-gateway-go
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      citus: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kxuser:${POSTGRES_PASSWORD}@citus:5432/llm_gateway?sslmode=disable
      LLM_GATEWAY_REDIS_ADDR: redis:6379
      LLM_GATEWAY_REDIS_PASSWORD: ${REDIS_PASSWORD}
      LLM_GATEWAY_ATTACHMENT_DIR: /opt/llm-gateway-go/data/attachments
      LLM_GATEWAY_RAW_LOG_DIR: /opt/llm-gateway-go/data/raw-logs
      LLM_GATEWAY_BACKUP_DIR: /opt/llm-gateway-go/data/backups
      LLM_GATEWAY_PERSISTENT_LOG_DIR: /var/log/llm-gateway
    ports:
      - "${APP_PORT:-8781}:8781"
    volumes:
      # ⭐ 附件持久化
      - ./attachments:/opt/llm-gateway-go/data/attachments
      # ⭐ 应用日志持久化
      - ./app/logs:/var/log/llm-gateway
      # ⭐ 原始请求/响应日志持久化
      - ./raw-logs:/opt/llm-gateway-go/data/raw-logs
      # ⭐ 数据库降级备份持久化
      - ./backups:/opt/llm-gateway-go/data/backups
      # ⭐ 版本文件 bind-mount（方便热更新）
      - ./app/VERSION:/opt/llm-gateway-go/VERSION:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8781/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
