# llm-gateway-go 全栈 docker-compose
# 由 llm-gw-installer 自动生成，请勿手工修改
# 卸载: docker compose -f <path> down [-v]
services:
  citus:
    image: kx-citus:v11.3.0
    container_name: kx-citus
    restart: unless-stopped
    environment:
      POSTGRES_USER: kxuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: llm_gateway
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - citus-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kxuser"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: kx-redis:v7-alpine
    container_name: kx-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  llm-gateway-go:
    image: kx-llm-gateway-go:${APP_IMAGE_TAG}
    container_name: kx-llm-gateway-go
    restart: unless-stopped
    depends_on:
      citus: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kxuser:${POSTGRES_PASSWORD}@citus:5432/llm_gateway?sslmode=disable
      LLM_GATEWAY_REDIS_ADDR: redis:6379
      LLM_GATEWAY_REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${APP_PORT:-8781}:8781"
    volumes:
      - ./volumes/attachments:/opt/llm-gateway-go/data/attachments
      - ./volumes/logs:/var/log/llm-gateway
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8781/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  citus-data:
  redis-data:
