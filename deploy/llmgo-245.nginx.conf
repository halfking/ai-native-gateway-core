# llmgo.kxpms.cn on 245 (pre-prod test environment)
# Deployed: 2026-07-12 · commit e37f7a8c
# Purpose: pre-production tenant-feature testing against PG17 on 252 (172.16.2.210),
#          BEFORE pushing to 154 (47.97.111.154).
# Architecture: native systemd (no docker/podman); binary at /opt/llm-gateway-go/gateway
#               listening on 127.0.0.1:8781. PG17 accessed via internal network to 252.
# Cert: /etc/letsencrypt/live/kxpms.cn/fullchain.pem (certbot auto-renewed on 245;
#       SAN already includes llmgo.kxpms.cn, verified 2026-07-12).
# DNS: llmgo.kxpms.cn -> 8.136.114.245 (verified 2026-07-12).
# Aliyun ICP interception only affects port 80; HTTPS works directly on 443.

upstream llmgo_local_245 {
    server 127.0.0.1:8781 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    include /etc/nginx/conf.d/00-security-hardening.snippet;
    autoindex off;
    listen 80;
    server_name llmgo.kxpms.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    location ~ /\.(git|svn|hg|env|htaccess|htpasswd|docker|kube) { deny all; return 404; }
    location ~ /\.(env|envrc|env\.local|env\.production|env\.development)$ { deny all; return 404; }
    location ~* (^|/)(wp-config|wp-settings|web\.config|composer\.json|composer\.lock|\.npmrc|\.docker/|\.git/|\.ssh/|\.aws/|Procfile|README\.md)$ { deny all; return 404; }
    location ~* (^|/)(database\.yml|secrets\.yml|\.htpasswd|credentials\.json|service-account.*\.json|\.kube/config)$ { deny all; return 404; }
    location ~* (union.*select|select.*from|concat.*char|<script|javascript:|onerror=|onload=) { return 444; }
}

server {
    include /etc/nginx/conf.d/00-security-hardening.snippet;
    autoindex off;
    listen 443 ssl http2;
    server_name llmgo.kxpms.cn;

    client_max_body_size 256m;
    client_body_timeout 1200s;
    keepalive_timeout 300s;

    ssl_certificate     /etc/letsencrypt/live/kxpms.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kxpms.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_LLMGO_245:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/llmgo.kxpms.cn-access.log;
    error_log  /var/log/nginx/llmgo.kxpms.cn-error.log;

    # 2026-08-27: Enable gzip for SSE live-stream (P1 bandwidth optimization)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript text/event-stream;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # Marker-driven deploy page. The marker is created only after index.html
    # is complete and removed after all deploy verification gates pass.
    # 599 is a synthetic marker-only code: real backend 503s (e.g. maintain
    # proxy outage envelope) must pass through to clients unmasked.
    error_page 599 =200 /__llm_gateway_upgrade.html;
    location = /__llm_gateway_upgrade.html {
        internal;
        alias /opt/llm-gateway-go/maintenance/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-LLM-Gateway-Upgrade "in-progress" always;
    }

    location = /api/admin/live-stream {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 599; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }
    location = /api/admin/live-stream/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 599; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/v1/(chat/completions|messages) {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 599; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Backend endpoints must bypass the SPA fallback below.
    location = /healthz {
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location = /readyz {
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location ^~ /api/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 599; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_cache off;
    }
    location ^~ /v1/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 599; }
        # LLM streaming completions are also text/event-stream but must NOT be
        # gzipped before dedicated latency validation (typing-effect chunking).
        # Overrides the server-level gzip on introduced 2026-08-27.
        gzip off;
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_cache off;
    }
    location ^~ /v1beta/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 599; }
        gzip off;
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_cache off;
    }
    location ^~ /v2/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 599; }
        gzip off;
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_cache off;
    }
    location = /metrics {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 599; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    # Vue SPA routes live under /admin/* (e.g. /admin/turns). Do not proxy the
    # entire prefix: only this operational endpoint belongs to the gateway.
    location = /admin/config/reload {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 599; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 599; }
        root /opt/llm-gateway-go/current/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(git|svn|hg|env|htaccess|htpasswd|docker|kube) { deny all; return 404; }
    location ~ /\.(env|envrc|env\.local|env\.production|env\.development)$ { deny all; return 404; }
    location ~* (^|/)(wp-config|wp-settings|web\.config|composer\.json|composer\.lock|\.npmrc|\.docker/|\.git/|\.ssh/|\.aws/|Procfile|README\.md)$ { deny all; return 404; }
    location ~* (^|/)(database\.yml|secrets\.yml|\.htpasswd|credentials\.json|service-account.*\.json|\.kube/config)$ { deny all; return 404; }
    location ~* (union.*select|select.*from|concat.*char|<script|javascript:|onerror=|onload=) { return 444; }
}
