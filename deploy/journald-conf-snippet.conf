# =====================================================================
# deploy/journald-conf-snippet.conf — systemd-journald 大小/保留期限制
#
# 用途:
#   在 154 等 llm-gateway-go.stderr 走 journald 的服务器上, 限制
#   /var/log/journal/ 总大小 + 保留期, 防止 journal 撑爆磁盘
#   (154 历史撑到 4.0G 时已接近 systemd 默认 ~4G 上限)。
#
# 配套脚本: scripts/configure-journald.sh (install/uninstall/status/verify)
#
# 部署方式 (drop-in):
#   install 时直接 cp 此文件到 /etc/systemd/journald.conf.d/llm-gateway-go.conf
#   systemd 自动合并 drop-in (主文件 /etc/systemd/journald.conf 不动)
#   uninstall = rm drop-in 文件
#
# 与 logrotate 的关系:
#   - 245 (append: 模式): logrotate copytruncate 管 stderr 文件
#   - 154 (journal 模式): journald drop-in 管 journal 大小 (本 snippet)
#
# 参数选择:
#   ★ 2026-10-04 由 200M 改为 3G（生产实测驱动，不是拍脑袋）
#
#   原值 200M 有一个**从未被发现的失效条件**：
#     MaxRetentionSec=14day 一直配着，但它**从来没生效过** ——
#     journald 先撞到 SystemMaxUse=200M 的容量上限，就按**大小**轮转了，
#     时间上限根本没机会起作用。
#     实测 2026-10-04：日志速率 14 MB/h(154) / 17 MB/h(245)，
#     200M 名义上够 14 小时，实际最早只查得到 **3.4 小时** ——
#     中间有突发把预算吃光，旧的已被轮转掉，排查窗口被压到远低于配置值。
#     代价是实打实的：10-02 21:00 ~ 10-03 21:00 那次 24 小时写入失败事件
#     （落库率 28.3%，缺口 2,261,557 行）**至今无法定位根因**，
#     因为 error 原文全部落在留存窗口之外。
#     见 docs/06-deployment/04-runbooks/runbooks/
#         2026-10-04-ursm-write-amplification-measurement.md §5.6
#
#   现值 3G      — 按实测速率 × 24 × 7 = 154 2.30 GB / 245 2.79 GB，
#                   留约 15% 突发余量后取 3G，两台各占空闲磁盘 11%
#                   （154 剩 26G / 245 剩 28G，实测于 2026-10-04）
#   MaxRetentionSec=14day — 保留 14 天（3G 装不下 14 天，
#                          实际由容量上限先生效；两者取先到者）
#   MaxFileSec=1month   — 单文件最大 1 个月 (额外安全网)
#                          (注: 该参数在某些 systemd 版本下不生效)
#
# ★ 本文件是 **SSOT**：deploy-seamless.sh [9.6/9] 每次部署都会用它
#   **无条件覆盖** /etc/systemd/journald.conf.d/llm-gateway-go.conf。
#   ⇒ 在机器上手工调 journald 会在下一次部署时静默被改回去
#     （2026-10-04 实测踩到：245 部署后 3G 被打回 200M）。
#   ⇒ 要调这个值，只能改这里。
#
# 不修改的默认参数 (snippet 故意不覆盖):
#   Storage=auto        — 默认即可 (持久到 /var/log/journal/)
#   Compress=yes        — 压缩节省空间
#   ForwardToSyslog=yes — 保留 rsyslog 兼容性
#
# 引用: rule 03 §6b (日志归档) + rule 11 §14 (持续验证)
# =====================================================================

[Journal]
# llm-gateway-go stderr 限制 (SSOT，2026-10-04 按实测日志速率改为 3G / 14day)
SystemMaxUse=3G
MaxRetentionSec=14day
# 单文件额外安全网
MaxFileSec=1month