# llmgateway.internal.example.com on 245 (pre-prod test environment)
# Deployed: 2026-07-12 · commit e37f7a8c
# Purpose: pre-production tenant-feature testing against PG17 on 252 (172.16.2.210),
#          BEFORE pushing to 154 (47.97.111.154).
# Architecture: native systemd (no docker/podman); binary at /opt/llm-gateway-go/gateway
#               listening on 127.0.0.1:8781. PG17 accessed via internal network to 252.
# Cert: /etc/letsencrypt/live/internal.example.com/fullchain.pem (certbot auto-renewed on 245;
#       SAN already includes llmgateway.internal.example.com, verified 2026-07-12).
# DNS: llmgateway.internal.example.com -> 8.136.114.245 (verified 2026-07-12).
# Aliyun ICP interception only affects port 80; HTTPS works directly on 443.

upstream llmgo_local_245 {
    # 2026-08-31: Atomic blue-green fragment; deployer replaces this file and reloads nginx.
    # Original hardcoded `server 127.0.0.1:8781;` did not allow nginx -s reload to
    # switch traffic between the active (8781) and the canary (8782) candidate.
    include /opt/llm-gateway-go/run/active-upstream.conf;
    keepalive 32;
}

server {
    include /etc/nginx/conf.d/00-security-hardening.snippet;
    autoindex off;
    listen 80;
    server_name llmgateway.internal.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    location ~ /\.(git|svn|hg|env|htaccess|htpasswd|docker|kube) { deny all; return 404; }
    location ~ /\.(env|envrc|env\.local|env\.production|env\.development)$ { deny all; return 404; }
    location ~* (^|/)(wp-config|wp-settings|web\.config|composer\.json|composer\.lock|\.npmrc|\.docker/|\.git/|\.ssh/|\.aws/|Procfile|README\.md)$ { deny all; return 404; }
    location ~* (^|/)(database\.yml|secrets\.yml|\.htpasswd|credentials\.json|service-account.*\.json|\.kube/config)$ { deny all; return 404; }
    location ~* (union.*select|select.*from|concat.*char|<script|javascript:|onerror=|onload=) { return 444; }
}

server {
    include /etc/nginx/conf.d/00-security-hardening.snippet;
    autoindex off;
    listen 443 ssl http2;
    server_name llmgateway.internal.example.com;

    client_max_body_size 256m;
    client_body_timeout 1200s;
    keepalive_timeout 300s;

    ssl_certificate     /etc/letsencrypt/live/internal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/internal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_LLMGO_245:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/llmgateway.internal.example.com-access.log;
    error_log  /var/log/nginx/llmgateway.internal.example.com-error.log;

    # Marker-driven deploy page. The marker is created only after index.html
    # is complete and removed after all deploy verification gates pass.
    error_page 503 =200 /__llm_gateway_upgrade.html;
    location = /__llm_gateway_upgrade.html {
        internal;
        alias /opt/llm-gateway-go/maintenance/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-LLM-Gateway-Upgrade "in-progress" always;
    }

    location = /api/admin/live-stream {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }
    location = /api/admin/live-stream/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ~ ^/v1/(chat/completions|messages) {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Backend endpoints must bypass the SPA fallback below.
    location = /healthz {
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location = /readyz {
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    # 2026-08-31: /version is the deploy-identity probe (deploy-seamless.sh
    # step 9 verifies the public ingress returns the expected build version).
    # Without this explicit location, /version falls through to the SPA
    # fallback below and returns index.html instead of the gateway's JSON
    # response, causing the public-ingress version check to fail and the
    # deploy to auto-rollback.
    location = /version {
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location ^~ /api/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_cache off;
    }
    location ^~ /v1/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_cache off;
    }
    location ^~ /v1beta/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_cache off;
    }
    location ^~ /v2/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_cache off;
    }
    location = /metrics {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    # Vue SPA routes live under /admin/* (e.g. /admin/turns). Do not proxy the
    # entire prefix: only this operational endpoint belongs to the gateway.
    location = /admin/config/reload {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 2026-08-27: static-asset long cache (hash-named SPA chunks; republishing
    # changes filenames so a long TTL is safe). Served without the UPGRADING
    # marker gate: the upgrade page is self-contained and does not fetch these.
    # nosniff is restated because add_header at this level drops server-level
    # header inheritance.
    location ~ ^/(assets|logo-.*\.(png|svg)|favicon\.(png|ico)|donation-qr\.png)(/|$) {
        root /opt/llm-gateway-go/current/web;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        autoindex off;
    }

    # ---- ai-native-maintain same-origin wiring (restored 2026-09-01) ----
    # 245 backend: ai-native-maintain on 127.0.0.1:8082 (systemd unit).
    # Mirror of deploy/nginx/maintain-api-proxy.snippet.conf with upstream
    # bound to local maintain backend. Place BEFORE location / so the SPA
    # fallback does not intercept these paths.
    location = /maintain-api/healthz {
        proxy_pass http://127.0.0.1:8082/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /maintain-api/readyz {
        proxy_pass http://127.0.0.1:8082/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /maintain-api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-ID "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
    location ^~ /maintain/assets/ {
        alias /opt/kaixuan/ai-native-maintain/web/maintain/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        autoindex off;
    }

    location ^~ /maintain/ {
        alias /opt/kaixuan/ai-native-maintain/web/maintain/;
        index index.html;
        try_files $uri /maintain/index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }
    location = /maintain {
        return 302 /maintain/home;
    }

    # 2026-10-04 unified entry: the mobile surface (/m + /m-assets) is owned by
    # the gateway binary (cmd/gateway/mobile_static.go). nginx only proxies it;
    # the apex decision below stays the single place that routes devices.
    location = /m {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        return 302 /m/;
    }
    location ^~ /m/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location ^~ /m-assets/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llmgo_local_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 2026-09-24 authfix: domain apex -> maintain product home; ?login=* keeps the
    # Gateway SPA login entry (deploy/nginx/product-home-root.snippet.conf,
    # local-root variant). Main-site fallback below stays /index.html (Gateway SPA).
    # 2026-10-04 unified entry: phone-class UA gets /m/ instead; ?desktop=* is the
    # explicit PC escape (same "param present = stay on PC" reading as the
    # gateway). UA token list mirrors mobileUserAgentRe in mobile_static.go.
    location = / {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        error_page 418 = /index.html;
        if ($arg_login != "") { return 418; }
        # bare "?desktop" (no value) must also count as present — $arg_desktop
        # is value-only, so test the raw query string for the param name.
        if ($args ~ '(^|&)desktop(=|$)') { return 418; }
        if ($http_user_agent ~* "(iphone|ipod|ipad|android|windows phone|iemobile|blackberry|bb10|opera mini|opera mobi|mobile safari)") { return 302 /m/; }
        return 302 /maintain/home;
    }

    location / {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        root /opt/llm-gateway-go/current/web;
        index index.html;
        try_files $uri /index.html;
    }

    location ~ /\.(git|svn|hg|env|htaccess|htpasswd|docker|kube) { deny all; return 404; }
    location ~ /\.(env|envrc|env\.local|env\.production|env\.development)$ { deny all; return 404; }
    location ~* (^|/)(wp-config|wp-settings|web\.config|composer\.json|composer\.lock|\.npmrc|\.docker/|\.git/|\.ssh/|\.aws/|Procfile|README\.md)$ { deny all; return 404; }
    location ~* (^|/)(database\.yml|secrets\.yml|\.htpasswd|credentials\.json|service-account.*\.json|\.kube/config)$ { deny all; return 404; }
    location ~* (union.*select|select.*from|concat.*char|<script|javascript:|onerror=|onload=) { return 444; }
}
