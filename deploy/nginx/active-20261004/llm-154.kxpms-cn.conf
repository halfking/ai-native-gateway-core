# ============================================================================
# llmgateway.internal.example.com on 154 (replaces 56 + 71 for this domain)
# Updated: 2026-08-31 — 启用蓝绿部署动态 upstream include
# Updated: 2026-07-23 — 添加 menu-config.json 静态文件服务
# Updated: 2026-07-08 (AI agent task) — body_size 256m, read_timeout 3600s
# Rationale: AI reasoning/thinking SSE streams can hold open 30min+
#            client_max_body_size 256m to cover base64-embedded images
# Note: Aliyun ICP interception only affects port 80 with *.internal.example.com Host.
#       Port 443 is NOT intercepted. HTTPS works directly.
# ============================================================================

# upstream: dynamic blue-green switch via include
# The actual server directive is in /opt/llm-gateway-go/run/active-upstream.conf
upstream llm_local {
    include /opt/llm-gateway-go/run/active-upstream.conf;
    keepalive 32;
}

# HTTP: only used for redirect to HTTPS (ACME would also work here)
# Note: Aliyun ICP may intercept *.internal.example.com on :80, but HTTPS users wont hit this
server {
    listen 80;
    listen [::]:80;
    server_name llmgateway.internal.example.com;
    return 301 https://$host$request_uri;
}

# HTTPS: main service
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name llmgateway.internal.example.com;

    client_max_body_size 256m;
    client_body_timeout 1200s;
    keepalive_timeout 300s;

    # SSL cert (covers *.internal.example.com SAN)
    ssl_certificate /etc/letsencrypt/live/internal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/internal.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Logging
    access_log /var/log/nginx/llm-kxpms-cn-access.log;
    error_log /var/log/nginx/llm-kxpms-cn-error.log;

    # Marker-driven deploy page. The marker is created only after index.html
    # is complete and removed after all deploy verification gates pass.
    error_page 503 =200 /__llm_gateway_upgrade.html;
    location = /__llm_gateway_upgrade.html {
        internal;
        alias /opt/llm-gateway-go/maintenance/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-LLM-Gateway-Upgrade "in-progress" always;
    }

    # Keep probes real while public/root locations are gated.
    location = /healthz {
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 2026-08-31: deploy-seamless.sh step 9 (公网入口版本身份校验)
    # probes https://127.0.0.1/version and greps for the expected
    # build version. Without this explicit location, /version
    # falls through to the SPA fallback and returns index.html
    # instead of the gateway JSON response. Mirrors /healthz and
    # /readyz location blocks above.
    location = /version {
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location = /readyz {
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 2026-07-23: Gateway 菜单配置静态文件（供 Maintain 动态加载）
    location = /menu-config.json {
        alias /opt/llm-gateway-go/current/web/menu-config.json;
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Type "application/json" always;
    }

    # WebSocket live stream (long-lived, even longer than reasoning)
    location = /api/admin/live-stream {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }
    location = /api/admin/live-stream/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    # LLM completions (potentially very long-running with reasoning/thinking)
    location ~ ^/v1/(chat/completions|messages) {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 2026-07-24 fix: 转发 ops reporter 心跳到 license-authority (8443)
    location /api/v1/ops/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 2026-09-11 fix: 转发 runtime collector 上报到 license-authority (8443)
    # 修复 /api/v1/collect/runtime 落入 ^~ /api/ 打到网关返回 404、运行时指标丢失
    location /api/v1/collect/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
    }

    # 2026-08-27 fix: 通用 /api/ 路由 (包括 /api/auth/token 等认证端点)
    # 必须在 SPA fallback 之前，否则会被 try_files 拦截返回 405
    location ^~ /api/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_cache off;
    }

    # /v1/, /v1beta/, /v2/ OpenAI-compatible endpoints
    location ^~ /v1/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_cache off;
    }
    location ^~ /v1beta/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_cache off;
    }
    location ^~ /v2/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 1200s;
        proxy_buffering off;
        proxy_cache off;
    }

    # metrics endpoint
    location = /metrics {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # operational endpoint (not proxied to gateway, but may coexist with Vue /admin/* SPA routes)
    location = /admin/config/reload {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Default: everything else
    # 2026-08-21: SPA static + history fallback for llm-gateway-go web/dist.
    # Root cause of 401 missing_key on /dashboard etc.: previous catch-all
    # proxied every non-prefixed path to gateway, hitting AuthMiddleware.
    # Now serve /opt/llm-gateway-go/current/web as the SPA root; fallback
    # /index.html for SPA history paths. Higher-priority exact/regex
    # locations (= /healthz, = /menu-config.json, = /api/admin/live-stream,
    # ~ ^/v1/(chat/completions|messages), /api/v1/ops/) keep matching first,
    # so behavior is preserved for routes that already work.
    # 2026-08-27: static-asset long cache (hash-named SPA chunks; republishing
    # changes filenames so a long TTL is safe). Served without the UPGRADING
    # marker gate: the upgrade page is self-contained and does not fetch these.
    # nosniff is restated because add_header at this level drops server-level
    # header inheritance.
    location ~ ^/(assets|logo-.*\.(png|svg)|favicon\.(png|ico)|donation-qr\.png)(/|$) {
        root /opt/llm-gateway-go/current/web;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        autoindex off;
    }

    # ---- ai-native-maintain same-origin wiring (restored 2026-09-01) ----
    # 154 backend: ai-native-maintain on 127.0.0.1:8082 (systemd unit).
    location = /maintain-api/healthz {
        proxy_pass http://127.0.0.1:8082/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /maintain-api/readyz {
        proxy_pass http://127.0.0.1:8082/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /maintain-api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-ID "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
    location ^~ /maintain/assets/ {
        alias /opt/kaixuan/ai-native-maintain/web/maintain/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        autoindex off;
    }
    location ^~ /maintain/ {
        alias /opt/kaixuan/ai-native-maintain/web/maintain/;
        index index.html;
        try_files $uri /maintain/index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }
    location = /maintain {
        return 302 /maintain/home;
    }

    # 2026-10-04 unified entry: the mobile surface (/m + /m-assets) is owned by
    # the gateway binary (cmd/gateway/mobile_static.go). nginx only proxies it;
    # the apex decision below stays the single place that routes devices.
    # Mirror of the 245 patch — see deploy/nginx/active-20261004/ in the repo.
    location = /m {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        return 302 /m/;
    }
    location ^~ /m/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location ^~ /m-assets/ {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        proxy_pass http://llm_local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 2026-09-24 authfix: domain apex -> maintain product home; ?login=* keeps the
    # Gateway SPA login entry (deploy/nginx/product-home-root.snippet.conf,
    # local-root variant). Main-site fallback below stays /index.html (Gateway SPA).
    # 2026-10-04 unified entry: phone-class UA gets /m/ instead; ?desktop=* is the
    # explicit PC escape (same "param present = stay on PC" reading as the
    # gateway). UA token list mirrors mobileUserAgentRe in mobile_static.go.
    location = / {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        error_page 418 = /index.html;
        if ($arg_login != "") { return 418; }
        if ($args ~ '(^|&)desktop(=|$)') { return 418; }
        if ($http_user_agent ~* "(iphone|ipod|ipad|android|windows phone|iemobile|blackberry|bb10|opera mini|opera mobi|mobile safari)") { return 302 /m/; }
        return 302 /maintain/home;
    }

    location / {
        if (-f /opt/llm-gateway-go/maintenance/UPGRADING) { return 503; }
        root /opt/llm-gateway-go/current/web;
        index index.html;
        try_files $uri /index.html;
    }
}
