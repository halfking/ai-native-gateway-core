# download.kxpms.cn on 245 — public offline artifact CDN (ticket-gated via gateway)
#
# DNS: download.kxpms.cn -> 8.136.114.245
# Cert: /etc/letsencrypt/live/kxpms.cn/ (wildcard or expand SAN via certbot)
# Artifacts: /var/www/download/llm-gateway-go/{version}/
# Ticket validation: gateway GET /llm-gateway-go/:version/:file?ticket=

upstream llmgo_download_245 {
    server 127.0.0.1:8781 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    include /etc/nginx/conf.d/00-security-hardening.snippet;
    autoindex off;
    listen 80;
    server_name download.kxpms.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    include /etc/nginx/conf.d/00-security-hardening.snippet;
    autoindex off;
    listen 443 ssl http2;
    server_name download.kxpms.cn;

    client_max_body_size 64m;
    client_body_timeout 600s;
    keepalive_timeout 120s;

    ssl_certificate     /etc/letsencrypt/live/kxpms.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kxpms.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_DOWNLOAD_245:10m;

    access_log /var/log/nginx/download.kxpms.cn-access.log;
    error_log  /var/log/nginx/download.kxpms.cn-error.log;

    # Ticket-gated downloads — proxied to gateway file handler
    location /llm-gateway-go/ {
        proxy_pass http://llmgo_download_245;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Health / version probe (optional)
    location = /healthz {
        proxy_pass http://llmgo_download_245/healthz;
    }

    location / {
        return 302 https://llmgo.kxpms.cn/download;
    }
}
