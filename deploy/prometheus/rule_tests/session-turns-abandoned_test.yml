# promtool 单元测试 —— session_turns abandoned 告警族的**求值语义**（审计 §9.92.7）
#
# 为什么要这份文件：Go 侧那 6 道门只能证明「文本里有 or vector(0)」「阈值是比例」。
# **求值语义只能由这里证** —— 与 auto-route-selection-output_test.yml 正典同款。
#
# 三条告警各自的承重场景：
#   A — ①「从未写过」：输入里**完全没有** mark 序列（CounterVec 首次 Inc() 前
#       不导出任何时间序列 ⇒ 求和得到**空向量**而不是 0 ⇒ 空向量 `== 0` 仍
#       是空向量 ⇒ 告警永不响，而这正是它唯一要抓的场景）。
#       A **证明** ① 里的 `or (0 * up)` 不是装饰。
#   B — ②「写失败」：mark_failed 有增量。
#   C — ③「打标但几乎全打空」：mark_no_row 占绝对多数。
#
# ★ 与 819 时代的关键差别（场景 D 是它的姊妹形态，必须同时成立）：
#   D — mark_no_row 有序列但**增量恒 0**，且 up=1。
#       D 不触发 ③ ⇒ 证明 ③ 的比例判据**没有**退化成「有序列就响」；
#       A 与 D 同时成立 ⇒ ① 靠的是 `or (0 * up)` 而不是任何别的巧合。
#
# ⚠ 场景 C 的阈值 0.9 是**按设计推的、未经生产实测**（820 未上 252）。
#   这份场景文件只证明**表达式语义正确**，不证明阈值选得好不好——
#   后者是部署后的校准项，已由 Go 门 TestRulesStateTheUncalibratedThreshold 钉住。
#
# 运行：
#   docker run --rm -v "$PWD/deploy/prometheus:/p" --entrypoint promtool \
#     prom/prometheus test rules /p/rule_tests/session-turns-abandoned_test.yml

rule_files:
  - ../rules/session-turns-abandoned.yml

evaluation_interval: 1m

tests:
  # ── A：① 从未写过（CounterVec 空向量陷阱）─────────────────────────
  - interval: 1m
    input_series:
      - series: 'up{job="llm-gateway", instance="gw1"}'
        values: '1+0x200'
    alert_rule_test:
      - eval_time: 2h10m
        alertname: AbandonedTurnPadNeverWritten
        exp_alerts:
          - exp_labels:
              severity: warning
              component: session-abandoned
              job: llm-gateway
              instance: gw1
            exp_annotations:
              summary: "session_turns abandoned 落点从未被打标（写路径没跑）"
              description: |
                1 小时内 `op="mark"` 速率恒为 0，且已持续 2 小时。

                这不是「没有请求遗弃」——**没有请求遗弃时判据也不会触发**
                （只有 t0 缺失的请求才进这条分支）。`mark` 恒为 0 意味着
                **写路径压根没跑**，三种可能：

                  ① 二进制没有 820 的接线（`markAbandonedTurn` 未被调用）
                  ② 820 迁移没应用 ⇒ 打标语句报错 ⇒ 走 fail-open ⇒ 这种情况
                     应当同时看到 `op="mark_failed"` 增长（见 `AbandonedTurnPadWritesFailing`）
                  ③ 请求根本没进到 `updateRequestLog` 的竞态回落分支

                先跑这一句区分 ① 和 ②：

                    curl -s :8780/metrics | grep abandoned_turn_ops

                - 完全没有这个指标 ⇒ 情况 ①：二进制里没有这段代码
                - 有 `{op="mark_failed"}` ⇒ 情况 ②：**820 迁移没上**
              runbook: |
                1. 确认二进制含 820 接线（`grep -c markAbandonedTurn` 于
                   domains/hooks/observability/telemetry/）。
                2. 确认 820 已应用：
                   `SELECT count(*) FROM information_schema.columns
                     WHERE table_name IN ('session_turns','session_turns_hot')
                       AND column_name='is_abandoned'`
                   应为 2；为 0 则先跑迁移再重启。
                3. **不要**因为「一条遗弃都没有」就判定落点正常——空与「没接线」
                   在值上不可区分，这正是本告警存在的理由。
      # ③ 的分母为 0（本场景无任何 abandoned 计数器）⇒ 不得触发。
      - eval_time: 2h10m
        alertname: AbandonedTurnPadMostlyMissingItsRows
        exp_alerts: []

  # ── E：进程挂了（up=0）**不得**报「落点没接线」────────────────────
  #
  # 这一条曾经被错放在场景 A 里当姊妹断言，但 A 的 gw1 是 up=1 且没有 mark
  # 序列 —— 那是**应该**响的场景，放在那里等于自己和自己矛盾。
  # 「进程没在跑」必须有自己的输入（up=0），否则断言不成立。
  - interval: 1m
    input_series:
      - series: 'up{job="llm-gateway", instance="gw5"}'
        values: '0+0x200'
    alert_rule_test:
      - eval_time: 2h10m
        alertname: AbandonedTurnPadNeverWritten
        exp_alerts: []
      - eval_time: 2h10m
        alertname: AbandonedTurnPadMostlyMissingItsRows
        exp_alerts: []

  # ── D：① 有序列但增量为 0（证明 A 不是「有序列就响」）────────────
  - interval: 1m
    input_series:
      - series: 'up{job="llm-gateway", instance="gw2"}'
        values: '1+0x200'
      - series: 'llm_gateway_abandoned_turn_ops_total{job="llm-gateway", instance="gw2", op="mark"}'
        values: '0+0x200'
      - series: 'llm_gateway_abandoned_turn_ops_total{job="llm-gateway", instance="gw2", op="mark_no_row"}'
        values: '0+0x200'
    alert_rule_test:
      # mark 存在 ⇒ 不触发 ①（否则告警会在健康系统上常亮）。
      - eval_time: 2h10m
        alertname: AbandonedTurnPadNeverWritten
        exp_alerts: []
      # ③ 的分母为 0 ⇒ 不触发。
      - eval_time: 2h10m
        alertname: AbandonedTurnPadMostlyMissingItsRows
        exp_alerts: []

  # ── B：② 写失败 ─────────────────────────────────────────────────
  - interval: 1m
    input_series:
      - series: 'up{job="llm-gateway", instance="gw3"}'
        values: '1+0x200'
      - series: 'llm_gateway_abandoned_turn_ops_total{job="llm-gateway", instance="gw3", op="mark"}'
        values: '0+100x120'
      - series: 'llm_gateway_abandoned_turn_ops_total{job="llm-gateway", instance="gw3", op="mark_failed"}'
        values: '0+7x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: AbandonedTurnPadWritesFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: session-abandoned
              job: llm-gateway
              instance: gw3
            exp_annotations:
              summary: "abandoned 落点打标在持续失败（fail-open 分支）"
              description: |
                30 分钟内 `mark_failed` 有增长。

                打标是**刻意 fail-open** 的：失败只 slog.Warn，**不回滚**请求日志
                主事务（理由：820 未应用时不应打挂全部请求日志）。代价是
                **失败在请求侧完全不可见**，只有这条告警能发现。

                两种可能的含义：

                - `relation "session_turns_hot" does not exist` ⇒ 820 迁移没应用
                - `column "is_abandoned" does not exist` ⇒ 表结构漂移
                  （820 自带列集守卫，迁移时会报 missing column）
                - 超时/连接错误 ⇒ 数据库侧问题
              runbook: |
                1. 看 slog 的 `abandoned_turn: mark failed` 行确认 error 形态。
                2. 迁移未应用 ⇒ 跑 820 后重启；列集漂移 ⇒ 820 守卫会直接报出
                   缺哪张表的哪一列。
                3. 恢复后确认漏标是否可补：`mark` 是幂等 UPDATE，可对
                   历史终态行重跑（判据：t0 缺失的请求在 v1 侧无从查证，
                   所以**历史漏标不可追补**——这是本落点的固有限制）。

  # ── C：③ 打标但几乎全打空（比例判据）────────────────────────────
  - interval: 1m
    input_series:
      - series: 'up{job="llm-gateway", instance="gw4"}'
        values: '1+0x260'
      # mark_no_row 压倒性多数 ⇒ 比例 ≈ 0.99 > 0.9
      - series: 'llm_gateway_abandoned_turn_ops_total{job="llm-gateway", instance="gw4", op="mark_no_row"}'
        values: '0+99x260'
      - series: 'llm_gateway_abandoned_turn_ops_total{job="llm-gateway", instance="gw4", op="mark"}'
        values: '0+1x260'
    alert_rule_test:
      # 比例健康（mark 多于 mark_no_row）⇒ ③ 不得响。
      - eval_time: 3h10m
        alertname: AbandonedTurnPadMostlyMissingItsRows
        exp_alerts:
          - exp_labels:
              severity: critical
              component: session-abandoned
              job: llm-gateway
              instance: gw4
            exp_annotations:
              summary: "abandoned 落点超过 90% 的打标尝试没命中任何行（竞态在系统性漏标）"
              description: |
                1 小时窗口内，**超过九成**的打标尝试结果是 `mark_no_row`。

                `mark_no_row` 本身**不是故障**：终态 turn 是**异步** mirror 写进来的
                （outbox 事件），而打标跑在同步的 `updateRequestLog` 里，两者无顺序
                保证，所以打标**经常**先于终态行存在。健康系统里这个比例也不会是 0。

                但它到 0.9 意味着：**绝大多数遗弃请求根本没被打上标记**，
                而 `is_abandoned` 列**看起来仍然权威**。
                **那比没有这个落点更糟**——没有落点时你知道你不知道。

                ⇒ 本告警响的时候，请把 `is_abandoned = TRUE` 的计数当作
                  **下界**而不是全集。
              runbook: |
                1. 确认不是两条面都漏：`mark` 若也为 0，那是 ①/②，不是本条。
                2. 根因是 mirror 的异步落行晚于打标。临时缓解：把打标改为
                   在 outbox 消费者侧执行（那里终态行必然已存在）。
                   本轮**未实施**（见审计 §9.92.4 的遗留）。
                3. 阈值 0.9 是**按设计推的、未经生产实测**（820 尚未上 252）。
                   首次部署后必须用真实比例回归校准，否则这条要么永远响要么永不响。
