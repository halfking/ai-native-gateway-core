# promtool 单元测试 —— request_abandoned 告警族的**求值语义**（R35 审计落地）。
#
# 54a63d0e5 落地本告警族时只有 Go 文本断言（选择器/字面量互查），没有
# promtool 场景；R35 审计 A 包用自建场景实证了告警③的空向量减法洞
# （clear 序列从未存在 ⇒ 减法为空 ⇒ 极端「DELETE 半边死亡」形态三告警
# 全哑），并照 auto-route-selection-output_test.yml 正典补本文件。
#
# 场景 A 是本文件的承重条：mark 在涨、clear 序列完全缺席 ⇒ ③必须触发。
# 修复（`(sum(clear) or 0*sum(mark))` 兜底）前该场景静默——摘掉兜底，
# 场景 A 立刻变红。
#
# R36 补三个护栏自证场景（子代理复审指出的覆盖缺口）：
#   J — ① 的 up=0 分支（摘掉 `and on up==1` 守卫臂 ⇒ J 红，M-10 变异承重）；
#   K — ② 的 clear_failed 变体臂（同 selector regex 的另一半）；
#   L — ③ 的 mark 序列缺席分工边界（写路径死亡由①管，③不得越界双响）。
#
# exp_annotations 全量收录（promtool 省略即视为期望空注解）：与
# auto-route-selection-output_test.yml 正典同款全量比对。
#
# 运行：
#   docker run --rm -v "$PWD/deploy/prometheus:/p" --entrypoint promtool \
#     prom/prometheus test rules /p/rule_tests/request-abandoned_test.yml

rule_files:
  - ../rules/request-abandoned.yml

evaluation_interval: 1m

tests:
  # ── ③ 的承重场景：clear 序列「从未存在」⇒ 必须触发（修复前静默）────
  - interval: 1m
    name: 场景A mark在涨 clear序列完全缺席 → Leaking必须触发
    input_series:
      - series: 'up{job="llm-gateway",instance="gw1"}'
        values: '1+0x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="mark"}'
        values: '0+60x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: RequestAbandonedLeaking
        exp_alerts:
          - exp_labels:
              severity: critical
              component: session-abandoned
              job: llm-gateway
              instance: gw1
            exp_annotations:
              summary: |-
                request_abandoned 在以超过 50% 的速率泄漏（DELETE 半边失效）
              description: |
                30 分钟窗口内，**超过一半**的「开始」标记没有被「终态」标记删掉。

                判据是**比例**而不是绝对条数，因为要抓的失效形态是
                **DELETE 半边整体坏掉**——那时差值 ≈ 全流量，与部署规模无关；
                而正常遗弃率实测只有 **0.047%**（252，19/40,585），
                永远达不到 50%。

                ⇒ 这条告警响的时候，`request_abandoned` 表**正在以全流量速率增长**。
                  照 §9.66 实测（13,500 请求/天），漏 50% 就是每天数千行，
                  而这张表的语义是「abandoned 集合」——**一旦混入已完成但没删掉的
                  申请，它就不再能被当遗弃集合读了**。

                注意与 `RequestAbandonedMarkerWritesFailing` 的分工：
                本条抓的是**成功写入但不删除**（`clear` 没跑或没生效）；
                那条抓的是**写失败**（`clear_failed` 计数在涨）。
                若两条同时响，先按本条处置（泄漏更严重且更隐蔽）。
              runbook: |
                1. 确认 DELETE 半边还在跑：代码里 `clearRequestAbandonedPending`
                   的调用点在 `updateRequestLog` 的 `if logsWrite {}` **之外**；
                   仓库里有一道形状门
                   `TestAbandonedMarkerCallsAreOutsideTheS4Gate` 钉住这个位置。
                   若该门被跳过，先跑 `go test ./domains/hooks/observability/telemetry/
                   -run TestAbandonedMarker` 看红因。
                2. 确认终态路径真的在发：如果 `mark` 在涨而 `clear` 恒 0，
                   查 `clear` 调用点是否被拆掉，或 `updateRequestLog` 是否
                   根本没被调用（那会让所有请求都算遗弃）。
                3. 修复后已泄漏的行需要手工清理：
                   `SELECT count(*) FROM public.request_abandoned;`
                   确认这些 request_id 在 `request_logs` 里**已有终态**之后，
                   再 `DELETE FROM public.request_abandoned WHERE created_at < now() - interval '1 day'`。
                   **先验证再删**——直接 DELETE 会把真正的遗弃记录一起清掉。

  # ── ③ 正常形态：clear 与 mark 同速 → 不触发 ─────────────────────────
  - interval: 1m
    name: 场景B mark与clear同速 → 不触发
    input_series:
      - series: 'up{job="llm-gateway",instance="gw1"}'
        values: '1+0x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="mark"}'
        values: '0+60x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="clear"}'
        values: '0+60x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: RequestAbandonedLeaking
        exp_alerts: []

  # ── ③ clear 序列在但恒 0 → 触发（兜底不掩盖真泄漏）──────────────────
  - interval: 1m
    name: 场景C mark在涨 clear恒0 → 触发
    input_series:
      - series: 'up{job="llm-gateway",instance="gw1"}'
        values: '1+0x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="mark"}'
        values: '0+60x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="clear"}'
        values: '0+0x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: RequestAbandonedLeaking
        exp_alerts:
          - exp_labels:
              severity: critical
              component: session-abandoned
              job: llm-gateway
              instance: gw1
            exp_annotations:
              summary: |-
                request_abandoned 在以超过 50% 的速率泄漏（DELETE 半边失效）
              description: |
                30 分钟窗口内，**超过一半**的「开始」标记没有被「终态」标记删掉。

                判据是**比例**而不是绝对条数，因为要抓的失效形态是
                **DELETE 半边整体坏掉**——那时差值 ≈ 全流量，与部署规模无关；
                而正常遗弃率实测只有 **0.047%**（252，19/40,585），
                永远达不到 50%。

                ⇒ 这条告警响的时候，`request_abandoned` 表**正在以全流量速率增长**。
                  照 §9.66 实测（13,500 请求/天），漏 50% 就是每天数千行，
                  而这张表的语义是「abandoned 集合」——**一旦混入已完成但没删掉的
                  申请，它就不再能被当遗弃集合读了**。

                注意与 `RequestAbandonedMarkerWritesFailing` 的分工：
                本条抓的是**成功写入但不删除**（`clear` 没跑或没生效）；
                那条抓的是**写失败**（`clear_failed` 计数在涨）。
                若两条同时响，先按本条处置（泄漏更严重且更隐蔽）。
              runbook: |
                1. 确认 DELETE 半边还在跑：代码里 `clearRequestAbandonedPending`
                   的调用点在 `updateRequestLog` 的 `if logsWrite {}` **之外**；
                   仓库里有一道形状门
                   `TestAbandonedMarkerCallsAreOutsideTheS4Gate` 钉住这个位置。
                   若该门被跳过，先跑 `go test ./domains/hooks/observability/telemetry/
                   -run TestAbandonedMarker` 看红因。
                2. 确认终态路径真的在发：如果 `mark` 在涨而 `clear` 恒 0，
                   查 `clear` 调用点是否被拆掉，或 `updateRequestLog` 是否
                   根本没被调用（那会让所有请求都算遗弃）。
                3. 修复后已泄漏的行需要手工清理：
                   `SELECT count(*) FROM public.request_abandoned;`
                   确认这些 request_id 在 `request_logs` 里**已有终态**之后，
                   再 `DELETE FROM public.request_abandoned WHERE created_at < now() - interval '1 day'`。
                   **先验证再删**——直接 DELETE 会把真正的遗弃记录一起清掉。

  # ── ③ 噪声闸：mark 速率低于 0.05/s（≈3/min）→ 不触发 ────────────────
  - interval: 1m
    name: 场景D 低流量mark速率 → 噪声闸拦下
    input_series:
      - series: 'up{job="llm-gateway",instance="gw1"}'
        values: '1+0x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="mark"}'
        values: '0+2x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: RequestAbandonedLeaking
        exp_alerts: []

  # ── ③ 存活守卫：网关下线 → 不触发 ────────────────────────────────────
  - interval: 1m
    name: 场景E 网关下线 → 不触发
    input_series:
      - series: 'up{job="llm-gateway",instance="gw1"}'
        values: '0+0x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="mark"}'
        values: '0+60x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="clear"}'
        values: '0+0x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: RequestAbandonedLeaking
        exp_alerts: []

  # ── ① CounterVec 首次 Inc() 前无任何序列 → NeverWritten 必须触发 ─────
  - interval: 1m
    name: 场景F 无mark序列 up=1 → NeverWritten触发
    input_series:
      - series: 'up{job="llm-gateway",instance="gw1"}'
        values: '1+0x180'
    alert_rule_test:
      - eval_time: 2h5m
        alertname: RequestAbandonedMarkerNeverWritten
        exp_alerts:
          - exp_labels:
              severity: warning
              component: session-abandoned
              job: llm-gateway
              instance: gw1
            exp_annotations:
              summary: |-
                request_abandoned 落点从未被写入（开始/终态这一对标记都没动过）
              description: |
                1 小时内 `op="mark"` 的速率恒为 0，且已持续 2 小时。

                这不是「没有请求遗弃」——**没有请求遗弃时 mark 仍然每个请求都会 +1**
                （每次 in_progress INSERT 都写标记）。mark 恒为 0 意味着
                **写路径压根没跑**，三种可能：

                  ① 二进制没有 819 的接线（`markRequestAbandonedPending` 未被调用）
                  ② 819 迁移没应用 ⇒ 走 fail-open ⇒ 这种情况下应当同时看到
                     `op="mark_failed"` 增长（见 `RequestAbandonedMarkerWritesFailing`）
                  ③ 请求根本没进到 telemetry 的 INSERT 路径

                先跑这一句区分 ① 和 ②：

                    curl -s :8780/metrics | grep request_abandoned_marker_ops

                - 完全没有这个指标 ⇒ 情况 ①：二进制里没有这段代码
                - 有 `{op="mark_failed"}` ⇒ 情况 ②：**819 迁移没上**
                  （这是设计内的 fail-open：表不存在时只 warn，不打挂请求日志）
                - 什么都没有 ⇒ 情况 ③，或该指标注册路径没走到
              runbook: |
                1. 确认二进制版本包含 819（`/opt/llm-gateway-go/version.json` 的
                   git_sha 是否为含 `819_request_abandoned.sql` 的提交）。
                2. 确认 819 已应用：`SELECT to_regclass('public.request_abandoned')`，
                   非空即可；为空则先跑迁移再重启。
                3. **不要**因为「表是空的」就判定落点工作正常——
                   空表与「压根没写」在值上不可区分，这正是本告警存在的理由。

  # ── ① mark 正常增长 → 不触发 ────────────────────────────────────────
  - interval: 1m
    name: 场景G mark正常增长 → NeverWritten不触发
    input_series:
      - series: 'up{job="llm-gateway",instance="gw1"}'
        values: '1+0x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="mark"}'
        values: '0+60x180'
    alert_rule_test:
      - eval_time: 2h5m
        alertname: RequestAbandonedMarkerNeverWritten
        exp_alerts: []

  # ── ② fail-open 分支被打到 → WritesFailing 触发 ─────────────────────
  - interval: 1m
    name: 场景H mark_failed在涨 → WritesFailing触发
    input_series:
      - series: 'up{job="llm-gateway",instance="gw1"}'
        values: '1+0x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="mark_failed"}'
        values: '0+5x180'
    alert_rule_test:
      - eval_time: 20m
        alertname: RequestAbandonedMarkerWritesFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: session-abandoned
              job: llm-gateway
              instance: gw1
            exp_annotations:
              summary: |-
                request_abandoned 标记写入在持续失败（fail-open 分支）
              description: |
                30 分钟内 `mark_failed` 或 `clear_failed` 有增长。

                落点的写路径是**刻意 fail-open** 的：失败只 slog.Warn，
                **不回滚** request_logs 主事务（理由：819 未应用时不应打挂
                全部请求日志）。代价就是——**失败在请求侧完全不可见**，
                只有这条告警能发现。

                两种失败的含义完全不同：

                - `mark_failed` 高：开始标记写不进去 ⇒ 这段时间的遗弃请求
                  **根本没有落点**，且这些请求往往正是异常的那批
                  （DB 不可达 / 819 未应用 / 列集漂移）
                - `clear_failed` 高：终态删除失败 ⇒ 那些行会**永久留在表里**，
                  表语义从「abandoned 集合」退化成「一堆已完成但没删掉的请求」

                日志侧对应：
                  `WARN request_abandoned: start marker write failed`
                  `WARN request_abandoned: terminal marker cleanup failed`
              runbook: |
                1. `mark_failed`：看 error。`relation "request_abandoned" does not
                   exist` ⇒ 819 迁移没应用；`column ... does not exist` ⇒ 表结构漂移
                   （819 自带列集守卫，会在迁移时报 missing column）；
                   超时/连接错误 ⇒ 数据库侧问题。
                2. `clear_failed`：多半是 DB 抖动或权限/GUC 问题；
                   恢复后**已残留的行不会自动清掉**，
                   需要 `DELETE FROM request_abandoned WHERE created_at < now() - interval '1 day'`
                   手工回收（先确认这些请求确实都已终态）。
                3. 两条都修完后，用
                   `SELECT count(*) FROM public.request_abandoned` 确认回落。

  # ── ② 失败计数恒 0 → 不触发 ─────────────────────────────────────────
  - interval: 1m
    name: 场景I mark_failed恒0 → 不触发
    input_series:
      - series: 'up{job="llm-gateway",instance="gw1"}'
        values: '1+0x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="mark_failed"}'
        values: '0+0x180'
    alert_rule_test:
      - eval_time: 20m
        alertname: RequestAbandonedMarkerWritesFailing
        exp_alerts: []

  # ── ① 存活守卫（R36 补）：进程下线（up=0）时不得假红「从未写入」─────
  # `or (0*up)` 会给下线实例造出带标签的零值，`and on(job,instance)
  # (up==1)` 负责把它滤掉——本场景钉住这道守卫在场：摘掉 and 臂，本场景
  # 必红（变异验证见 R36 审计文档）。
  - interval: 1m
    name: 场景J 无mark序列且up=0 → NeverWritten不触发
    input_series:
      - series: 'up{job="llm-gateway",instance="gw1"}'
        values: '0+0x180'
    alert_rule_test:
      - eval_time: 2h5m
        alertname: RequestAbandonedMarkerNeverWritten
        exp_alerts: []

  # ── ② 另一臂（R36 补）：clear_failed 在涨（mark_failed 序列缺席）─────
  # 同一 selector regex（mark_failed|clear_failed）的另一半：DELETE 半边
  # fail-open 单独死亡时也必须响。
  - interval: 1m
    name: 场景K clear_failed在涨 → WritesFailing触发
    input_series:
      - series: 'up{job="llm-gateway",instance="gw1"}'
        values: '1+0x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="clear_failed"}'
        values: '0+5x180'
    alert_rule_test:
      - eval_time: 20m
        alertname: RequestAbandonedMarkerWritesFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              component: session-abandoned
              job: llm-gateway
              instance: gw1
            exp_annotations:
              summary: |-
                request_abandoned 标记写入在持续失败（fail-open 分支）
              description: |
                30 分钟内 `mark_failed` 或 `clear_failed` 有增长。

                落点的写路径是**刻意 fail-open** 的：失败只 slog.Warn，
                **不回滚** request_logs 主事务（理由：819 未应用时不应打挂
                全部请求日志）。代价就是——**失败在请求侧完全不可见**，
                只有这条告警能发现。

                两种失败的含义完全不同：

                - `mark_failed` 高：开始标记写不进去 ⇒ 这段时间的遗弃请求
                  **根本没有落点**，且这些请求往往正是异常的那批
                  （DB 不可达 / 819 未应用 / 列集漂移）
                - `clear_failed` 高：终态删除失败 ⇒ 那些行会**永久留在表里**，
                  表语义从「abandoned 集合」退化成「一堆已完成但没删掉的请求」

                日志侧对应：
                  `WARN request_abandoned: start marker write failed`
                  `WARN request_abandoned: terminal marker cleanup failed`
              runbook: |
                1. `mark_failed`：看 error。`relation "request_abandoned" does not
                   exist` ⇒ 819 迁移没应用；`column ... does not exist` ⇒ 表结构漂移
                   （819 自带列集守卫，会在迁移时报 missing column）；
                   超时/连接错误 ⇒ 数据库侧问题。
                2. `clear_failed`：多半是 DB 抖动或权限/GUC 问题；
                   恢复后**已残留的行不会自动清掉**，
                   需要 `DELETE FROM request_abandoned WHERE created_at < now() - interval '1 day'`
                   手工回收（先确认这些请求确实都已终态）。
                3. 两条都修完后，用
                   `SELECT count(*) FROM public.request_abandoned` 确认回落。

  # ── ③ 分工边界（R36 补）：mark 序列缺席 → Leaking 静默 ────────────────
  # mark 半边整体死亡（写路径没跑）时③的左侧为空向量 ⇒ 不得触发——
  # 该形态由①分工（NeverWritten）。本场景钉住③不越界双响。
  - interval: 1m
    name: 场景L mark序列完全缺席 → Leaking不触发
    input_series:
      - series: 'up{job="llm-gateway",instance="gw1"}'
        values: '1+0x180'
      - series: 'llm_gateway_request_abandoned_marker_ops_total{job="llm-gateway",instance="gw1",op="clear"}'
        values: '0+0x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: RequestAbandonedLeaking
        exp_alerts: []
