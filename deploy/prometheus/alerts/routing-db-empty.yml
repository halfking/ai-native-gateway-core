# LLM Gateway 路由数据库告警规则
# 用于监控 db_empty 和零候选路由问题
# 创建时间: 2026-08-13
# 基于: FINAL_AUDIT_REPORT_20260813.md

groups:
  - name: routing_db_empty
    interval: 30s
    rules:
      # 告警：路由计划为空（db_empty）
      - alert: RoutingPlanEmpty
        expr: |
          increase(llmgw_routing_db_empty_total{model=~"gpt.*|claude.*|glm.*|minimax.*"}[2m]) > 0
        for: 2m
        labels:
          severity: critical
          service: llm-gateway
          component: routing
        annotations:
          summary: "模型 {{ $labels.model }} 路由计划为空"
          description: "过去 2 分钟出现 db_empty 错误 (plan_count=0)，可能导致 'No available provider' 错误。受影响模型: {{ $labels.model }}，租户: {{ $labels.tenant_id }}"
          runbook: "检查数据库 routing_plans 表，运行 diagnose_db_empty.sh 诊断"
      
      # 告警：零候选路由
      - alert: ZeroCandidatesRouting
        expr: |
          increase(llmgw_routing_candidates_zero_total[2m]) > 5
        for: 1m
        labels:
          severity: warning
          service: llm-gateway
          component: routing
        annotations:
          summary: "路由决策频繁返回零候选"
          description: "过去 2 分钟 {{ $value }} 次路由返回 0 个候选节点，可能影响用户请求"
          runbook: "检查节点冷却状态、凭据可用性、数据库连接"
      
      # 告警：路由决策失败率高
      - alert: RoutingHighFailureRate
        expr: |
          (
            sum(rate(llmgw_routing_resolve_total{status="failure"}[5m]))
            /
            sum(rate(llmgw_routing_resolve_total[5m]))
          ) > 0.05
        for: 3m
        labels:
          severity: warning
          service: llm-gateway
          component: routing
        annotations:
          summary: "路由决策失败率超过 5%"
          description: "当前失败率: {{ $value | humanizePercentage }}，可能影响用户体验"
          runbook: "检查日志中的 routing_resolve 错误，运行诊断脚本"
