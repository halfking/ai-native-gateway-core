groups:
  - name: gpu_alerts
    interval: 30s
    rules:
      - alert: GPUHighUtilization
        expr: DCGM_FI_DEV_GPU_UTIL > 90
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu }} 利用率过高"
          description: "GPU {{ $labels.gpu }} 利用率持续 5 分钟 > 90% (当前: {{ $value }}%)"

      - alert: GPUHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 2m
        labels:
          severity: critical
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu }} 温度过高"
          description: "GPU {{ $labels.gpu }} 温度 > 85°C (当前: {{ $value }}°C)"

      - alert: GPUMemoryPressure
        expr: (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)) > 0.95
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu }} 内存不足"
          description: "GPU {{ $labels.gpu }} 内存使用率 > 95% (当前: {{ $value | humanizePercentage }})"

      - alert: GPUDown
        expr: up{job="dcgm-gpu"} == 0
        for: 1m
        labels:
          severity: critical
          component: gpu
        annotations:
          summary: "GPU 监控不可用"
          description: "DCGM Exporter 无法连接到 GPU 节点 {{ $labels.instance }}"

  - name: system_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "主机 CPU 使用率过高"
          description: "主机 {{ $labels.instance }} CPU 使用率 > 80% (当前: {{ $value | humanize }}%)"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "主机内存使用率过高"
          description: "主机 {{ $labels.instance }} 内存使用率 > 85% (当前: {{ $value | humanize }}%)"

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "磁盘空间不足"
          description: "主机 {{ $labels.instance }} 挂载点 {{ $labels.mountpoint }} 磁盘使用率 > 85% (当前: {{ $value | humanize }}%)"

  - name: llm_gateway_alerts
    interval: 30s
    rules:
      - alert: LLMGatewayDown
        expr: up{job="llm-gateway"} == 0
        for: 1m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "LLM Gateway 服务不可用"
          description: "LLM Gateway 实例 {{ $labels.instance }} 无法连接"

      - alert: HighErrorRate
        expr: rate(llm_gateway_requests_total{status=~"5.."}[5m]) / rate(llm_gateway_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "LLM Gateway 错误率过高"
          description: "LLM Gateway 5xx 错误率 > 5% (当前: {{ $value | humanizePercentage }})"

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(llm_gateway_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          component: application
        annotations:
          summary: "LLM Gateway 延迟过高"
          description: "LLM Gateway P99 延迟 > 5s (当前: {{ $value | humanizeDuration }})"

  # 2026-08-29: hot-table promote health. These rules consume the metrics
  # registered by bg/partition_manager.go; table is intentionally the only
  # label so the alert remains low-cardinality.
  - name: hot_table_promote_alerts
    interval: 30s
    rules:
      - alert: HotTablePromoteFailures
        expr: increase(llm_gateway_hot_table_promote_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
          component: partition
        annotations:
          summary: "热表 promote 持续失败（{{ $labels.table }}）"
          description: "表 {{ $labels.table }} 在过去 15 分钟出现 promote 失败；热表数据可能无法迁入月分区，请检查 PartitionManager 日志、目标分区和数据库错误。"

      - alert: HotTablePromoteLockContention
        expr: increase(llm_gateway_hot_table_promote_skipped_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
          component: partition
        annotations:
          summary: "热表 promote 长时间被锁竞争跳过（{{ $labels.table }}）"
          description: "表 {{ $labels.table }} 在过去 15 分钟只发生锁竞争跳过且没有成功批次，可能导致 hot 表积压。"

      - alert: HotTablePromoteSlow
        expr: histogram_quantile(0.95, sum by (le, table) (rate(llm_gateway_hot_table_promote_duration_seconds_bucket[15m]))) > 30
        for: 10m
        labels:
          severity: warning
          component: partition
        annotations:
          summary: "热表 promote 批次耗时过高（{{ $labels.table }}）"
          description: "表 {{ $labels.table }} 的 promote 批次 P95 耗时超过 30 秒，请检查数据库负载和 hot 表积压。"

  # 2026-08-12: node-probe 同步路径 + 路由状态源告警。
  # 覆盖范围说明：仅覆盖请求热路径上的 ProbeSync（no_candidates 触发）
  # 与 routing_state_source 外层标签。后台 NodeProbeWorker 的探测结果只
  # 写 node_probe_runs 表、不进 Prometheus，故此处不含其告警——需后台
  # 探测告警时请基于该表另配 SQL/exporter，不要在此处伪造指标。
  - name: node_probe_and_routing_alerts
    interval: 30s
    rules:
      # 同步探测持续无法恢复任何候选 → 用户请求落到 503。
      - alert: NodeProbeSyncExhaustedHigh
        expr: increase(llmgw_node_probe_sync_total{outcome="exhausted"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: routing
        annotations:
          summary: "NodeProbe 同步探测大量耗尽"
          description: "近 5 分钟 ProbeSync 无法恢复任何候选共 {{ $value }} 次（outcome=exhausted），no_candidates 请求正在返回 503。排查上游是否大面积不可达。"

      # 同步探测频繁超时 → 每个吃掉最多 5s 用户请求预算。
      - alert: NodeProbeSyncTimeoutHigh
        expr: increase(llmgw_node_probe_sync_total{outcome="timeout"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
          component: routing
        annotations:
          summary: "NodeProbe 同步探测大量超时"
          description: "近 5 分钟 ProbeSync 超时 {{ $value }} 次（outcome=timeout），每次占用至多 5s 用户请求预算。排查直连探测 probeDirect 的网络/代理延迟。"

      # 大量请求阻塞在等待进行中的探测 → 用户可见排队延迟。
      - alert: NodeProbeSyncInflightWaitersHigh
        expr: llmgw_node_probe_sync_inflight_waiters > 20
        for: 2m
        labels:
          severity: warning
          component: routing
        annotations:
          summary: "NodeProbe 同步探测等待者过多"
          description: "当前有 {{ $value }} 个请求 goroutine 阻塞在等待进行中的后台探测（dedup 复用）。若持续，说明探测周期过慢或 no_candidates 流量过大。"

      # authoritative 模式下大量回退 → URSM v2 未作为权威源生效（Redis 故障 / 未 Ready）。
      # 仅在外层标签上计算比例，避免与 node_mirror_* 内层标签重复计数。
      - alert: RoutingStateFallbackRatioHigh
        expr: |
          sum(rate(routing_state_source_total{source="fallback"}[5m]))
          /
          clamp_min(sum(rate(routing_state_source_total{source=~"authoritative|fallback|canary|off|skipped"}[5m])), 0.001)
          > 0.2
        for: 5m
        labels:
          severity: warning
          component: routing
        annotations:
          summary: "路由状态源 fallback 占比过高"
          description: "authoritative 模式下超过 20% 请求回退到 legacy（当前: {{ $value | humanizePercentage }}）。URSM v2 可能未 Ready 或 Redis 异常，检查 URSM_V2_MODE 与 Redis 连通性。"

      # 压力查询持续失败 → 压力感知路由 fail-open 降级。
      - alert: RoutingPressureQueryFailuresHigh
        expr: increase(llmgw_pressure_query_failures_total[5m]) > 50
        for: 5m
        labels:
          severity: warning
          component: routing
        annotations:
          summary: "路由压力信号查询大量失败"
          description: "近 5 分钟 FpSlots/Limiter 压力查询失败 {{ $value }} 次。压力感知路由已 fail-open（按原权重选路），检查 Redis 连通性。"

  # The accepted response-body ADR defines this counter as the single alert SSOT.
  # Only non-stream bodies are alertable; streaming body bytes are held separately.
  - name: response_body_integrity_alerts
    interval: 30s
    rules:
      - alert: GatewaySuccessfulNonStreamResponseBodyMissing
        expr: increase(telemetry_success_response_body_missing_total{stream="non_stream"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: telemetry
        annotations:
          summary: "成功的非流式请求缺少响应正文"
          description: "过去 5 分钟检测到 {{ $value }} 个成功但无 response body 的非流式请求。该指标来自 settlement telemetry；检查 request_logs_bodies_hot 写入、转换和脱敏链路。"
          runbook: "docs/06-deployment/04-runbooks/journal-provider-next-phase.md#3.3-监控与历史完整性"
