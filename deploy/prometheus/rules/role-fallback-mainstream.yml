groups:
  - name: autoroute_role_fallback
    interval: 30s
    rules:
      # ---- R53：低价不可用退主流的静默升档告警 ----
      #
      # 诉求「低价模型不可用时退到主流模型」（R52 修复）本身是静默的：
      # 轻量池整层掉线时请求照常成功，只是静默升档到重量模型，成本上升
      # 而 routing_source / HTTP 状态码上没有任何异常信号。本组把
      # Decision.RoleFallbackLayer 送进 Prometheus，让这件事可被告警。
      #
      # 表达式的四条硬约束（改动前请先读，删掉任何一条都会让告警**静默失效**
      # 而非误报——这是本文件最需要小心的地方）：
      #
      # 1. `and on()` 显式声明按**空标签集**匹配。PromQL 的 and 默认按
      #    "除 metric name 外的全部标签"匹配：左侧 llmgw_..._active 带着
      #    scrape 注入的 job/instance，右侧 sum() 结果没有任何标签，两侧
      #    标签集不相等 → and 产出空向量 → 告警永不触发。写成 and on()
      #    （或把左侧包一层 max()）才能真正过滤。**这一条无法用字符串断言
      #    之外的任何本地手段验证，只能靠 promtool / 线上验证。**
      #
      # 2. 分母是 layer="kind" + layer="mainstream" 之和，即**role 路由实际
      #    介入的请求数**，不是全量 auto 请求数。用全量做分母会把 main
      #    会话等从不进 role 路由的流量算进来，比例被稀释到永不上报。
      #
      # 3. role_routing_active == 1 是必要前置。不加它：开关关闭时
      #    分子分母同为 0，比值 0/0 = NaN，而 NaN 与任何阈值比较恒为
      #    false —— 告警静默不响，于是「轻量池掉线」和「机制没开」在面板
      #    上完全一样。加了它之后，机制没开时告警进入 pending 而非 firing，
      #    运维一眼看出是配置问题还是真故障。max() 同时把多实例折叠成一个，
      #    任一实例开着开关这条告警就有意义。
      #
      # 4. 样本量下界（>= 5）。分母加 > 0 守卫：低流量窗口下 kind 计数可能
      #    为 0，此时比值无意义；没有下界会产生 1 次 mainstream / 1 次 kind
      #    = 100% 的假阳性。
      - alert: AutoRouteRoleFallbackMainstreamSpike
        expr: |
          (
            sum(increase(llmgw_autoroute_role_fallback_layer_total{layer="mainstream"}[15m]))
            /
            (
              sum(increase(llmgw_autoroute_role_fallback_layer_total{layer="kind"}[15m]))
              + sum(increase(llmgw_autoroute_role_fallback_layer_total{layer="mainstream"}[15m]))
            )
          ) > 0.2
          and on()
          max(llmgw_autoroute_role_routing_active) == 1
          and on()
          sum(increase(llmgw_autoroute_role_fallback_layer_total[15m])) >= 5
        for: 5m
        labels:
          severity: warning
          service: llm-gateway
          component: autoroute
        annotations:
          summary: "auto 路由：低价模型整层缺席，请求持续静默升档到主流模型"
          description: "过去 15 分钟 role 路由命中的请求里，{{ $value | humanizePercentage }} 落在主流兜底层（轻量池整层不可用），且样本量已达下限。轻量池整体掉线（欠费/下线/被 tier 滤除）会让搜索、总结、git_ops、运维类子代理请求静默改用重量模型——成本上升但请求全部成功，HTTP 层与 routing_source 都看不出异常。layer=kind 计数同时下降可交叉验证轻量池确实在掉线。"
          runbook: "查 request_logs 里 auto_decision->>'task_kind' 的分布，确认哪些 kind 受影响；核对受影响轻量模型的凭据状态与配额（POST /api/routing/credentials/{id}/reset-state 可复位）；检查 work_type tier 配置是否把轻量模型整体滤除。若确认短时抖动可临时关 AUTO_ROLE_ROUTING_MAINSTREAM_FALLBACK=false 退回旧口径（代价：静默让位，无兜底层）。"

      # ---- 配置面：机制没开 / 没进过 role 路由 ----
      #
      # 这条不是故障告警，是**可见性告警**：它回答「我以为兜底层在保护我，
      # 它到底装载了没有」。父开关默认关闭，既有部署上这条会一直 firing，
      # 这是预期行为——它的作用是让灰度决策（handoff §6 第 2 条）有据可依，
      # 而不是让面板多一个被忽略的红。
      #
      # 无 set operator，故不需要 and on()：单条比较按实例各自求值，
      # 哪个实例关掉了开关就报哪个实例。
      - alert: AutoRouteRoleRoutingDisabled
        expr: llmgw_autoroute_role_routing_active == 0
        for: 30m
        labels:
          severity: info
          service: llm-gateway
          component: autoroute
        annotations:
          summary: "auto role 路由兜底层未生效（AUTO_ROLE_ROUTING_ENABLED 关闭）"
          description: "父开关 AUTO_ROLE_ROUTING_ENABLED 已关闭超过 30 分钟，整套 role 路由（含 R52 的主流兜底层）当前对线上零影响。后果：轻量池整层掉线时没有任何通往重量池的路径，请求静默改用评分结果，运维从 routing_source 上看不出异常。父开关由产品/灰度决策控制，本告警不表示故障。"
          runbook: "确认这是有意的灰度决策还是误关；确需启用则设 AUTO_ROLE_ROUTING_ENABLED=true 并重启网关，同时订阅 AutoRouteRoleFallbackMainstreamSpike。"

      # ---- 兜底层完全不工作 ----
      #
      # role 路由在跑（有 kind 命中）、但主流层计数**恒为 0** 且请求量不小，
      # 说明兜底层从未被需要。此时轻量池一旦整层掉线就是硬故障（无退路）。
      # 阈值为 0 是刻意的：这条告警的语义是「兜底能力从未被验证过」，
      # 而非「兜底发生了」。for: 6h 窗口 + kind 侧量下界（100）避免刚开
      # 开关的部署立刻被这条淹没。
      - alert: AutoRouteRoleFallbackNeverExercised
        expr: |
          sum(increase(llmgw_autoroute_role_fallback_layer_total{layer="kind"}[6h])) > 100
          and on()
          sum(increase(llmgw_autoroute_role_fallback_layer_total{layer="mainstream"}[6h])) == 0
          and on()
          max(llmgw_autoroute_role_routing_active) == 1
        for: 30m
        labels:
          severity: info
          service: llm-gateway
          component: autoroute
        annotations:
          summary: "auto role 路由兜底层 6 小时内从未被触发，兜底能力未经真实流量验证"
          description: "过去 6 小时 role 路由命中超过 100 次，但主流兜底层命中为 0。说明轻量池一直健康（这是好事），代价是兜底路径从未在真实流量下跑过——一旦轻量池整层掉线，回退是否如预期工作没有任何历史证据支撑。属可见性提示，不是故障。"
          runbook: "无需立即处理；把它当作「兜底路径未被验证」的记账项。若要主动验证，可在灰度环境关掉轻量池凭据，观察 AutoRouteRoleFallbackMainstreamSpike 是否按预期触发。"
