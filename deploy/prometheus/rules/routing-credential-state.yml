groups:
  - name: routing_credential_state
    interval: 30s
    rules:
      # ---- admin reset 链路 ----
      - alert: RoutingCredentialResetErrors
        expr: increase(llmgw_routing_credential_reset_total{result="error"}[10m]) > 5
        for: 5m
        labels:
          severity: warning
          service: llm-gateway
          component: routing
        annotations:
          summary: "凭据 reset 链路连续出错（500 类）"
          description: "过去 10 分钟 result=error 的 reset 超过 5 次。按 surface 标签定位：db=事务失败，ursmv2=Redis 状态机，in_memory_*=内存态重置，redis_fpslot=指纹槽位，lookup=凭据查询。"
          runbook: "检查 gateway 日志中 force_enable / reset-state 前缀的错误；核对 PG 与 Redis 连接池。"

      - alert: RoutingCredentialResetNotFoundSpike
        expr: increase(llmgw_routing_credential_reset_total{surface="lookup",result="not_found"}[10m]) > 10
        for: 5m
        labels:
          severity: info
          service: llm-gateway
          component: routing
        annotations:
          summary: "对不存在凭据的 reset 请求激增（404 类）"
          description: "过去 10 分钟 surface=lookup/result=not_found 超过 10 次。通常是操作脚本使用了过期/敲错的 credential id；与内部错误（result=error）不同，本告警不表示链路故障。"
          runbook: "核对调用方使用的 credential id 是否仍存在于 credentials 表；检查自动化脚本是否引用了已下线凭据。"

      # ---- 后台恢复 worker ----
      - alert: RoutingCredentialRecoveryErrors
        expr: increase(llmgw_routing_credential_recovery_total{outcome="error"}[15m]) > 10
        for: 10m
        labels:
          severity: warning
          service: llm-gateway
          component: routing
        annotations:
          summary: "credential_recovery 30s tick 恢复失败增多"
          description: "过去 15 分钟 outcome=error 超过 10 次。sql_kind 标签指明哪条恢复 SQL 失败（quota_recover / availability_recover / suspended 等）。"
          runbook: "检查 bg/credential_recovery 日志与对应 SQL 的报错；确认 quota_recover_at / availability_recover_at 列上没有锁或约束冲突。"

      - alert: RoutingRecoveryTickSlow
        expr: llmgw_routing_credential_recovery_tick_duration_seconds > 10
        for: 10m
        labels:
          severity: warning
          service: llm-gateway
          component: routing
        annotations:
          summary: "credential_recovery 单次 tick 耗时超过 10s"
          description: "最近一次完整 tick 的墙钟耗时持续高于 10s（正常应远低于 30s 周期）。通常是 PG 连接池耗尽或慢查询的前兆。"
          runbook: "检查 PG 活跃连接数与 pg_stat_activity 中 credential_recovery 相关查询；检查连接池配置。"

      - alert: RoutingHealthAutoRecoverErrors
        expr: increase(llmgw_routing_health_auto_recover_total{outcome="error"}[15m]) > 3
        for: 10m
        labels:
          severity: warning
          service: llm-gateway
          component: routing
        annotations:
          summary: "health_auto_recover 1min tick 连续失败"
          description: "过去 15 分钟（最多 15 个 tick）中超过 3 次 outcome=error。恢复到期的凭据健康状态没有被自动复位。"
          runbook: "检查 credentialhealth.RecoverExpired 的报错日志；确认 credentialhealth 表可写。"

      - alert: RoutingAutoHealSubmitErrors
        expr: increase(llmgw_routing_auto_heal_submit_total{outcome="error"}[15m]) > 10
        for: 10m
        labels:
          severity: warning
          service: llm-gateway
          component: routing
        annotations:
          summary: "主动自检（autoheal）探针提交失败增多"
          description: "过去 15 分钟 outcome=error 超过 10 次。到期的自检任务没有被提交到 NodeProbeWorker。"
          runbook: "检查 bg/credential_autoheal 日志中 Submit 报错；确认 NodeProbeWorker 队列未满/未阻塞。"

      # ---- 路由层降级 ----
      - alert: RoutingCoolingFallbackTriggered
        expr: increase(llmgw_routing_cooling_fallback_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: llm-gateway
          component: routing
        annotations:
          summary: "路由进入全员冷却降级（无健康候选）"
          description: "过去 5 分钟触发 all_unusable 降级：所有候选都在冷却中，路由被迫选择冷却最浅的候选。原因标签区分 all_unusable 与 none_healthy。"
          runbook: "检查 dashboard 上受影响模型的凭据健康状态；必要时用 POST /api/routing/credentials/{id}/reset-state 复位状态后再触发自检。"
