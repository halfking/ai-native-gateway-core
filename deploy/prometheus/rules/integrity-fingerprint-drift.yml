# integrity fingerprint drift 检测器「自己把自己关掉了」的告警（2026-10-02 审计 §9.50）
#
# 指标来源：bg/integrity_fingerprint_drift_metrics.go
#   llm_gateway_bg_fingerprint_drift_scanned_total   真正执行了全量扫描的轮数
#   llm_gateway_bg_fingerprint_drift_skipped_total   被一次性探针短路、没扫描的轮数
#   llm_gateway_bg_fingerprint_drift_last_scan_unix  最近一次真正扫描的时刻
#
# # 为什么这组告警不是「常规巡检」
#
# IntegrityFingerprintDrift 是**安全相关检测器**（凭据/模型指纹漂移）。它每轮先问
# 一个一次性探针「当前半窗口有没有带 system_fingerprint 的流量」，而该列的唯一来源
# 是上游的 `X-System-Fingerprint` 响应头。**上游不发 ⇒ 探针恒空 ⇒
# `fingerprintScanDecision` 返回 `fingerprintScanSkip` ⇒ 每轮在第一行 return。**
#
# 实测（本地库，2026-10-02，审计 §9.51）：v1 全表 2,164,650 行、会话族全表
# 1,683,739 行、integrity 事件 JSONB 7,081 条，`system_fingerprint` **非空均为 0**。
# ⇒ **停写之前探针就已经是空的**；这个检测器自 2026-09-25（D11 短路上线）起
# 一直关着，与 S4 无关。
#
# S4 停写对它的影响曾经是**前瞻性**的：短路的第二条腿（`inProcSeen` 的进程内
# arm）原先只在 `persistSystemFingerprint()` 内 arm，而后者的调用点都在
# `insertRequestLog` / `updateRequestLog` 的 `if logsWrite` 块内 ⇒ 停写后 arm 一次
# 都不触发。审计 §9.52 已把 arm 移到门控**之外**（`observeSystemFingerprint`）。
# ⇒ 现在**上游一旦开始发指纹，检测器就能自己醒过来**；这才是本组告警要守的东西。
#
# 这与「某个读点变空」是不同性质的事：不是显示层少了一块，是**检测器自己关掉了**。
# 而在此之前完全不可见——`skippedTicks` 全仓只有 `Add(1)`、没有任何地方读它，
# 该文件此前一个 Prometheus 指标都没有，唯一的痕迹是那一刻的一条 slog.Info。
#
# # 为什么两条告警而不是一条
#
#   BgFingerprintDriftNeverScanned   「距上次扫描超过 2h」——**持续状态**，用 for: 抑制
#   BgFingerprintDriftSkippedNoScan  「15 分钟内在跳、一次都没扫」——**两者同时成立**
#
# 第一条覆盖「worker 启动后一直没扫」（含启动时刻初始化后的情形）；第二条覆盖
# 「曾经扫过、现在只剩跳过」这一类**退化中**的状态——只靠 last_scan 的阈值，
# 扫描间隔正好接近阈值时会迟迟不响。
#
# 标签纪律（GW-00）：三个指标都不带标签，基数为 1。

groups:
  - name: integrity_fingerprint_drift
    interval: 30s
    rules:
      - alert: BgFingerprintDriftNeverScanned
        expr: time() - llm_gateway_bg_fingerprint_drift_last_scan_unix > 7200
        for: 10m
        labels:
          severity: critical
          component: bg
        annotations:
          summary: "指纹漂移检测器已超过 2 小时没有执行过全量扫描"
          description: |
            `IntegrityFingerprintDrift` 连续 10 分钟**没有**跑过一次全量扫描。
            默认扫描间隔是 1 小时（`LLM_GATEWAY_INTEGRITY_FP_DRIFT_INTERVAL`），
            所以 2 小时 + 10 分钟的持续窗口意味着它**确定**没在扫。

            **当前的实际原因：上游从不返回 `X-System-Fingerprint`，不是 S4 停写。**
            扫描前的一次性存在性探针问的是「最近半窗口有没有带
            `system_fingerprint` 的流量」，而这一列的唯一来源是上游的
            `X-System-Fingerprint` 响应头（`executor_chat.go:1926` /
            `handler.go:6730`）。上游不发 ⇒ 探针恒空 ⇒
            `fingerprintScanDecision` 走 `fingerprintScanSkip` ⇒ 每轮直接 return。

            审计 §9.51 在真库实测（本地，2026-10-02）：

            | 面 | 行数 | `system_fingerprint` 非空 |
            |---|---|---|
            | `request_logs`（v1 全表） | 2,164,650 | **0** |
            | `session_turns`（会话族全表） | 1,683,739 | **0** |
            | `model_integrity_events.context` JSONB | 7,081（2026-09-05 起） | **0** |

            JSONB 那一行是独立证据：它不走专用列、同样直取那个响应头。
            ⇒ **停写之前探针就已经是空的**。这个检测器自 2026-09-25（D11 短路
            上线）起就一直关着，与 S4 无关。

            **S4 停写的影响是前瞻性的，但已在 §9.52 修掉**。短路有两条腿：
            腿 1 是上面那个探针；腿 2 是 `inProcSeen` 的进程内 arm —— 进程内
            遥测观测到带指纹的请求就会重新 arm 全量扫描。

            腿 2 曾**也**断在同一个开关上：它的写入方 `markSystemFingerprintObserved()`
            原先只在 `persistSystemFingerprint()` 内被调用，而后者的两个调用点都在
            `insertRequestLog` / `updateRequestLog` 的 `if logsWrite {}` 块内
            （client.go:1816 / :2468）⇒ 停写后 arm 一次都不触发。

            §9.52 已把 arm 移到 `observeSystemFingerprint()`，在**门控之外**调用
            （`insertRequestLog` / `updateRequestLog` 各自的 `if logsWrite` 之前）。
            arm 记录的是「本进程见过带指纹的请求」，与该请求是否落进 v1 无关。
            不变式由 `domains/hooks/observability/telemetry/fingerprint_escape_hatch_gate_test.go`
            钉住：arm 调用链上没有任何一环在门内。

            ⇒ **但当前仍然不扫描，主因没有变**：上游不发 `X-System-Fingerprint`，
            arm 也就无从触发。这条告警现在守的是「**上游一旦开始发指纹，检测器要
            能自己醒过来**」——修复前它醒不过来。
            ⚠ 醒来有一个前提别漏掉（R33 补记，2026-10-02）：停写期间 arm 可以
            触发（它只记「本进程见过带指纹的请求」），但 scanDrift 读的是 v1
            当前月视图——停写期间它没有新行，醒来也是空扫；指纹行落在**不被
            停写门控的会话族**上，不在本检测器的视野里（不改读会话族的理由
            见下面 4b）。检测能力要等停写解除才真正恢复。

            ⚠ 本条经过三次订正，都记在审计里：
            §9.50.4 撤回了「逃生口那条链与宽表无关、会自行恢复」；
            §9.51 撤回了「停写是当前不扫描的主因」——真库实测显示上游从不返回
            该响应头，这一条与停写无关；
            §9.52 撤回了「arm 仍然是关着的」这一说法——停写对它的影响已修掉。

            **排查步骤**：
            1. 看 `llm_gateway_bg_fingerprint_drift_skipped_total` 是否在涨
               （涨 = 被短路；不涨 = worker 本身没在跑，是另一个问题）
            2. 查上游是否开始返回 `X-System-Fingerprint`（这才是主因）：

                   SELECT count(*), count(system_fingerprint) FROM request_logs_hot
                    WHERE ts > NOW() - INTERVAL '1 hour';

               读法要分两种：`N > 0` 且 fingerprint 全空 ⇒ 与停写无关，就是
               没有指纹流量（**当前的常态**）；`N = 0` ⇒ 先做步骤 3——停写
               期间热表没有新行，这个查询读不出「上游是否发指纹」，直接下
               「上游不发」的结论会把方向搞反。
            3. 确认 `storage.request_logs_write_enabled` 的当前值与切换时刻。
               停写**不是**当前不扫的原因，但它决定了**将来**能不能恢复。
            4. 修法（a 已于 §9.52 完成，剩下的是产品决策）：
               a. ~~把 `inProcSeen` 的 arm 移出 `if logsWrite`~~ —— **已做**。
                  今后若再看到本告警，**不要**重复这一步；
               b. **不要**为了让探针「有数据」而去改读会话族：实测会话族的
                  `system_fingerprint` 同样是全空（同一上游原因，168 万行 0 非空），
                  改过去只是把「因为缺数据而空」伪装成「已修好」；
               c. 剩下的长期问题需要产品决策：这个检测器在没有任何指纹数据时
                  本来就无对象可检。要么让上游发指纹，要么承认这项检测能力当前
                  是空的并如实记录 —— 而不是靠调大间隔把告警压下去。

      - alert: BgFingerprintDriftSkippedNoScan
        expr: |
          increase(llm_gateway_bg_fingerprint_drift_skipped_total[15m]) > 0
            and increase(llm_gateway_bg_fingerprint_drift_scanned_total[15m]) == 0
        for: 10m
        labels:
          severity: warning
          component: bg
        annotations:
          summary: "指纹漂移检测器连续 15 分钟只在跳过、一次都没扫描"
          description: |
            15 分钟内 `skipped_total` 在涨而 `scanned_total` 没动 ⇒ 这个检测器
            **当前完全没有在工作**，而不是「扫得少」。

            与 `BgFingerprintDriftNeverScanned` 区分：那条问「距上次扫描多久」
            （持续状态），这条问「此刻在跳但不扫」（正在退化的状态）。两条都需要：
            只看 last_scan，扫描间隔接近阈值时会迟迟不响；只看 skipped，
            「worker 压根没启动」会漏掉。
