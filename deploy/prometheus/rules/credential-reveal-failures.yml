groups:
  - name: credential_reveal_failures
    interval: 30s
    rules:
      # 2026-08-18 credential 17 follow-up:
      # llmgw_credential_reveal_failure_total 是 provider/client.go
      # errReveal* 哨兵驱动的 closed-vocabulary counter（reason: unknown_format
      # | decrypt_error | cached | not_found | not_configured | rotation |
      # other）。任何 reveal 失败都需要人眼介入，因为会立刻放大业务请求
      # 失败率（Candidate 标记 unavailable → enrichment miss）。
      #
      # 告警分层：
      #   - unknown_format / decrypt_error 是"密文侧问题"，需要立刻响应
      #     （要么 migration 漏写，要么 Fernet→AESGCM 迁移没覆盖）。
      #   - cached 倍数超过根因 10x 是"放大异常"，意味着某个 provider 的
      #     一次失败被负缓存放大成常态。
      #   - not_found / not_configured 是"配置漂移"，超过 1/min 要查。
      #
      # credential_id 维度被 GW-00 基数守卫禁止（不限 provider 数就会爆
      # prometheus label 内存）。这里只有 provider_id + reason 两个 label。
      - alert: CredentialRevealUnknownFormatSpike
        expr: rate(llmgw_credential_reveal_failure_total{reason="unknown_format"}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          component: credential
          incident_class: ciphertext_format
        annotations:
          summary: "Credential reveal: ciphertext format 异常 (provider_id={{ $labels.provider_id }})"
          description: |
            llmgw_credential_reveal_failure_total{reason="unknown_format"} 在过去 5m
            内速率 {{ $value | humanize }} > 0.1（阈值）持续 2m。这通常是：
              1) SQL migration 079-credentials-ciphertext-format-check 没有覆盖到
                 新增 ciphertext envelope（v1:legacy / v2:aesgcm 等版本号）；
              2) Fernet→AESGCM 迁移未跑完，老密文还在 INSERT 路径里；
              3) 有人手工 INSERT 了 raw binary（绕过 CLI）。
            立刻行动：
              - 跑 cmd/check-credentials -scan 定位 provider_id={{ $labels.provider_id }}
              - 看 provider/credential_decrypt_metrics.go::classifyRevealFailure 堆栈
              - 联系 oncall @credential-team

      - alert: CredentialRevealDecryptErrorSpike
        expr: rate(llmgw_credential_reveal_failure_total{reason="decrypt_error"}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          component: credential
          incident_class: decryption_key
        annotations:
          summary: "Credential reveal: decrypt error (provider_id={{ $labels.provider_id }})"
          description: |
            解密失败（KEYRING / Fernet key 不匹配 / AESGCM nonce 失效），
            provider_id={{ $labels.provider_id }} 速率 {{ $value }} > 0.05/s
            持续 2m。检查 OPS_NODE_KEYRING_JSON 是否被轮换未同步。

      - alert: CredentialRevealCachedAmplification
        expr: |
          sum by (provider_id) (rate(llmgw_credential_reveal_failure_total{reason="cached"}[5m]))
            /
          clamp_min(
            sum by (provider_id) (rate(llmgw_credential_reveal_failure_total{reason!="cached"}[5m])),
            0.001
          ) > 10
        for: 5m
        labels:
          severity: warning
          component: credential
          incident_class: cache_amplification
        annotations:
          summary: "Credential reveal: 负缓存放大异常 (provider_id={{ $labels.provider_id }})"
          description: |
            cached 桶与根因桶速率比 = {{ $value | humanize }}x > 10x 持续 5m。
            负缓存 TTL=60s 把 1 个真实失败放大成持续 burst；超过 10x 通常意味着
            TTL 内反复触发 + 阈值偏低。检查 negativeCacheEntry 命中率并考虑
            临时把 TTL 调短到 10s（参见 provider/client.go NegativeCacheTTL）。

      - alert: CredentialRevealNotFoundDrift
        expr: rate(llmgw_credential_reveal_failure_total{reason="not_found"}[5m]) > 0.01666
        for: 10m
        labels:
          severity: warning
          component: credential
          incident_class: config_drift
        annotations:
          summary: "Credential reveal: not_found 频率 > 1/min (provider_id={{ $labels.provider_id }})"
          description: |
            not_found 表示 SQL 行不存在或 disabled 状态。> 1/min 持续 10m 通常
            是配置漂移：某个上游 provider 在 routing 配置里被引用但对应 credential
            被禁用/删除。检查 admin/config 该 provider 状态。

      - alert: CredentialRevealTotalStalled
        expr: |
          sum(rate(llmgw_credential_reveal_failure_total[5m])) > 1
          and
          sum(rate(llmgw_credential_reveal_failure_total[30m])) < 0.01
        for: 5m
        labels:
          severity: warning
          component: credential
          incident_class: first_incident
        annotations:
          summary: "Credential reveal: 突然出现 reveal 失败率 burst（5m 内 > 1/s）"
          description: |
            5m 内速率 > 1/s 但 30m 内历史基线 < 0.01/s = 全新事件。可能是迁移误跑、
            凭据被批量 disable、或上游密钥轮换未完成。这是 credential 17 事故
            的"第一次告警"应该触发的形态。