# auto-route 结算的源族切换与基线可用性告警（2026-10-02 审计 §9.44）
#
# 指标来源：bg/auto_route_settle_source.go + bg/auto_route_settle_baseline_metrics.go
#   llmgw_autoroute_settle_source_total{family}            按源族结算的 selection 数
#   llmgw_autoroute_settle_baseline_cohort_rows{family}    本轮基线 cohort 的行数（gauge）
#   llmgw_autoroute_settle_baseline_neutral_total{term,family} 走了中性回落的 selection 数
# 停滞面（2026-10-02 24h 审计第三十二轮 §四#2/#3）：
#   llmgw_autoroute_settle_sweep_failures_total{reason}    整查询失败/panic 的 sweep 轮数
#   llmgw_autoroute_settled_total{outcome}                 结算产出（与上面互补：停增=没产出）
#
# # 为什么 cohort 归零是一件必须报警的事
#
# ComputeRoutingRewardWithWeights 的延迟项与成本项都以 0.5 起手，只有基线非零才
# 用实测值替换。取到空 map（task_type miss）或零值时，**整条 selection 的延迟项
# 和成本项同时塌成 0.5**。这不产生任何错误，计数器照常增长，reward 仍在 [0,1] 内
# —— 但 cohort 基线存在的唯一理由（区分快模型与慢模型、贵模型与便宜模型）就此失效，
# 而且与「实测结果恰好中性」在输出上逐字相同。
#
# §9.43 把基线 cohort 的来源表接到了 S4 写门上（src.TurnsTable）。真库实测
# （24h 窗口，is_auto_request=TRUE AND latency_ms IS NOT NULL）：
#
#   v1 侧      2178 行
#   会话族侧      0 行
#
# 即在当前这份数据上切换会立刻得到空 map。
#
# # gauge 陈旧性：为什么每条规则都带活动守卫
#
# cohort_rows 只在**本轮实际使用**的那个族上 Set。源族切换后，另一个族的序列会
# 停更并冻结在旧值上 —— 对一个「已停更」的序列断言 == 0，读到的是「没在测」，
# 不是「测出来是 0」。所以每条 cohort 规则都同时要求该族近期确有结算
# （increase(source_total{family=...}[15m]) > 0），把「正在被使用」写进条件本身。
#
# 标签纪律（GW-00）：family ∈ {v1, session}，term ∈ {latency, cost}，
# 均为编译期闭集（bg/auto_route_settle_source.go 与 _baseline_metrics.go 的 init
# 预置），基数恒定。刻意**不带** task_type —— 它来自请求内容，基数无上界。

groups:
  - name: auto_route_settle_source_and_baseline
    interval: 30s
    rules:
      - alert: AutoRouteSettleSourceSwitched
        # 判据是「同一个 scrape 目标在 10 分钟窗口内**两族都有**结算增量」。
        # settleBatch 每个 sweep 只走一个族（S4 写门在批首捕获一次），所以
        # 稳态下窗口内只有一族在涨；两族同涨只出现在跨越切换的窗口里 ——
        # 这才是「切换事件」的形状。原版 changes(...)>0 对单调计数器意味着
        # 「10 分钟内结算过任意一条」，每个 sweep 都响，事件被噪声淹没
        # （R33 12h 审计，promtool 实证）。
        expr: |
          count by (job, instance) (increase(llmgw_autoroute_settle_source_total[10m]) > 0) > 1
        labels:
          severity: warning
          component: bg
        annotations:
          summary: "auto-route 结算数据源发生切换（S4 写门状态已变）"
          description: |
            同一实例在 10 分钟内 v1 与 session 两族都有结算增量 —— 只有
            跨越源切换的窗口才会出现这个形状（每个 sweep 只结算一族）。

            **这是事件，不是趋势** —— 所以本条没有 for: 抑制。每一次 S4 写门翻转
            都会让 outcome join / LATERAL / 基线 cohort 三条腿整体换源，而换源
            会改变 reward 分布（即使数据等价，见
            TestAutoRouteSettleSessionSourceMatchesV1OnIdenticalRows）。

            **换源时必须一起确认的**：
            1. AutoRouteSettleBaselineCohortEmpty 是否随之触发 —— 会话族的
               is_auto_request 覆盖只有 v1 的 80.4%（2026-09-19..26 实测：
               659252 / 820336），且本地近 24h 为 0 行
            2. cohort 的 p95/p75 会随总体改变（实测 p95 偏移 15.2%，注意该数字
               取自本地探针流量，不代表生产），因此**切换前后的 reward 不可逐位相等**，
               这一点必须写进变更记录，不要按「数据一致」验收
            3. 若需要真正跨切换可比，只能引入一个与被退役表无关的稳定 cohort
               —— 尚未实现，见审计 §9.44 的未决项

      - alert: AutoRouteSettleBaselineCohortEmpty
        expr: |
          llmgw_autoroute_settle_baseline_cohort_rows == 0
            and increase(llmgw_autoroute_settle_source_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
          component: bg
        annotations:
          summary: "auto-route 基线 cohort 为空，所有 reward 的延迟/成本项已塌成中性 0.5（{{ $labels.family }}）"
          description: |
            {{ $labels.family }} 族连续 5 分钟结算出了 selection，但基线 cohort 行数为 0。

            **正在发生的后果**：这些 selection 的延迟项与成本项都走了
            `0.5` 中性回落（ComputeRoutingRewardWithWeights 里 `P95BaselineMs > 0`
            不成立）。没有任何错误，reward 仍在 [0,1] 内，计数器照常增长 ——
            只有 cohort 区分快慢 / 贵贱的能力消失了，而且与「实测恰好中性」
            在输出上完全相同。

            **排查步骤**：
            1. 该族在 baselineWindow（24h）内 `is_auto_request = TRUE AND
               latency_ms IS NOT NULL` 的行数——直接查库，不要只看指标
            2. 若刚发生 S4 写门切换：会话族的 auto 覆盖不足是最可能的原因
               （本机实测 24h 内 0 行 vs v1 2178 行）
            3. 检查 `origin_actor` 合成流量过滤是否把 cohort 滤空
               （SQLExcludeSyntheticActors）

      - alert: AutoRouteSettleBaselineNeutralDominant
        # 左侧 {term,family}、右侧 {family}：比较默认按全标签配对，两个向量
        # 永远配不上（恒空 = 永不触发的死告警，R33 12h 审计 promtool 实证）。
        # 必须 on(family) + group_left（每个 family 有 latency/cost 两个 term，
        # 多对一）。
        expr: |
          sum by (term, family) (increase(llmgw_autoroute_settle_baseline_neutral_total[30m]))
            > on(family) group_left
          0.5 * sum by (family) (increase(llmgw_autoroute_settle_source_total[30m]))
        for: 10m
        labels:
          severity: warning
          component: bg
        annotations:
          summary: "超过一半的 auto-route selection 走了基线中性回落（{{ $labels.term }} / {{ $labels.family }}）"
          description: |
            30 分钟内，{{ $labels.term }} 项有超过 50% 的已结算 selection
            用的是中性 0.5 而不是实测基线归一化后的值。

            **这条比 cohort 归零更早发现局部问题**：cohort 可能整体非空，
            但**某个 task_type 的分组为空**（GROUP BY task_type 的 map 取值
            miss），此时全局 cohort_rows 看着正常，只有按 term 的回落率会动。

            latency 与 cost 是**独立**塌陷的：p95 有值而 p75 为 0 是常见形态
            （例如没有 cost_usd 的流量），所以按 term 分开统计，不合并成一个数。

      - alert: AutoRouteSettleSweepFailing
        # 结算 sweep 的**查询级失败**面（R32 审计 §四#2）。此前 settleBatch
        # 整查询出错只有 slog.Warn + 下一轮重查同批——任何 settlePendingSQL
        # 级别的回归都会无告警停滞，直到行被 8h promote 移出 hot、reward
        # 永久 NULL。计数器 bg/auto_route_settle_worker.go（reason ∈
        # {error,panic} 闭集）；panic 臂由 safeSweep 的 recover 递增。
        expr: |
          sum by (job, instance) (increase(llmgw_autoroute_settle_sweep_failures_total[30m])) > 0
        for: 10m
        labels:
          severity: warning
          component: bg
        annotations:
          summary: "auto-route 结算 sweep 近 30 分钟内有查询级失败（{{ $labels.instance }}）"
          description: |
            30 分钟窗口内至少一轮 sweep 以 error（settleBatch 整查询失败）或
            panic（safeSweep 接住）收场，那一批 selection 本轮没结算。

            **这条与停增告警（AutoRouteSettleStalled）是互补的两面**：本条抓
            「查询报错了」，停增抓「没报错但也没产出」（源族切到无数据的腿、
            设置门读失败静默回 v1——那条路径没有任何 error 可计）。

            **排查步骤**：
            1. 网关日志 grep "auto-route settle sweep failed"，看 error 正文
               （42P01=表没了 / 42703=列没了 / 57014=4m sweepCtx 超时）
            2. 单条失败+自愈 = 瞬断，30m 窗口过后自动恢复；持续增长才是回归
            3. panic 臂非零 → grep "settle sweep panic"，panic 不停的 sweep
               每轮都空转，selection 行照常积累

      - alert: AutoRouteSettleStalled
        # 结算**产出停增**面（R32 审计 §四#2/#3 的收口臂）。产侧（selection
        # 持久化）在走、结算侧 45 分钟零产出 —— 与源无关：settleBatch 查错表、
        # 设置门读失败静默回 v1 而该腿无数据、行龄超过 4h abandon 窗口等，
        # 全部落进这一个条件。
        #
        # 判据用 `unless on(job)` 而不是 `increase(...) == 0`：
        # settled_total 是 CounterVec，进程启动后到第一次成功结算前**序列不
        # 存在**，而 absent 序列对 `== 0` 判空剔除——「从启动起就没结算过」
        # 恰是最需要响的形态，`==0` 形态下它永远静默。unless 对 absent 的
        # rhs 判「无匹配即保留」，两种形态（存在但为 0 / 根本不存在）都响。
        #
        # 为什么聚合在 **job 级**而不是 job,instance（R33 域B P2-1，独立复审
        # 抓出）：结算由 distlock 单写者执行——每轮只有一个实例赢得 SetNX 去
        # settle，其余实例 skip。蓝绿双实例下相位靠后的实例 settled 序列永不
        # 增长而产侧照常产出，按 instance 评估会让该实例**常驻 critical 误报**
        # （当前本地单 target 掩盖了这一面）。结算管线是否与生产脱钩是部署级
        # 属性，不是实例级属性；实例归因交给 AutoRouteSettleSweepFailing（它
        # 没有 top-k 误报面：非 leader 从不跑 settleBatch，序列缺席=静默）。
        #
        # 已知误报面（如实登记）：goal-*/loopback 合成 selection 在写入时即被
        # 盖 settled（reward=NULL）且刻意不计入 settled_total——若窗口内产侧
        # 全是合成流量，本条会响。处置先核对 origin_actor 合成占比
        # （SQLExcludeSyntheticActors 同族过滤），再查结算侧。
        # 已知可见性边界（如实登记，R33 域B P3-②）：对「静默回 v1/停写」形态，
        # 本条只在 stop-write 后 ~4h 内可见——此后积压行到 abandon 窗口被批量
        # 盖 settled{outcome=abandoned}，rhs 复活、告警自清；「持续全-abandon」
        # 态本身（每轮都 abandon 无 rewarded）无独立门，依赖 reward 分布观测。
        expr: |
          sum by (job) (increase(llm_gateway_auto_selections_total[45m])) > 0
            unless on(job)
          sum by (job) (increase(llmgw_autoroute_settled_total[45m])) > 0
        for: 15m
        labels:
          severity: critical
          component: bg
        annotations:
          summary: "auto-route selection 在持续产出但结算管线已 45+ 分钟零产出（{{ $labels.job }}）"
          description: |
            部署级（job 聚合）产侧 llm_gateway_auto_selections_total 在 45
            分钟窗口内有增长，但 llmgw_autoroute_settled_total 零产出（或
            序列不存在）。这不是「没流量」——是**结算管线与生产脱钩**了。

            **正在发生的后果**：pending selection 行持续积累；行龄超过
            settleAbandonAfter（4h）后仍 unsettled 的行会被 8h promote 移出
            hot 表，那一批 selection 的 reward **永久 NULL**——训练数据静默
            缺口，事后无法回填。

            **排查步骤**：
            1. AutoRouteSettleSweepFailing 是否同时响——是 → 查询级回归，
               按那条的步骤走
            2. 只有本条响 → 结算没报错但没产出：确认结算源族
               （llmgw_autoroute_settle_source_total 哪个族在动）与 settings
               写门当前值是否一致；设置门读失败会静默回 v1（审计 §四#3）
            3. 产侧全是 goal-*/loopback 合成流量 → 误报，核对 origin_actor
               占比后按抑制处理
            4. 都不是 → 查 settle worker 进程是否存活（up == 0 另有门）
