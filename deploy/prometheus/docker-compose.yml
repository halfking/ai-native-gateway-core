version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: llm-gateway-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./rules:/etc/prometheus/rules
      # 2026-08-06: secrets/admin_token is required by the new
      # llm-gateway scrape job (bearer_token_file in prometheus.yml).
      # Create the file with `echo "$LLM_GATEWAY_ADMIN_API_KEY" > secrets/admin_token`
      # and chmod 600. Without this mount, prometheus logs a warning
      # and drops the Authorization header — combined with the new
      # fail-closed /metrics (admin_token_mw.go), the gateway's
      # /metrics endpoint rejects the scrape with 401.
      - ./secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: llm-gateway-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    # 2026-08-18 credential 17 follow-up: alertmanager 0.26 does not
    # resolve ${CREDENTIAL_TEAM_WEBHOOK_URL} inline (issue prom/alertmanager
    # #2719). We substitute the placeholder token in alertmanager.yml via sed
    # at container start so the secret never lives in the committed file. The
    # placeholder is `https://placeholder.invalid/##CREDENTIAL_TEAM_WEBHOOK_URL##`
    # — the `https://placeholder.invalid/` prefix (RFC-2606 reserved TLD) is
    # kept so an unconfigured deploy fails loudly instead of hitting a real
    # endpoint. The sed MUST match the whole prefix+token: `s|https://
    # placeholder.invalid/##CREDENTIAL_TEAM_WEBHOOK_URL##|URL|g`. A suffix-only
    # substitution (`s|##CREDENTIAL_TEAM_WEBHOOK_URL##|URL|g`) would yield the
    # malformed `https://placeholder.invalid/URL` and silently drop every alert.
    # If CREDENTIAL_TEAM_WEBHOOK_URL is unset the placeholder is left untouched
    # and webhook delivery fails loudly — preferable to a silently dropped alert.
    environment:
      - CREDENTIAL_TEAM_WEBHOOK_URL=${CREDENTIAL_TEAM_WEBHOOK_URL:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        cp /etc/alertmanager/alertmanager.yml /tmp/alertmanager.rendered.yml
        if [ -n "$$CREDENTIAL_TEAM_WEBHOOK_URL" ]; then
          sed -i "s|https://placeholder.invalid/##CREDENTIAL_TEAM_WEBHOOK_URL##|$$CREDENTIAL_TEAM_WEBHOOK_URL|g" /tmp/alertmanager.rendered.yml
        fi
        exec /bin/alertmanager \
          --config.file=/tmp/alertmanager.rendered.yml \
          --storage.path=/alertmanager
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.1.5
    container_name: llm-gateway-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false
    networks:
      - monitoring
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: llm-gateway-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

  # 2026-08-06: llm-gateway itself (placeholder for local dev scrape).
  # Production deployments will point prometheus.yml at the real gateway
  # host (LLM_GATEWAY_LISTEN:8781). The service name "llm-gateway"
  # matches the scrape target in prometheus.yml's `llm-gateway` job so
  # docker-compose up works end-to-end on a developer laptop without
  # needing host.docker.internal (which is Docker-Desktop-only and
  # silently fails on standard Linux Docker engine).
  llm-gateway:
    image: ghcr.io/your-org/llm-gateway-go:dev
    container_name: llm-gateway-go
    restart: unless-stopped
    ports:
      - "8781:8781"
    environment:
      - LLM_GATEWAY_LISTEN=:8781
      - LLM_GATEWAY_ADMIN_API_KEY=${LLM_GATEWAY_ADMIN_API_KEY:?set LLM_GATEWAY_ADMIN_API_KEY in .env so prometheus can scrape /metrics}
      - LLM_GATEWAY_ENV=dev
      - LLM_GATEWAY_DATABASE_URL=postgres://llm_gateway:llm_gateway@pg-252-pg17:5432/llm_gateway?sslmode=disable
    networks:
      - monitoring
    depends_on: []

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
