# llm-gateway-go — kaixuan-1 k3s (pms-test)
# NodePort 30080 → container :8781 (前后端一体镜像)
# 前置: Secret llm-gateway-secret 已存在 (database-url / secret-key / credential-encryption-key / admin-api-key)
# 部署: ./scripts/deploy.sh kaixuan-1  或  ./scripts/deploy-k8s.sh kaixuan-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway-go-deployment
  namespace: pms-test
  labels:
    app: llm-gateway-go
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: llm-gateway-go
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: llm-gateway-go
    spec:
      containers:
        - name: llm-gateway-go
          image: registry.itestu.cn/kx-llm-gateway-go:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8781
          env:
            - name: LLM_GATEWAY_LISTEN
              value: ":8781"
            - name: LLM_GATEWAY_LOG_LEVEL
              value: info
            - name: LLM_GATEWAY_IR_CONVERTER
              value: "true"
            - name: LLM_GATEWAY_TRANSPORT_IR
              value: "true"
            - name: TRANSPORT_LAYER_IR_ENABLED
              value: "true"
            - name: LLM_GATEWAY_STATIC_DIR
              value: /opt/llm-gateway-go/web/dist
            - name: LLM_GATEWAY_CORS_ORIGINS
              value: https://llm.itestu.cn
            - name: LLM_GATEWAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secret
                  key: database-url
            - name: LLM_GATEWAY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secret
                  key: secret-key
            - name: LLM_GATEWAY_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secret
                  key: credential-encryption-key
            - name: LLM_GATEWAY_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secret
                  key: admin-api-key
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-go-svc
  namespace: pms-test
  labels:
    app: llm-gateway-go
spec:
  type: NodePort
  selector:
    app: llm-gateway-go
  ports:
    - name: http
      port: 8781
      targetPort: http
      nodePort: 30080
