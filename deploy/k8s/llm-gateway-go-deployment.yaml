# llm-gateway-go — kaixuan-1 k3s (pms-test)
# NodePort 30080 → container :8781 (前后端一体镜像)
# 前置: Secret llm-gateway-secret 已存在 (database-url / secret-key / credential-encryption-key / admin-api-key)
# 部署: ./scripts/deploy.sh kaixuan-1  或  ./scripts/deploy-k8s.sh kaixuan-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway-go-deployment
  namespace: pms-test
  labels:
    app: llm-gateway-go
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: llm-gateway-go
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llm-gateway-go
    spec:
      nodeSelector:
        kubernetes.io/hostname: kaixuan-1
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 35
      containers:
        - name: llm-gateway-go
          # Keep this immutable release tag in sync with version.json/build_seq.
          image: registry.itestu.cn/kx-llm-gateway-go:2.5.0-1805
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8781
          env:
            - name: LLM_GATEWAY_LISTEN
              value: ":8781"
            - name: LLM_GATEWAY_LOG_LEVEL
              value: info
            - name: LLM_GATEWAY_STATIC_DIR
              value: /opt/llm-gateway-go/web/dist
            - name: LLM_GATEWAY_CORS_ORIGINS
              value: https://llm.itestu.cn
            # 附件与持久化诊断日志必须指向下方 volumes 挂载的容器路径
            # （storage-pvc.yaml 的 PVC），否则写入容器临时层、Pod 重建即丢失。
            # 主 slog 保持 stdout，供 kubectl logs 采集。
            - name: LLM_GATEWAY_ATTACHMENT_DIR
              value: /var/lib/llm-gateway/attachments
            - name: LLM_GATEWAY_PERSISTENT_LOG_DIR
              value: /var/log/llm-gateway
            - name: LLM_GATEWAY_RAW_LOG_DIR
              value: /var/lib/llm-gateway/raw-logs
            - name: LLM_GATEWAY_BACKUP_DIR
              value: /var/lib/llm-gateway/backups
            - name: LLM_GATEWAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secret
                  key: database-url
            - name: LLM_GATEWAY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secret
                  key: secret-key
            - name: LLM_GATEWAY_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secret
                  key: credential-encryption-key
            - name: LLM_GATEWAY_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-gateway-secret
                  key: admin-api-key
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: attachments
              mountPath: /var/lib/llm-gateway/attachments
            - name: persistent-logs
              mountPath: /var/log/llm-gateway
            - name: raw-logs
              mountPath: /var/lib/llm-gateway/raw-logs
            - name: backups
              mountPath: /var/lib/llm-gateway/backups
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: llm-gateway-attachments-pvc
        - name: persistent-logs
          persistentVolumeClaim:
            claimName: llm-gateway-logs-pvc
        - name: raw-logs
          persistentVolumeClaim:
            claimName: llm-gateway-raw-logs-pvc
        - name: backups
          persistentVolumeClaim:
            claimName: llm-gateway-backups-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway-go-svc
  namespace: pms-test
  labels:
    app: llm-gateway-go
spec:
  type: NodePort
  selector:
    app: llm-gateway-go
  ports:
    - name: http
      port: 8781
      targetPort: http
      nodePort: 30080
