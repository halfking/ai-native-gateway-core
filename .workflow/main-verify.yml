# Codeup Flow 流水线（阿里云云效）——最小验证门。
#
# 背景（2026-09-14 auto-matching 审计第 6 项，人工确认"两者都做"）：仓库远端
# 仅 codeup，`.github/workflows/` 在 codeup 不执行，此前无生效 CI 载体。
# 本文件是 codeup Flow 的流水线即代码配置：build + vet + 240 例 auto 匹配
# 离线套件（纯离线、无网络、无 skip 守卫）。
#
# 完整门禁仍是本地 `./verify.sh`（含 go test ./... / 迁移 checksum / 隐私
# 合规 / 前端构建等），口径记录于 README「CI 与门禁」一节。
#
# 注意：codeup Flow 首次启用需在仓库「流水线」页导入 .workflow/ 下的流水线
# 配置（或新建流水线时选择"流水线即代码"指向本文件）；导入后每次 push/PR
# 自动触发。

version: '1.0'

sources:
  repo:
    type: codeup
    name: llm-gateway-go
    events:
      push:
        branches:
          refs:
            - main
      pull_request:
        branches:
          refs:
            - main

stages:
  verify:
    name: build-vet-suite
    jobs:
      go-verify:
        name: go1.27-build-vet-suite
        runsOn: public/cn-eastwood2_4c8g_linux_x86_64
        steps:
          steps:
            - step: shell
              name: setup-go
              script: |
                GO_VERSION=1.27.2
                if ! command -v go >/dev/null 2>&1 || [ "$(go version)" != "go version go${GO_VERSION} linux/amd64" ]; then
                  curl -sSfL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
                  rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tgz
                fi
                go version
            - step: shell
              name: build
              script: |
                export PATH=$PATH:/usr/local/go/bin
                go build ./...
            - step: shell
              name: vet
              script: |
                export PATH=$PATH:/usr/local/go/bin
                go vet ./autoroute/...
            - step: shell
              name: auto-matching-suite
              script: |
                export PATH=$PATH:/usr/local/go/bin
                go test ./autoroute/ -run 'TestAutoMatchingSuiteHeuristic|TestPromptClassificationMatrix' -count=1 -v
            # ★★★ 2026-10-24 magpie 对齐轮 §3.17：把审计守卫接进**真正在跑的载体**。
            #
            # ★ 起因：本仓远端是 codeup.aliyun.com ⇒ **`.github/workflows/` 从来不在
            #   任何在跑的 CI 里** ⇒ `make guards`（它唯一的调用方在那个目录里）
            #   **在 CI 上是空转的** ⇒ ★★ 「门是绿的」在 CI 上是空转（本地绿、CI 绿，
            #   但 CI 从没跑过它）——**这正是本文件自己的开头注释承认过的那件事**，
            #   只是当时没有载体去跑它。
            #
            # ★ 为什么是 `guards-fast` 而不是 `make guards`：
            #   `make guards` 含 slow 门（scripts/ursmcheck，126 个门文件）
            #   ⇒ 4 核 Linux 实测 **767s（13 分钟）** ⇒ 超出本 job 的常规预算。
            #   ⇒ 慢门留在本地 `make guards` 与官方门 `verify.sh` 的 `go test ./...`。
            #   快门实测（4 核 Linux）：116s 墙钟，最慢单包 14.3s ⇒ 预算内。
            #
            # ★ 2026-11-02 第二十四轮修正一处**过期读数**（★ 读数自己会过期，
            #   必须有人回填 —— 同 Makefile 里那条纪律）：
            #   「在精简镜像里会因缺 python3 而红」—— ★ **不准确**：
            #   仓内自己的门消息写的是「★ 请装 Python 3（★ CI 镜像自带）」，
            #   且**本 job 的下一步就在跑 `python3 -c`** ⇒ 缺的是**时间**不是工具。
            # ★ 本轮快门新增 `guards-gate-scripts`（13 条门脚本门，实测单条
            #   0–14s、合计 ≈48s）⇒ 快门墙钟按实测回填为 **72–93s**（macOS 两次，
            #   **已含**新增部分）⇒ 4 核 Linux 的新读数待 CI 复测。
            # ★ 2026-11-04（F-15）：★ 该 target 又接进 1 条快门
            #   （tests/shared_lib_resolution_contract_test.sh，实测 ≈0.3s）
            #   ⇒ 门脚本门 13 → **14** 条 ⇒ ★ 墙钟预算**不受影响**（+0.3s）。
            # ★ 2026-11-05（211 蓝绿并发事故轮 + 同步效率轮）：★ 该 target 再接进 **2 条**快门
            #   （tests/deploy_target_lock_concurrency_test.sh 实测 ≈3s、
            #     tests/deploy_sync_prune_contract_test.sh 实测 ≈21s）
            #   ⇒ 门脚本门 14 → **16** 条 ⇒ ★ 墙钟预算 +≈24s（4 核 Linux 新读数待 CI 复测）。
            #   ★ 两条门均 **bash 3.2 可跑**、零外部依赖：目标锁门用 **PATH 垫片**把
            #     ssh/scp 换成本机执行（真引擎、真远端命令形态，不碰真目标机）；
            #     剪枝门执行**引擎里那条真实的 find + tar 命令**并**打真产物**再验内容
            #     ⇒ ⇒ 不给 CI 引入新环境依赖，也不把「清单」当代理量。
            # ★ 2026-11-05（245/154 部署断链轮）：★ 该 target 再接进 **1 条**快门
            #   （tests/envs_resolution_contract_test.sh，实测 ≈0.3s）
            #   ⇒ 门脚本门 16 → **17** 条 ⇒ ★ 墙钟预算 +≈0.3s（**不受影响**）。
            #   ★ 起因：工作区 2026-11-04 重组把 envs 仓落到 ai-native-tools/deploy/envs
            #     ⇒ 245/154 部署脚本里的两候选链全落空 ⇒ 部署第一步就退出
            #     ⇒ 解析收口到 scripts/envs-resolve.sh，并给它配一道行为门
            #     （夹具由**实现自己的候选链**推导 ⇒ 布局改名不假红）。
            #   ★ 排位有意在 tests/deploy_local_contract_test.sh **之前**
            #     ⇒ `make` 遇红即中止 ⇒ 排在后面的门在前面红着时**根本跑不到**
            #     ⇒ ★「接线了却跑不到」＝ 门自称有牙实则没牙（比没接线更坏）。
            # ★ 2026-11-05（245/154 部署断链轮 · 第二处）：★ 该 target 再接进 **1 条**快门
            #   （tests/migration_retired_marker_contract_test.sh，实测 ≈2s）
            #   ⇒ 门脚本门 17 → **18** 条 ⇒ ★ 墙钟预算 +≈2s。
            #   ★ 起因：部署在「切换前 pending 迁移」这步中止（946 的外键指向
            #     sales_quote_versions 不存在）⇒ 根因＝共享部署库的**退役判据**
            #     把表头提到 superseded 的 944/945 **静默丢弃** ⇒ 本仓配一道行为门，
            #     判据取**共享库的真实现**（共享库不可达时才回落规定口径并明说）。
            # ★ 2026-11-09（r1050 轮复核）：★ **快门的每包 timeout 由 120s 提到 600s**
            #   （★ `Makefile` 的 `guards` 与 `guards-fast` **两个 target 同档** ⇒ ★★
            #   ★★ 本 job 跑的就是 `guards-fast` ⇒ ★★ 它直接受这条预算约束）。
            #   ★ 起因（★ 实测）：★ 本地跑 `make guards-fast` ⇒ `internal/sqlguard`
            #   ★★ **FAIL 120.029s**，日志是 `panic: test timed out after 2m0s` ⇒ ★★★
            #   ★★★ **是腰斩、不是判据红**（★ 隔离重跑 ⇒ ok，墙钟 170.156s，★ 有负载
            #   ★★★ 档二次复测 189.16s）⇒ ★★★ **该包本来就跑不完 120s 的预算** ⇒
            #   ★★★ **⇒ CI 主门在稍慢的机器上必然腰斩** ⇒ ★★★ **预算失配，不是噪声**。
            #   ★★★★ ★★ **预算按「在门里跑」的读数定，不是按「隔离跑」的读数定** ★★：
            #   ★★ 三次读数给出三个数 —— ★ ① 隔离跑（低负载）**170.156s**；
            #   ★★ ② 隔离跑（有负载档）**189.16s**（★ 而 CPU 仅 **44.15s** ⇒ ★★ 慢在 I/O
            #   ★★★ 与调度争用，**不在 CPU**）；★★ ③ **在门里跑**（★ 29 个包并行）
            #   ★★★ **268.823s** ← ★★★★ **门内的真实成本** ⇒ ★★★ ① 与 ③ 差 **1.58x**
            #   ★★★★ ⇒ ★★ **按隔离读数定预算 ⇒ 门里必腰斩** ⇒ ⇒ ★★ 取 **600s**
            #   ★★★ （★ 对 268.823s 留 **~2.23x**）。
            #   ★★★★ **为什么不给「本机实测 + 小余量」**：★ CI 是 **4 核 Linux 容器**
            #   ★★★★ （★ 本机 10 核 + 外部负载 250~345）⇒ ★★★ **单核速度、磁盘与并行度
            #   ★★★★ 都可能更慢** ⇒ ★★ **在拿到 CI 复测读数之前，预算必须按上界定**。
            #   ★★★★ 而腰斩**有破坏面**：★ `testing` 的超时是 alarm goroutine 里的
            #   ★★★★ panic ⇒ 其它 goroutine 的 `defer` 不执行 ⇒ ★★ 而
            #   ★★★★ `internal/sqlguard/sql_literal_guard_selftest_test.go` **确实写仓内
            #   ★★★★ 文件** ⇒ ⇒ ★★ **被跟踪的台账可能静默留空** ⇒ ⇒ ★★ 预算必须给足。
            #   ⚠ **提高的是「每包杀开关上限」，不是任何一道门的判据** ⇒ ★★ 绿灯还是
            #   ⚠ 绿灯，红灯还是红灯 ⇒ ★★ **它只会让「健康但慢」的包不被腰斩**。
            #   ⚠ **也不增加 CI 墙钟**：★ 各包并行执行，★ 总墙钟由最慢的包决定 ⇒ ★★
            #   ⚠ **提的是上限，不是下限** ⇒ ★★ 快门的墙钟只随「实际最慢包」变化。
            # ★ 顺带更正两处**过期读数**（★ 读数自己会过期）：
            #   ① 上面第 73 行的「126 个门文件」⇒ ★ **已是 180 个**（★ 实时数见
            #      `scripts/checks/guards-sync.sh` 的正常路径输出 ⇒ ★★ **以那个为准**）；
            #   ② 第 76 行的「116s 墙钟、最慢单包 14.3s」⇒ ★ **那是 2026-10 月的
            #      读数**，★ 本轮 2026-11-09 本机**门内**实测最慢单包已是 **268.823s**
            #      ⇒ ★★★ **⇒ 上面的 600s 预算正是为此而提**。
            # ★ 与此同时，**切流状态机门（实测 ≈270s）被有意排除在快门之外**
            #   （单列 `make guards-deploy-state-machine`，只进 `make guards`
            #     与 `verify.sh`）—— ★ ≈270s ≫ 快门预算 ⇒ 塞进来会撑爆预算。
            #
            # ★ 判据写在这条 **非注释行**上是有意的：
            #   `scripts/ursmcheck/ci_carrier_truth_test.go` 的 C3 判据要求
            #   「**真正在跑的载体**里必须有非注释行调门禁」⇒ 注释里写不算。
            - step: shell
              name: audit-guards
              script: |
                export PATH=$PATH:/usr/local/go/bin
                make guards-fast
                # Windows 全量测试基线门（2026-10-29 审计轮）：CI runner 是 Linux ⇒
                # 全量 go test 的失败集与 Windows 基线不同族 ⇒ 这里只跑**静态自证腿**
                # （门脚本语法 + baseline JSON 可解析），实测比对腿在 Windows 开发机
                # `make guards-win-baseline`（无参自跑全量，约 10 分钟）。
                # Linux 上裸跑实测腿 = 整片假红源（Windows 专属失败集不在 Linux 复现）。
                bash -n scripts/guards/check-win-test-baseline.sh
                python3 -c "import json; d=json.load(open('scripts/guards/win-test-baseline.json', encoding='utf-8')); assert d['packages'] and isinstance(d.get('package_level'), list); print('win-test-baseline.json OK:', len(d['packages']), 'packages')"
