# ====================================================================
# llm-gateway-go Docker Compose 配置（持久化存储版本）
# ====================================================================
# 用法: docker compose -f docker-compose.persistent.yml up -d
# 说明: 将附件和日志持久化到宿主机，容器重启数据不丢失
# ====================================================================

version: '3.8'

services:
  llm-gateway-go:
    image: ${REGISTRY:-registry.internal.example.com}/kaixuan-platform-llm-gateway-go:${TAG:-latest}
    container_name: kx-llm-gateway-go
    restart: always
    
    ports:
      - "${PORT:-8781}:8781"
    
    # ── 持久化存储配置 ──────────────────────────────────────────────
    volumes:
      # 附件存储：挂载到宿主机
      - ${HOST_ATTACHMENT_DIR:-./data/attachments}:/opt/llm-gateway-go/data/attachments
      # 日志存储：挂载到宿主机
      - ${HOST_LOG_DIR:-./data/logs}:/var/log/llm-gateway
    
    environment:
      # ── 基础配置 ──────────────────────────────────────────────────
      LLM_GATEWAY_ENV: ${LLM_GATEWAY_ENV:-local}
      LLM_GATEWAY_LISTEN: ":8781"
      
      # ── 数据库 ────────────────────────────────────────────────────
      LLM_GATEWAY_DATABASE_URL: ${LLM_GATEWAY_DATABASE_URL:?LLM_GATEWAY_DATABASE_URL is required}
      
      # ── Redis ─────────────────────────────────────────────────────
      LLM_GATEWAY_REDIS_ADDR: ${LLM_GATEWAY_REDIS_ADDR:?LLM_GATEWAY_REDIS_ADDR is required}
      LLM_GATEWAY_REDIS_PASSWORD: ${LLM_GATEWAY_REDIS_PASSWORD:-}
      LLM_GATEWAY_REDIS_DB: ${LLM_GATEWAY_REDIS_DB:-0}
      
      # ── 认证 ──────────────────────────────────────────────────────
      LLM_GATEWAY_CREDENTIAL_ENCRYPTION_KEY: ${LLM_GATEWAY_CREDENTIAL_ENCRYPTION_KEY:?LLM_GATEWAY_CREDENTIAL_ENCRYPTION_KEY is required}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:?LLM_GATEWAY_API_KEY is required}
      LLM_GATEWAY_ADMIN_API_KEY: ${LLM_GATEWAY_ADMIN_API_KEY:?LLM_GATEWAY_ADMIN_API_KEY is required}
      LLM_GATEWAY_SECRET_KEY: ${LLM_GATEWAY_SECRET_KEY:?LLM_GATEWAY_SECRET_KEY is required}
      CASDOOR_ENDPOINT: ${CASDOOR_ENDPOINT:-}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:-}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:-}
      
      # ── 存储路径配置 ──────────────────────────────────────────────
      # 附件和持久化诊断日志均对应 volume 挂载点。
      LLM_GATEWAY_ATTACHMENT_DIR: /opt/llm-gateway-go/data/attachments
      LLM_GATEWAY_PERSISTENT_LOG_DIR: /var/log/llm-gateway
      
      # ── 日志配置 ──────────────────────────────────────────────────
      LLM_GATEWAY_LOG_LEVEL: ${LLM_GATEWAY_LOG_LEVEL:-info}
      LLM_GATEWAY_LOG_FORMAT: ${LLM_GATEWAY_LOG_FORMAT:-json}
      LLM_GATEWAY_LOG_FILE: /var/log/llm-gateway/gateway.log
      LLM_GATEWAY_LOG_MAX_SIZE_MB: ${LLM_GATEWAY_LOG_MAX_SIZE_MB:-100}
      LLM_GATEWAY_LOG_MAX_BACKUPS: ${LLM_GATEWAY_LOG_MAX_BACKUPS:-10}
      LLM_GATEWAY_LOG_MAX_AGE_DAYS: ${LLM_GATEWAY_LOG_MAX_AGE_DAYS:-7}
      LLM_GATEWAY_LOG_COMPRESS: ${LLM_GATEWAY_LOG_COMPRESS:-true}
    
    # ── 健康检查 ──────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8781/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    
    # ── 网络配置 ──────────────────────────────────────────────────
    networks:
      - kaixuan_local_net

networks:
  kaixuan_local_net:
    external: true
