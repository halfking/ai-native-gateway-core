# Memora 健康桩 —— 提示词优化模块本地测试用
#
# 与 docker-compose.dev-research.yml 的 memora-healthz.conf 的区别：
#   那个桩只服务 /healthz（给 gateway-v2 启动探针用）；
#   这个桩还要模拟 memora 的 **/api/search** 契约，否则
#   domains/memory/client.Client 解析响应时会拿到非 JSON ⇒
#   "invalid character 'm' looking for beginning of value"。
#
# 契约来源：domains/memory/client/client.go:485-513 的 raw 结构体
#   {"query": "...", "results": [{"id","content","tags","mem_cube_id","score"}], "count": N}
#
# 返回的示例记忆用于让"接了 memora 的优化链路"真的能被测到：
# 命中时优化器会把历史片段纳入上下文。

server {
    listen 80;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /api/search {
        default_type application/json;
        return 200 '{"query":"","count":2,"results":[{"id":"stub-1","content":"结构化提示词应包含角色定义、任务目标、约束条件与输出格式四要素","tags":["prompt","structure"],"mem_cube_id":"stub-cube-1","score":0.92},{"id":"stub-2","content":"Few-shot 示例要覆盖边界情况，并说明每个示例的选取理由","tags":["prompt","fewshot"],"mem_cube_id":"stub-cube-1","score":0.81}]}';
    }

    location / {
        default_type text/plain;
        return 200 "memora-stub-ok\n";
    }
}
