# Memora MCP mock healthz endpoint
# Used by local-r112 docker-compose to provide a fake /healthz for gateway-v2
# TODO(r112): replace with real kx-memora-mcp image

server {
    listen 80;
    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        default_type text/plain;
        return 200 "memora-mock-ok\n";
    }
}
