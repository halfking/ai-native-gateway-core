# docker-compose for local mock LLM testing
# Usage: cd scripts/mocks && docker-compose up
#
# 启动 12 个 mock 实例 (mock-a .. mock-l)，端口 19080-19091。
# 如需调整数量/端口，用环境变量：NUM_MOCKS=8 MOCK_START_PORT=19080 docker-compose up
#
# 注意：docker-compose 不支持循环生成 service，这里显式列出 12 个。
# 若只跑 4 个，用 NUM_MOCKS=4 docker-compose up --scale（但端口映射固定）。
# 推荐用 scripts/comprehensive-loadtest.sh start-mocks 直接拉起进程（更灵活）。

version: '3.8'

x-mock-base: &mock-base
  build:
    context: llm-mock-upstream
    dockerfile: Dockerfile.v2
  restart: unless-stopped

services:
  mock-a:
    <<: *mock-base
    ports: ["19080:18080"]
    environment: {MOCK_PORT: "18080", MOCK_TOKEN: "mock-00", MOCK_STATE_FILE: "/tmp/mock-state-A.json"}
    volumes: [./data:/tmp]
    healthcheck: {test: ["CMD", "wget", "-q", "-O-", "http://localhost:18080/healthz"], interval: 5s, timeout: 3s, retries: 3}

  mock-b:
    <<: *mock-base
    ports: ["19081:18080"]
    environment: {MOCK_PORT: "18080", MOCK_TOKEN: "mock-01", MOCK_STATE_FILE: "/tmp/mock-state-B.json"}
