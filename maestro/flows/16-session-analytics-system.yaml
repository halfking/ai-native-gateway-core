# 16-session-analytics-system.yaml —— 会话分析系统逐页验证
#   （2026-11-20 交付轮；2026-11-23 L13 判据收敛轮：中文文案断言 → data-testid 断言）
#
# 覆盖对象（★ 2026-11-23 起总览页已被上游整合，见下）：
#   /admin/session-analytics                        → **重定向** → /admin/session-analytics/users
#                                                      （SessionAnalyticsUsersView：会话统计面板 + Top5 四件套 + Top10 用户排行）
#   /admin/session-analytics/user-ranking           → SessionAnalyticsUserRankingView（人员排行）
#   /admin/session-analytics/user-ranking/:owner    → SessionAnalyticsUserDetailView（人员详情）
#   /admin/session-analytics/agent-ranking          → SessionAnalyticsAgentRankingView（智能体排行）
#   /admin/session-analytics/model-ranking          → SessionAnalyticsModelRankingView（模型排行）
#
# ★ 本 flow 的存在理由：owner 需求＝「为会话分析的页面补做 Maestro/E2E 真实部署验证」。
#   此前这些页面**从未被浏览器打开过**——单元测试覆盖的是 API 形状与组件渲染，
#   但「页面在真实部署上能不能打开、数据能不能出来、点进去对不对」是**另一条断言**。
#   （与 12-live-stage-tree / 13-session-analytics-users 同一理由：
#     路由存在 ≠ 页面能打开；页面能打开 ≠ 数据对得上。）
#
# ★★ 2026-11-23 L13 判据收敛（本文件的**核心变更**）：
#   断言判据**从「中文文案」换成「data-testid」**。这不是洁癖——文案判据在
#   两个方向上都会假红：
#     ① **文案漂移**：断言值与 locale 键的实际值对不上时，断言恒红而页面是好的
#        ⇒ 量具失灵。实测（本次收口时逐条核对 zh-CN/sessionAnalytics.ts）：
#          · `col.tokens` = 「Token 数」，旧 flow 断的是「Token 总数」⇒ 必红
#          · `col.keyAlias` = 「Key别名」，旧 flow 断的是「密钥别名」⇒ 必红
#          · `col.keyID` = 「Key ID」，旧 flow 断的是「密钥 ID」⇒ 必红
#          · `col.cacheRate` = 「缓存命中率」，旧 flow 断的是「缓存率」⇒ 必红
#          · `col.projectCount` = 「关联项目数」，旧 flow 断的是「项目数」⇒ 必红
#        ⇒ ④.1/④.2 两段**整体必然假红**（与数据、与部署都无关）。
#     ② **locale 依赖**：应用 locale 取自 `navigator.language`（web/src/i18n.ts:82）
#        并持久化在 `localStorage['llmgw_locale']` ⇒ 浏览器语言不是 zh-CN 时
#        中文文案断言全红；runner 的 `--lang=zh-CN` 只是**缓解**，不是根治。
#   ⇒ data-testid 是**结构判据**：与语言无关、与文案漂移无关。
#   ★ 反向代价（必须知道）：判据与**可见文案**脱钩了——改文案不再让 E2E 变红。
#     所以「文案本身对不对」由**另一条链**守：i18n 门禁（localeValueQuality /
#     i18n-shared-dead-count 等）+ 8 语种同构检查；本 flow 只守「结构在不在、数据到没到」。
#
# ★ 与上游 13-flow 的分工（两套系统并存，路径不重叠）：
#   上游 13-flow 管的是 `/admin/session-analytics/users|clients|tasks`（用户画像族，
#   数据源 request_logs 窗口口径）；
#   本 flow 管的是聚合分析族 4 页（user-ranking|agent-ranking|model-ranking）
#   + `/admin/session-analytics` 的**重定向落点**（users 页整合后的锚点）。
#   ⇒ 两套路由**并存**（前者 users，后者 user-ranking），不构成路径冲突。
#
# ★ 断言写法受 Maestro 2.11 web 驱动实测边界约束（13-flow 头注同源）：
#   ① `text:` 是**全匹配正则** ⇒ 读数会变的元素一律 `.*….*`；
#   ② ★★ **2026-11-23（L13 收口轮）更正**：`id:` **能选到 <button>**
#      —— 本文件原注释断言「`id:` 选得到 data-testid 但**选不到 <button>**」
#      ⇒ ★★ **该结论经真机实测被推翻**（`tapOn: id: sa-tab-models` /
#      `sa-tab-apikeys` 均 COMPLETED，点后对应表与表头断言全过）
#      ⇒ ⇒ 本 flow 的**全部断言与交互**现已走 `id:`（data-testid）
#      ⇒ ⇒ **不再依赖界面语言**（L13 收口）。
#      ★ ★ 通用式：**「实测结论」本身也会过期** ⇒ 头注里写死的结论必须
#      **标注日期 + 可被复跑的证伪路径**，否则它会变成一条没人再验的传闻。
#   ③ pressKey Escape 在 web 驱动不支持；
#   ④ ★ **视口必须 1440x3600**（★ 2026-11-23 由 1440x1400 上调 —— 上游 L7 轮
#      把 stats 面板加高 ⇒ 会话分析 users 页锚点被推到 1400px 折叠线以下：
#      实测文档 Y：sa-top5-section=2437 / sa-range-label=3223 / sa-users-col-rank=3329
#      ⇒ ★ 旧视口下**必然假红**；真旋钮是 Maestro 的 `--screen-size`
#      （`run-session-analytics.sh` 的 `MAESTRO_SCREEN_SIZE`），
#      **不是** Chrome 的 `--window-size`（误改后者实测截图仍 1440×1257））；
#   ⑤ **宽表横向滚动在 DataTable 的内部容器里**（`.app-data-table__scroller`
#      的 overflow-x:auto）⇒ 右侧列不在视口内 ⇒ 本 flow 只断**左侧列**，
#      右侧列与折叠线下的内容归第二层 CDP 探针
#      `maestro/tools/assert-session-analytics.mjs`（与 13-flow 的
#      `assert-users-usage.mjs` 同一分工）。
#
# ★ 「数据已到」的判据：断**数据卡/表头**而不是「页面加载成功」——
#   DataTable 在 loading 时用 spinner **替换整个表格区域** ⇒ 表头出现即数据到位；
#   详情页的 4 张指标卡同理（`detail` 未就绪时整块不渲染）。
#
# ★ 登录：走仓内既有资产 _shared/login.yaml（真实 UI 登录，凭据由
#   -e ADMIN_USER / -e ADMIN_PASSWORD 传入；口令不进仓内文件）。
#
# ★★ 运行前提（2026-11-20 批判式审计补）：
#   ① **必须经 maestro/run-session-analytics.sh 运行**——它负责解析动态段
#      `${SESSION_OWNER}`（喂真值）、起**全新**的 Chrome（带 `--lang=zh-CN`）、
#      并把端口/凭据/窗口一起喂进来。直接 `maestro test` 跑本 flow ⇒
#      动态段为空 ⇒ 详情页 URL 变成 `/admin/session-analytics/user-ranking/`
#      ⇒ 断的是「路由不存在」而不是「详情页坏了」⇒ **量具错**。
#   ② **flow ↔ 前端 testid 的对应关系由钉测守着**：
#      web/src/views/admin/session-analytics/saTestIds.contract.spec.ts
#      ⇒ 本 flow 里出现的每个 `id:` 都必须在前端源码里存在（反之亦然）
#      ⇒ 「改了 flow 忘了加 testid」/「删了 testid 忘了改 flow」都会在 CI 报红。
url: ${BASE_URL}
---
# ── 0. 起点归零：若上一轮留下登录态，先退出 ────────────────────────────────
- openLink: ${BASE_URL}/dashboard
- tapOn:
    text: "系统管理员"
    optional: true
- tapOn:
    text: "退出登录"
    optional: true

# ── ① 真实 UI 登录（三段判据见 _shared/login.yaml 头注）─────────────────────
- runFlow:
    file: _shared/login.yaml
    env:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME}

# ═══ ② 聚合总览（/admin/session-analytics → 重定向到 /users）══════════════
# ★ 2026-11-23：上游整合把总览页内容迁进 /admin/session-analytics/users，
#   原 SessionAnalyticsOverviewView 组件已删除、路由改为 redirect ⇒ 本段
#   改为断**重定向落点**：重定向没坏 + 落点页三个区块（Top5 四件套 / Top10 排行 /
#   区间与刷新控件）都在。
#   ★ 落定判据＝Top10 表头（表头出现 = 该表数据到位）。
- openLink: ${BASE_URL}/admin/session-analytics
# ★★★★ 2026-11-23（L15 真机复核轮）**本段曾必然假红**——量具修正，不是产品修正：
#   上游 L7 轮（会话统计「包含探测」开关修复）把 stats 面板**加高**（11 卡 + 趋势
#   + 合规明细 + 模型 Top10 全塞进面板）⇒ 本页锚点被整体推到 **1400px 视口折叠线以下**：
#     实测文档 Y 坐标：sa-top5-section=**2437**、sa-range-label=**3223**、
#                     sa-users-col-rank=**3329**（旧视口高 1400）
#   ⇒ Maestro 的「看得见」只认**视口内**（本文件头注④早写过「折叠线以下的内容
#     断言不到」）⇒ 旧写法**必然假红**（2026-11-23 真机实测 flow rc=1 FAILED=1，
#     而同一时刻 CDP 侧 t+2s 就已渲染出该元素 ⇒ **产品是好的**）。
#   ⇒ 修法（实测两条，只有一条成立）：① `scrollUntilVisible` —— ★ **web 驱动
#     不支持滚动**（Maestro 直接报「No visible element found」）⇒ **弃用**；
#     ② **加高视口** ⇒ `run-session-analytics.sh` 把 Maestro Chrome 的
#     `--window-size` 从 1440,1400 提到 **1440,3600**（> 最高锚点 3329）
#     ⇒ ★ 视口就是本文件头注④点名的那个旋钮 ⇒ 断言强度不变（Top10 表头出现
#     = 该表数据到位），只解决「够不着」。
- extendedWaitUntil:
    visible:
      id: "sa-page-users"
    timeout: 30000
- assertVisible:
    id: "sa-page-users"
- assertVisible:
    id: "sa-refresh-btn"
- extendedWaitUntil:
    visible:
      id: "sa-top5-section"
    timeout: 30000
- assertVisible:
    id: "sa-top5-section"
- assertVisible:
    id: "sa-range-label"
# ★ 落定判据：Top10 表头出现 = 该表数据到位（表头在 loading 时被 spinner 整块替换）
- extendedWaitUntil:
    visible:
      id: "sa-users-col-rank"
    timeout: 30000
- assertVisible:
    id: "sa-users-table"
- assertVisible:
    id: "sa-users-col-rank"
- assertVisible:
    id: "sa-users-col-owner"
- assertVisible:
    id: "sa-users-col-email"
- assertVisible:
    id: "sa-users-col-sessions"
- assertVisible:
    id: "sa-users-col-projects"

# ═══ ③ 人员排行页 ═══════════════════════════════════════════════════════
# 落定判据＝「排名」列头（该页独有的表头；表头出现 = 数据到位）。
- openLink: ${BASE_URL}/admin/session-analytics/user-ranking
- extendedWaitUntil:
