- assertVisible:
    id: "sa-range-label"
- assertVisible:
    id: "sa-refresh-btn"
- assertVisible:
    id: "sa-user-ranking-filters"
- assertVisible:
    id: "sa-user-ranking-table"
- assertVisible:
    id: "sa-user-ranking-col-rank"
- assertVisible:
    id: "sa-user-ranking-col-owner"
- assertVisible:
    id: "sa-user-ranking-col-email"
- assertVisible:
    id: "sa-user-ranking-col-sessions"
- assertVisible:
    id: "sa-user-ranking-col-projects"

# ═══ ④ 人员详情页（动态段：owner 由真数据解析，见 run-session-analytics.sh）══
# 落定判据＝「当前排名」指标卡（详情页独有的指标；`detail` 未就绪时整块不渲染）。
- openLink: ${BASE_URL}/admin/session-analytics/user-ranking/${SESSION_OWNER}
- extendedWaitUntil:
