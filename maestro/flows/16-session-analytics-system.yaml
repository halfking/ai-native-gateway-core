# ── ④.1 用户详情页 - 模型用量 tab ──────────────────────────────────────
# ★★ 2026-11-23（L13 收口轮）：本行由**中文文案**改为 **data-testid**。
#   ★ 原注释断言「Maestro 2.11 web 驱动的 `id:` **选不到 <button>**」⇒ 交互只能走 text:
#     —— ★★ **该结论经 2026-11-23 真机实测被推翻**：
#     `tapOn: id: sa-tab-models` / `tapOn: id: sa-tab-apikeys` **都能点中** tab 按钮
#     （实测 COMPLETED，且点后对应表与表头断言全过）。
#   ⇒ ★ 前端这两个 tab **本来就有 data-testid**（`SessionAnalyticsUserDetailView.vue`
#     的 `sa-tab-models` / `sa-tab-apikeys`）⇒ ⇒ **改成 id: 零前端改动、零部署**。
#   ⇒ ★★ **这是 L13（flow 层文案判据）的最后两处依赖** ⇒ 改完后本 flow 的
#     **全部断言与交互都不再依赖界面语言**（连同 §0 的登出两行，它们是 `optional: true`
#     ⇒ 换语种下只是 WARNED，不影响判定）。
#   ⇒ ★ 复现命令见 §7.13 的「locale 无关性实测」。
