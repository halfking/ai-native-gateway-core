    id: "sa-tab-models"
- extendedWaitUntil:
    visible:
      id: "sa-user-models-col-model"
    timeout: 10000
- assertVisible:
    id: "sa-user-models-table"
- assertVisible:
    id: "sa-user-models-col-model"
- assertVisible:
