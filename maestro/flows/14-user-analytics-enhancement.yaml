# 14-user-analytics-enhancement.yaml —— 用户会话分析增强验证
#
# 覆盖对象：
# - web/src/views/UserProfileListView.vue（用户画像列表）
# - web/src/views/UserProfileView.vue（用户画像详情）
# - admin/user_profile.go（后端 API）
#
# 验证内容：
# 1. 用户画像列表页面可访问
# 2. 用户详情页面包含模型使用明细
# 3. 帮助面板可打开和关闭
# 4. 模型使用统计表格显示正确的列
# 5. 时间范围选择器工作正常
#
# 运行方式：
#   maestro test maestro/flows/14-user-analytics-enhancement.yaml \
#     --env BASE_URL=http://localhost:9090 \
#     --env ADMIN_USER=admin \
#     --env ADMIN_PASSWORD=your_password \
#     --screen-size 1440x2200
#
url: ${BASE_URL}
---
# ── 0. 登录准备 ────────────────────────────────────────────────────
- openLink: ${BASE_URL}/dashboard
- tapOn:
    text: "系统管理员"
    optional: true
- tapOn:
    text: "退出登录"
    optional: true

# ── ① 登录 ────────────────────────────────────────────────────────
- runFlow:
    file: _shared/login.yaml
    env:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME}

# ── ② 导航到用户画像列表页 ──────────────────────────────────────
- openLink: ${BASE_URL}/admin/session-analytics/users

# ── ③ 验证用户画像列表页加载 ──────────────────────────────────────
- assertVisible:
    text: "用户画像"

# ④ 等待数据加载
- waitForAnimationToEnd

# ⑤ 验证列表页基本元素（如果有数据）
- assertVisible:
    text: "详情"
    optional: true

# ── ⑥ 点击第一个用户进入详情页 ────────────────────────────────────
# 注意：如果列表为空，这步会失败，但这是预期的
- tapOn:
    text: "详情"
    optional: true

- waitForAnimationToEnd

# ── ⑦ 验证用户详情页基本元素 ──────────────────────────────────────
- assertVisible:
    text: "用户画像详情"
    optional: true

- assertVisible:
    text: "会话数"
    optional: true

- assertVisible:
    text: "总成本"
    optional: true

# ── ⑧ 验证模型使用明细区块存在 ────────────────────────────────────
- assertVisible:
    text: "模型使用明细"
    optional: true

# ── ⑨ 验证模型使用明细表格列标题 ──────────────────────────────────
- assertVisible:
    text: "模型名称"
    optional: true

- assertVisible:
    text: "供应商"
    optional: true

- assertVisible:
    text: "请求次数"
    optional: true

- assertVisible:
    text: "总 Token 数"
    optional: true

- assertVisible:
    text: "输入 Token"
    optional: true

- assertVisible:
    text: "输出 Token"
    optional: true

- assertVisible:
    text: "内部成本"
    optional: true

- assertVisible:
    text: "外部成本"
    optional: true

# ── ⑩ 验证帮助按钮存在 ────────────────────────────────────────────
- assertVisible:
    text: "查看统计说明"
    optional: true

# ── ⑪ 点击帮助按钮打开帮助面板 ────────────────────────────────────
- tapOn:
    text: "查看统计说明"
    optional: true

- waitForAnimationToEnd

# ── ⑫ 验证帮助面板内容 ────────────────────────────────────────────
- assertVisible:
    text: "统计说明"
    optional: true

- assertVisible:
    text: "Token 统计公式"
    optional: true

- assertVisible:
    text: "成本核算公式"
    optional: true

- assertVisible:
    text: "数据来源"
    optional: true

- assertVisible:
    text: "时间范围说明"
    optional: true

# ── ⑬ 关闭帮助面板（点击遮罩或关闭按钮） ────────────────────────
# 注意：Element UI 的 Drawer 可能通过点击遮罩关闭
- tapOn:
    point: "10%,50%"
    optional: true

- waitForAnimationToEnd

# ── ⑭ 验证时间范围选择器存在 ────────────────────────────────────
- assertVisible:
    text: "最近7天"
    optional: true

- assertVisible:
    text: "最近30天"
    optional: true

- assertVisible:
    text: "最近90天"
    optional: true

# ── ⑮ 返回列表页 ──────────────────────────────────────────────────
- tapOn:
    text: "返回"
    optional: true

- waitForAnimationToEnd

# ── ⑯ 验证返回到列表页 ────────────────────────────────────────────
- assertVisible:
    text: "用户画像"
    optional: true
