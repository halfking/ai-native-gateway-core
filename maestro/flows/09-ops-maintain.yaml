    # ★ /ops/vibecoding 是**本仓组件页**（VibeCoding 项目列表，router.ts:361），
    #   不是 externalMaintainRedirect 造的整页跳转路由 ⇒ 落地页就是它自己
    #   （实测 2026-10-28 R176：渲染「VibeCoding / + 创建项目 / 项目 / 表格 / 卡片 …」）。
    # ★★ 由此坐实：router.ts:490 的 `to.path.startsWith('/ops')` 改写规则是**死代码** ——
    #   ① 5 条 externalMaintainRedirect 路由被自己 beforeEnter 的 window.location.replace 抢先；
