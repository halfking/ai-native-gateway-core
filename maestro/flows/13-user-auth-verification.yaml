# 用户认证验证测试 —— 验证 admin、demoadmin、demo 三个用户的登录功能
#
# 目标：
#   1. 验证 admin 用户密码已修改为 Veritrans&9527
#   2. 验证 demoadmin 用户（super_admin）可以成功登录
#   3. 验证 demo 用户（tenant_admin）可以成功登录
#
# 使用方法：
#   maestro test maestro/flows/13-user-auth-verification.yaml \
#     -e BASE_URL=https://llm.itestu.cn \
#     --format junit \
#     --output results.xml
#
url: ${BASE_URL}
---
# ========================================================================
# 测试 1: admin 用户登录（super_admin 角色）
# ========================================================================
# ★ 2026-11-23 修复：App.vue 自 2026-07-20 起 ?login=xxx 仅在未登录时弹框
#   （e34a42ba1），带会话时不弹。设备可能残留上次运行/手工测试的会话，
#   先 clearState 保证弹框必现（与 simple 版同口径）。
- launchApp:
    clearState: true
- openLink: ${BASE_URL}/?login=1
- extendedWaitUntil:
    visible:
      id: "login-modal-title"
    timeout: 20000

# 输入 admin 用户凭据
- tapOn:
    id: login-username
- eraseText: 20
- inputText:
    id: login-username
    text: "admin"
- tapOn:
    id: login-password
- eraseText: 40
- inputText:
    id: login-password
    text: "Veritrans&9527"
- pressKey: Enter

# 验证登录成功 - 弹窗关闭
- extendedWaitUntil:
    notVisible:
      id: "login-modal-title"
    timeout: 30000

# 验证用户菜单显示"系统管理员"
- extendedWaitUntil:
    visible:
      text: "系统管理员"
    timeout: 20000

# 验证服务端会话有效（重载后仍能访问）
- openLink: ${BASE_URL}/dashboard
- extendedWaitUntil:
    visible:
      text: "系统管理员"
    timeout: 20000

# 退出登录（点击用户菜单）
- tapOn:
    text: "系统管理员"
- extendedWaitUntil:
    visible:
      text: "退出登录"
    timeout: 5000
- tapOn:
    text: "退出登录"
- extendedWaitUntil:
    visible:
      text: "登录"
    timeout: 10000

