# 后台数据 / 用量 / 审计域
# 用量三件套、运营与运维总览、订阅层级、轮次、会话、请求注册表、连接注册台、对账、审计。
# 路由清单来自 web/src/router.ts（见 maestro/README.md 的逐条核对表）。
# 计时：每个页面 openLink 前打点 output.t0，页面关键文案可见后算 output.ms__<slug>（毫秒）。
#       阈值 2000ms 用 optional 断言 —— 慢页只标记不失败，事后用 maestro/tools/slow-pages.mjs 筛。
url: ${BASE_URL}
---
- launchApp
- runFlow:
    file: _shared/login.yaml
    env:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

# ── /admin/usage ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/admin/usage"
- extendedWaitUntil:
    # ★ 真实渲染的是「成本对比」（locale compare.title）；
    #   「成本归因」只是 UsageCost.vue:434 的一行 HTML 注释 ⇒ 抄注释当断言会永远红。
    visible: '成本对比'
    timeout: 20000
- evalScript: "${output.ms__admin_usage = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__admin_usage < 2000}"
    optional: true
    label: 'slow-check:/admin/usage'

