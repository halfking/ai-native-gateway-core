# 18-stats-range-and-scope-hint.yaml —— 「时间范围统一 + 统计说明收成提示符」真机验证
#   （2026-11-24 统一轮交付）
#
# ★ 本 flow 要证明的**不是**「页面上有个日期选择器」，而是三条**交互契约**：
#   ① 看板 / 「会话与统计」/ 「会话分析·用户」三页用的是**同一个**时间范围组件
#      （判据：共享封装 StatsDateRangePicker 的壳 `stats-date-range-picker` 在三页都在）；
#   ② 该组件有**固定档位**（今天/昨天/近7/14/30天/本月/上月）
#      **且保留自定义起止**（判据：面板里 `.kx-dr-inputs` 渲染出来了 ⇒ presets-only 未开）；
#   ③ 「统计说明」是**点击才展开的提示符**、挂在**刷新按钮旁**
#      （判据：点击前正文不在 DOM 里、点击后才出现）。
#
# ★★ 为什么判据全是 data-testid（与仓内 L13 判据收敛同源）：
#   文案判据在两个方向上都会假红：① **文案漂移**（断言值与 locale 键实际值对不上
#   ⇒ 恒红而页面是好的）；② **locale 依赖**（应用 locale 取自 navigator.language
#   并持久化在 localStorage ⇒ 浏览器语言一变中文断言全红）。
#   ⇒ 本 flow **零 `text:` 选择器** ⇒ 换语种跑结果逐项相同。
#   ★ 配套钉测：web/src/components/analytics/statsRangeTestIds.contract.spec.ts
#     （flow 里每个 `id:` 都必须在前端源码里存在，反向漂移在 CI 就红）。
#
# ★★ 为什么锚点不在按钮本体上（★ 与 flow 16 头注②同款实测结论）：
#   Maestro 的 `id:` 匹配优先级是 **aria-label > title > data-testid**
#   ⇒ 触发按钮带 `:aria-label` ⇒ 打在按钮上的 data-testid **会被遮蔽** ⇒ 选不到。
#   ⇒ ⇒ 锚点一律落在**不带 title / aria-label 的内层元素**上
#   （`kx-dr-trigger` 落在按钮内的 label span；`stats-scope-hint-label` 落在按钮内的文字 span）
#   ⇒ **零属性删除、零 a11y 损失**，点它 = 点按钮（事件冒泡）。
#
# ★ 视口：默认 1440x3600（runner 的 MAESTRO_SCREEN_SIZE）——
#   真旋钮是 Maestro 的 `--screen-size`，不是 Chrome 的 `--window-size`。
#
# ★ 运行前提：**必须经 maestro/run-stats-range-picker.sh 运行**
#   （它负责起全新 Chrome（带 --lang=zh-CN）、顺延端口、注入凭据与视口）。
url: ${BASE_URL}
---
# ── 0. 起点：**会话分流**（CDP 预置会话 ⇄ 真实 UI 登录）────────────────────
# ★★ 2026-11-25 重写（captcha 死锁根治轮）。原 §0「起点归零（登出）」+ §1「无条件
#   UI 登录」两条**都必须**改掉，否则自动化会把自己锁死：
#
#   ① 后端的登录失败计数是**纯内存、无 TTL**，只靠「成功登录一次」清零
#      （admin/auth_captcha.go:509 clearLoginFailures）；
#      而 captcha 闸门挂在**任何 DB 查询与 bcrypt 之前**（admin/auth.go:229，
#      注释明写「刻意放在任何 DB 查询与 bcrypt 之前」）
#      ⇒ captcha_required 时**走不到密码校验** ⇒ 成功不可达 ⇒ 计数永不清
#      ⇒ 连续失败到阈值（CaptchaFailureThreshold=3）后，UI 登录**永远红**。
#   ② 原 §0 的「归零登出」在**预置会话**下会把刚注入的会话**打死**
#      ⇒ 预置路径（seed-session）根本走不到 §2。
#   ⇒ 现在：**没有「归零」这回事**（runner 每轮起全新浏览器 ⇒ 本来就没有旧登录态；
#      而预置会话是**要保住**的登录态），改成按判据自动分流。
#
# ★ 判据只有一个：**登录弹窗出没出现**（2026-11-25 两态各实测一遍）：
#   · 访客（无预置）：访问 /?login=1 ⇒ 弹窗**开着** ⇒ 需要 UI 登录
#   · 预置会话：访问 /?login=1 ⇒ 弹窗**不开**
#     （机制：seed-session.mjs 往 localStorage 写了 llmgw_user_info
#      ⇒ web/src/store.ts:123 模块加载即回填 userInfo
#      ⇒ App.vue:58 isLoggedIn 在 setup 时已为真
#      ⇒ App.vue:247 的 watch(route.query.login) 不再调 openLogin()）
#   ⇒ 这是**确定性**判据（不靠「等多久」）。
#
# ⓪ 先等「预置会话」落地（**第一步，不能省**）：
#   ★ runner 是在 **Maestro 启动之后、第一次导航之前**用 CDP 往**它那个**浏览器
#     里注入会话的（Maestro 的 web 驱动**自起** Chrome ⇒ `--driver-host-port`
#     对 web 无效 ⇒ 注入必须落到它自己的浏览器上）。
#   ⇒ 注入的那一页会显示已登录 ⇒ 顶栏出现用户菜单 ⇒ 这个 optional 等待
#     **在预置成功时提前结束**（不必干等满）；没预置时它等满 timeout 也**不判红**
#     （实测：optional ⇒ AssertionFailure 被降级成 warning）⇒ 后面自然走 UI 登录。
- extendedWaitUntil:
    visible:
      id: "app-user-menu-name"
    timeout: 20000
    optional: true
- openLink: ${BASE_URL}/?login=1
#
# ── ① UI 登录（共享 flow；三段判据见 _shared/login.yaml 头注）─────────────
# ★ `when` 语义（Maestro 2.11.0 源码实测，见 maestro-orchestra/Orchestra.kt
#   的 runFlowCommand/evaluateCondition）：条件为假 ⇒ 整段 runFlow 记为 **SKIPPED**
#   （不是 FAILED）⇒ 预置会话下这一步被跳过，flow 仍然全绿。
# ★ 预置路径**完全不走** /api/auth/token ⇒ 也就不受 captcha 闸门约束 ⇒ 根治成立。
- runFlow:
    file: _shared/login.yaml
    when:
      visible:
        id: "login-modal-title"
    env:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME}
#
# ═══ ② 看板页（/dashboard?tab=board）：基准页 ═══════════════════════════
# ★ 基准页先跑：它证明「统一后的形态」本身是对的，后两页再与之对照。
- openLink: ${BASE_URL}/dashboard?tab=board
- extendedWaitUntil:
    visible:
      id: "stats-date-range-picker"
    timeout: 30000
# ① 三页共用的**同一个**组件（共享封装的壳）
- assertVisible:
    id: "stats-date-range-picker"
# ② 打开面板（点触发器内层 span ⇒ 事件冒泡到按钮）
- extendedWaitUntil:
    visible:
      id: "kx-dr-trigger"
    timeout: 30000
- tapOn:
    id: "kx-dr-trigger"
- extendedWaitUntil:
    visible:
      id: "kx-dr-panel"
    timeout: 10000
- assertVisible:
    id: "kx-dr-panel"
# ③ **固定档位**：七个档位逐个在（档位集合 = makeDateRangePresets('date')）
- assertVisible:
    id: "kx-dr-preset-today"
- assertVisible:
    id: "kx-dr-preset-yesterday"
- assertVisible:
    id: "kx-dr-preset-last7d"
- assertVisible:
    id: "kx-dr-preset-last14d"
- assertVisible:
    id: "kx-dr-preset-last30d"
- assertVisible:
    id: "kx-dr-preset-thisMonth"
- assertVisible:
    id: "kx-dr-preset-lastMonth"
# ④ **自定义起止保留**：日期输入区渲染出来了（presets-only 未开 ⇒ 这是唯一可观察证据）
- assertVisible:
    id: "kx-dr-inputs"
- assertVisible:
    id: "kx-dr-input-start"
- assertVisible:
    id: "kx-dr-input-end"
- assertVisible:
    id: "kx-dr-apply"
# 关掉面板（同一个触发器再点一次 ⇒ toggle 关闭）
- tapOn:
    id: "kx-dr-trigger"
#
# ═══ ③ 会话与统计页签（/dashboard?tab=stats）════════════════════════════
# ★ 这一页有两件事：① 同一套时间范围；② 「统计说明」收成了提示符。
- openLink: ${BASE_URL}/dashboard?tab=stats
- extendedWaitUntil:
    visible:
      id: "stats-date-range-picker"
    timeout: 30000
- assertVisible:
    id: "stats-date-range-picker"
- extendedWaitUntil:
    visible:
      id: "kx-dr-trigger"
    timeout: 30000
- tapOn:
    id: "kx-dr-trigger"
- extendedWaitUntil:
    visible:
      id: "kx-dr-panel"
    timeout: 10000
- assertVisible:
    id: "kx-dr-preset-today"
- assertVisible:
    id: "kx-dr-preset-last7d"
- assertVisible:
    id: "kx-dr-preset-last30d"
- assertVisible:
    id: "kx-dr-preset-thisMonth"
- assertVisible:
    id: "kx-dr-preset-lastMonth"
- assertVisible:
    id: "kx-dr-inputs"
- assertVisible:
    id: "kx-dr-input-start"
- assertVisible:
    id: "kx-dr-input-end"
- tapOn:
    id: "kx-dr-trigger"
#
# ── ③.1 「统计说明」提示符：点击才展开 ───────────────────────────────────
# ★ 判据顺序有讲究：**先断「点之前没有正文」**⇒ 再点 ⇒ 再断「点之后有正文」
#   ⇒ 只断「点之后有」会把**常驻横幅**误判成提示符（常驻横幅一直都在）。
- assertVisible:
    id: "stats-scope-hint-label"
- assertNotVisible:
    id: "stats-scope-hint-body"
- tapOn:
    id: "stats-scope-hint-label"
- extendedWaitUntil:
    visible:
      id: "stats-scope-hint-body"
    timeout: 10000
- assertVisible:
    id: "stats-scope-hint-body"
- tapOn:
    id: "stats-scope-hint-label"
#
# ═══ ④ 会话统计整合页（/admin/session-analytics/users/overview）════════════
# ★ 这一页本轮也做了同样的两件事：统一时间范围 + 提示符上移页头。
#
# ★★ 2026-11-25：**URL 已更新**。别的会话（28957fe55「用户画像列表页挂回原 URL」）
#   把 `/admin/session-analytics/users` 改指向 **UserProfileListView**，
#   而本 flow 要断的会话统计整合页（SessionAnalyticsUsersView：会话统计面板 +
#   统计说明提示符 + 共享日期组件）搬到了 **`/users/overview`**。
#   ⇒ ★ **量具过期与产品缺陷长得一模一样**（断言红 ⇒ 像是页面坏了）⇒ 必须分辨：
#     「量具打的是哪一页」是量具自己的责任（URL 过期 ⇒ 改量具），不是改产品。
#   ⇒ ★ 顺带登记**第五处日期控件（已知例外，不在本轮统一口径）**：
#     `/admin/session-analytics/users`（用户画像列表页 UserProfileListView）用的是
#     **datetime 精度**预设（今天/昨天/近24小时/近7/14/30天/本月/上月，8 档）
#     ⇒ 它的时间窗是**时刻窗**（近 24 小时有真实语义），与另外四处
#     **日历日窗**（date 精度，7 档）**语义不同** ⇒ 强行并入会删掉「近 24 小时」
#     ⇒ ⇒ 列为已知例外（owner 决策项），本轮不动。
- openLink: ${BASE_URL}/admin/session-analytics/users/overview
- extendedWaitUntil:
    visible:
      id: "sa-page-users"
    timeout: 30000
- assertVisible:
    id: "sa-page-users"
# ① 同一套时间范围（共享封装）
- assertVisible:
    id: "stats-date-range-picker"
- extendedWaitUntil:
    visible:
      id: "kx-dr-trigger"
    timeout: 30000
- tapOn:
    id: "kx-dr-trigger"
- extendedWaitUntil:
    visible:
      id: "kx-dr-panel"
    timeout: 10000
- assertVisible:
    id: "kx-dr-preset-today"
- assertVisible:
    id: "kx-dr-preset-last7d"
- assertVisible:
    id: "kx-dr-preset-last30d"
- assertVisible:
    id: "kx-dr-preset-thisMonth"
- assertVisible:
    id: "kx-dr-preset-lastMonth"
- assertVisible:
    id: "kx-dr-inputs"
- assertVisible:
    id: "kx-dr-input-start"
- assertVisible:
    id: "kx-dr-input-end"
- tapOn:
    id: "kx-dr-trigger"
# ② 提示符在页头（刷新按钮旁）且点击才展开
- assertVisible:
    id: "sa-refresh-btn"
- assertVisible:
    id: "stats-scope-hint-label"
- assertNotVisible:
    id: "stats-scope-hint-body"
- tapOn:
    id: "stats-scope-hint-label"
- extendedWaitUntil:
    visible:
      id: "stats-scope-hint-body"
    timeout: 10000
- assertVisible:
    id: "stats-scope-hint-body"
- tapOn:
    id: "stats-scope-hint-label"
#
# ═══ ⑤ 运营面板（/admin/board-operational）═══════════════════════════
# ★ 2026-11-25：运营面板此前是**第四套**日期控件（今天/近7/近30/近90、跨度上限
#   365 天）⇒ 与其余三页形态不同 ⇒ 本轮并入**共享组件** ⇒ 档位集合与其他三页
#   **逐字同序相等**（本段把 7 个档位逐个断一遍 ⇒ 少一个就红）。
- openLink: ${BASE_URL}/admin/board-operational
- extendedWaitUntil:
    visible:
      id: "stats-date-range-picker"
    timeout: 30000
- assertVisible:
    id: "stats-date-range-picker"
# ★ 该页在加载期把控件置为 disabled ⇒ 锚点此刻是 kx-dr-trigger-disabled ⇒
#   extendedWaitUntil 会**一直等到可交互**为止（2026-11-24 量具修正的用意）。
- extendedWaitUntil:
    visible:
      id: "kx-dr-trigger"
    timeout: 30000
- tapOn:
    id: "kx-dr-trigger"
- extendedWaitUntil:
    visible:
      id: "kx-dr-panel"
    timeout: 10000
- assertVisible:
    id: "kx-dr-preset-today"
- assertVisible:
    id: "kx-dr-preset-yesterday"
- assertVisible:
    id: "kx-dr-preset-last7d"
- assertVisible:
    id: "kx-dr-preset-last14d"
- assertVisible:
    id: "kx-dr-preset-last30d"
- assertVisible:
    id: "kx-dr-preset-thisMonth"
- assertVisible:
    id: "kx-dr-preset-lastMonth"
- assertVisible:
    id: "kx-dr-inputs"
- assertVisible:
    id: "kx-dr-input-start"
- assertVisible:
    id: "kx-dr-input-end"
- tapOn:
    id: "kx-dr-trigger"
