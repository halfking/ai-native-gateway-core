- openLink: "${BASE_URL}/routing-v2/work-types"
- extendedWaitUntil:
    # ★ 概览页签渲染的是 h2 = t('workTypes.topBar.title') = 「工作类型」；
    #   「工作类型列表」是 workTypes.list.title（**列表页签**的标题）⇒ 概览页签下没有它。
    #   （/settings 与 /:key 会切到列出列表的页签 ⇒ 那两页仍用「工作类型列表」）
    visible: '工作类型'
    timeout: 20000
- evalScript: "${output.ms__routing_v2_work_types = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__routing_v2_work_types < 2000}"
    optional: true
    label: 'slow-check:/routing-v2/work-types'

