# ── /probe-health/detail ─────────────────────────────────────────────
# ★ 这个页面的所有数据（节点/路由/决策/监控/探活/价格）都按**单个模型**组织
#   （ProbeHealthDetailView.vue:17 `route.query.model`）⇒ 不带 ?model= 时
#   只渲染「未指定模型」空态（实测 2026-10-28 R176：正文只有
#   「未指定模型 … 需要在地址后加上 ?model=模型名」）。
#   「输入价」在「价格管理」tab 里，默认不渲染 ⇒ 不能当首屏断言。
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/probe-health/detail?model=${MODEL_NAME}"
- extendedWaitUntil:
    visible: '${MODEL_NAME}'
    timeout: 20000
- evalScript: "${output.ms__probe_health_detail = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__probe_health_detail < 2000}"
    optional: true
    label: 'slow-check:/probe-health/detail'

