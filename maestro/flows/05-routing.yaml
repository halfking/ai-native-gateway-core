    visible: '.*标注工作台.*'
    timeout: 20000
- evalScript: "${output.ms__routing_v2_annotations = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
