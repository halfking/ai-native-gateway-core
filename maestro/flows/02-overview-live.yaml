# 总览 / 实时拓扑 / 接入引导
# 首页、仪表盘、实时拓扑、请求详情全页、示例、对话。
# 路由清单来自 web/src/router.ts（见 maestro/README.md 的逐条核对表）。
# 计时：每个页面 openLink 前打点 output.t0，页面关键文案可见后算 output.ms__<slug>（毫秒）。
#       阈值 2000ms 用 optional 断言 —— 慢页只标记不失败，事后用 maestro/tools/slow-pages.mjs 筛。
appId: ${BASE_URL}
---
- launchApp
- runFlow:
    file: _shared/login.yaml
    env:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

# ── / ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/"
- extendedWaitUntil:
    visible: '仪表盘'
    timeout: 20000
- evalScript: "${output.ms__root = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__root < 2000}"
    optional: true
    label: 'slow-check:/'

