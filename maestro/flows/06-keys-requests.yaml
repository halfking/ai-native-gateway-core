- evalScript: "${output.ms__admin_session_analytics_tasks_id = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__admin_session_analytics_tasks_id < 2000}"
