# ── /admin/session-analytics/filter-options ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/admin/session-analytics/filter-options"
- extendedWaitUntil:
    visible: '会话分析筛选'
    timeout: 20000
- evalScript: "${output.ms__admin_session_analytics_filter_options = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
