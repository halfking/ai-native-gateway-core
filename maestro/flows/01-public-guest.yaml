# 公开页 / 访客面（无需登录）
# router.ts 里 meta.public === true 的页面 + 4 条 /customer/* 重定向 + /maintain 兜底页。
# 路由清单来自 web/src/router.ts（见 maestro/README.md 的逐条核对表）。
# 计时：每个页面 openLink 前打点 output.t0，页面关键文案可见后算 output.ms__<slug>（毫秒）。
#       阈值 2000ms 用 optional 断言 —— 慢页只标记不失败，事后用 maestro/tools/slow-pages.mjs 筛。
appId: ${BASE_URL}
---
- launchApp
- launchApp:
    clearState: true

# ── /forbidden ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/forbidden"
- extendedWaitUntil:
    visible: '403 - 访问被拒绝'
    timeout: 20000
- evalScript: "${output.ms__forbidden = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__forbidden < 2000}"
    optional: true
    label: 'slow-check:/forbidden'

# ── / ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/"
- extendedWaitUntil:
    visible: '把公司里所有大模型调用，收进一个能管、能查、能关的入口'
