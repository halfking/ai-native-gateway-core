# 共享登录流 —— 所有需要登录的 flow 都用 runFlow 调它。
#
# ★ 2026-11-18 重写为「键入 + 页内 fetch 提交」混合式（245 生产实证）：
#
#	原「键入 + Enter」路径的两处结构性故障（245 实测，各带字节级证据）：
#	  ① 口令含 '&' 等特殊字符时，Maestro 键入/插值管道会**吞片段**
#	    （request_bytes 63/67 漂移 vs 正确 68 ⇒ 401「password does not
#	    match the users table record」）；
#	  ② 即使 DOM value 完整（实测可断言出 14 字符），Vue v-model 的
#	    input 事件消化与 Enter/requestSubmit 之间存在竞态 ⇒ 提交的是
#	    v-model 里的部分值。
#	⇒ 本版：inputText 键入（${VAR} 在 text: 里实测可靠、DOM value 完整），
#	  提交改由 evalScript **从字段读值**直接 fetch /api/auth/token
#	  （credentials:'same-origin' ⇒ HttpOnly cookie 落袋；README §6.3 的
#	  正解）——不依赖 v-model、不依赖 Enter、evalScript 里不用 ${}
#	  （本版 Maestro 的 evalScript 不做变量插值，实测）。
#	★ 失败时抛 LOGIN_HTTP_<status> ⇒ flow 当场红。
#
# ★ 账号口令不写进仓内任何文件：ADMIN_USER / ADMIN_PASSWORD 由
#   命令行 -e 注入（flow 经 runFlow env 转发）。
url: ${BASE_URL}
---
- openLink: ${BASE_URL}/?login=1
- extendedWaitUntil:
    visible:
      id: "login-modal-title"
    timeout: 20000
- tapOn:
    id: "login-username"
- eraseText: 20
- inputText:
    id: "login-username"
    text: "${ADMIN_USER}"
- tapOn:
    id: "login-password"
- eraseText: 40
- inputText:
    id: "login-password"
    text: "${ADMIN_PASSWORD}"
- evalScript: 'const u=document.getElementById("login-username"), p=document.getElementById("login-password"); const r=await fetch("/api/auth/token",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})}); if(!r.ok){throw new Error("LOGIN_HTTP_"+r.status);} true'
