# 11-simple-overview.yaml —— 简易模式「总览页」的全面验证
#
# 覆盖对象：web/src/views/SimpleOverviewView.vue（简易模式总览页）
#
# ★★★ Maesto web 驱动（2.11.0）的能力边界（2026-11-17 逐条实测，本 flow 的写法全部受它约束）：
#
#   ① **evalScript 在 web 驱动下是 no-op**。
#      证据：`javap -p maestro.drivers.CdpWebDriver` 的方法表里**根本没有**
#      `evaluateScript`（只有私有 `executeJS`，供驱动内部用）⇒ 命令被吞掉并报
#      COMPLETED，但**什么都没发生**。
#      实测：evalScript 改 document.title / 写 localStorage / 插探针 div，
#      三步都 COMPLETED，页面与 DOM 一字未变（截图无探针、screen-hierarchy 无探针）。
#      ⇒ 本仓此前那些 `${output.x = ...}` 断言在 web 驱动下**永远拿不到 DOM 数据**
#        （`${...}` 只在 JVM 侧求值，那里没有 document）。
#
#   ② `${output.x = ...}` 只在 **Maestro 自己的 JS 引擎（JVM 侧）**求值
#      ⇒ 能做纯算术（1+1 ✔），碰不到 DOM（document 未定义 ⇒ TypeError）。
#
#   ③ 断言选择器只有三种可用，**一条断言只用一种**：
#      · `text:` ⇒ 秒级，但**只匹配可见文本**、且是**元素完整文本相等**
#        （**不是子串包含**！实测「下一步该做什么」这种半句匹配不到，
#        而「工作模式 · 简易模式」「今日请求」这种整句能命中）；
#        `aria-label` / `title` **不参与**（实测 tapOn "切到专家模式" ⇒ Element not found）。
#      · `id:` ⇒ 秒级，但**只匹配 HTML 的 `id` 属性**，**不匹配 `data-testid`**
#        （实测 tapOn id: work-mode-switch（纯 data-testid）⇒ Element not found）。
#      · `css:` ⇒ 能用但**极慢**（单条实测 2 分 23 秒），且 `assertNotVisible: {css}`
#        **直接挂住**（无超时上限）⇒ 本 flow 一条 css 都不用。
#      ⇒ 所以页面锚点一律用**该页独有的可见文案（整句）**；
#        需要 testid 级精确定位时，走 `maestro/tools/assert-overview.mjs`（页面内 CDP）。
#
#   ④ `launchApp: { clearState: true }` 会清 cookie（登录弹窗重新出现），
#      但 **`openLink` 会清 localStorage**（工作模式退回专家面）⇒ 切模式必须
#      做成**幂等子流程**（见 `_shared/switch-simple-mode.yaml`）。
#
#   ⑤ `--driver-host-port <port>` 对 web 驱动**无效**（web 驱动自己起 Chrome）
#      ⇒ 本 flow **不传**该参数。
#
#   ⑥ **view hierarchy 只覆盖视口**，而且本页**滚不动**（2026-11-17 r8/r9 实测）：
#      · web 驱动的视口固定 **1024×625**（hierarchy 根节点 bounds = [0,0][1024,625]），
#        折叠线以下的内容**不进树** ⇒ `assertVisible` 对视口外元素**一律判 false**
#        （哪怕它已渲染在 DOM 里）。
#      · 本应用壳的滚动容器是 **`.main-body`（overflow-y:auto）**，不是 window：
#        CDP 实测 `window.scrollY` 恒 0、`document.documentElement.scrollHeight`
#        == 视口高 ⇒ Maestro 的 `scrollVertical()`（滚 window）与 `scrollUntilVisible`
#        **对本页全是空转**（r9 实跑：scrollUntilVisible 直接 FAILED，
#        且失败截图与 r8 逐像素同款 ⇒ 页面一像素都没动过）。
#      ⇒ 本 flow **必须用 `--screen-size 1440x2200` 跑**（桌面视口，见
#        maestro/run-simple-overview.sh）：两栏并排（`@media (max-width: 1024px)`
#        才塌成一栏）⇒ 三个面板标题（接入清单 407 / 上游健康 407 /
#        最常用的模型 981）全部落在初始视口内。
#      ⇒ 与视口无关的「面板确实存在」由 maestro/tools/assert-overview.mjs
#        在**页面内**断言（DOM 查询不看视口）。
#
# ★ 分工：
#   · **行为与结构**（本 flow）：区块可见、交互、跳转、模式切换、专家面不回归。
#   · **数值口径对拍**（页面内的逐字比较、精确计数、per-key 扇出）：
#     由 maestro/tools/assert-overview.mjs 走 CDP 在**页面内**做
#     （同一页面、同一时刻、同一份 board API 响应 ⇒ 口径天然一致）。
#
# ★ 登录：走仓内既有资产 _shared/login.yaml（真实 UI 登录，账号口令由
#   -e ADMIN_USER / -e ADMIN_PASSWORD 传入；口令不进仓内文件）。
url: ${BASE_URL}
---
# ── 0. 起点归零：若上一轮留下登录态，先退出（否则登录弹窗不出现）────────
# ★ 两步都 optional：未登录时找不到元素，直接跳过。
- openLink: ${BASE_URL}/dashboard
- tapOn:
    text: "系统管理员"
    optional: true
- tapOn:
    text: "退出登录"
    optional: true

# ── ① 真实 UI 登录 ────────────────────────────────────────────────────────
- runFlow:
    file: _shared/login.yaml
    env:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME}

# ── ② 切到简易模式（幂等子流程：先归零到专家面，再切到简易面）──────────
- runFlow:
    file: _shared/switch-simple-mode.yaml

# ── ③ 总览页五个区块都在（各自用该区块独有的可见文案）────────────────────
# ★ 视口边界（2026-11-17 r8/r9 实测撞出，详见文件头 ⑥）：
#   web 驱动的 view hierarchy **只覆盖视口**，而本页滚动容器是 `.main-body`
#   （非 window）⇒ Maestro 滚不动 ⇒ **断言视口外的元素没有第二条路**。
#   ⇒ 本 flow 用 `--screen-size 1440x2200`（桌面视口）跑：两栏并排、
#     三个面板标题均在初始视口内；「面板确实存在」再由页面内 CDP 断言兜底。
- assertVisible:
    text: "今日请求"          # 统计卡
- assertVisible:
    text: "接一个上游"        # 常用操作
- assertVisible:
    text: "接入清单"          # 我的客户端
- assertVisible:
    text: "上游健康"          # 上游健康面板
- assertVisible:
    text: "最常用的模型"      # 热门模型面板

# ── ④ 接入清单：两个分页列表在（不再整表铺开）─────────────────
# ★ 2026-11-17：接入清单原来把在用密钥整表铺开（线上 118 行）⇒ 改成
#   「最近在用」+ 「用得最多」两个分页列表（每页 10 条）。
#   新增断言：两个列表的标题在 · 分页栏的「上一页」「下一页」在。
#   ★ 分页栏的「共 N 条」「第 x / y 页」带数字 ⇒ 无法用文案断言
#   （text 是整句相等）⇒ 翻页行为交给页面内 CDP 断言。
- assertVisible:
    text: "最近在用"
- assertVisible:
    text: "用得最多"
- assertVisible:
    text: "上一页"
- assertVisible:
    text: "下一页"

# ── ⑤ 统计卡：六张卡的标签都在（口径与专家面一致的那六个）────────────────
# ★ 2026-11-18：标签语义订正 —— active_api_keys 的后端语义是「启用的密钥数」
#   （COUNT(*) WHERE enabled=TRUE），不是「活跃」；active_models 的语义是
#   「时间窗内有流量的去重模型数」，不是「可用」⇒ 文案跟着口径改。
- assertVisible:
    text: "成功率"
- assertVisible:
    text: "Token 用量"
- assertVisible:
    text: "今日花费"
- assertVisible:
    text: "启用密钥"
- assertVisible:
    text: "在用模型"

# ── ⑤b 运维状态 chips（2026-11-18 新增：复用专家面 BoardOpsBar）─────────────
# 后台任务 chip + 系统自检 chip —— 简易模式也要能一眼看到「系统自身在不在干活」
- assertVisible:
    text: "后台任务"
- assertVisible:
    text: "系统自检"

# ── ⑤c 近 7 日消耗卡（2026-11-18 新增）───────────────────────────────────
# owner 报障「关心的是整体状况、消耗情况」⇒ 与专家面看板 days=7 同端点同口径，
# 15min 桶在前端按 UTC 日聚合成柱条；数值对拍由 assert-overview.mjs 做。
- assertVisible:
    text: "近 7 日消耗"
# 指标切换（与专家面看板同一组文案键）
- assertVisible:
    text: "请求数"
- assertVisible:
    text: "Token"
- assertVisible:
    text: "成本 (USD)"

# ── ⑤d issue 行内动作（2026-11-18 新增）─────────────────────────────────
# 线上此刻有上游告警/自检问题 ⇒ 状态条带 issue 行；有自助动作的 issue 带「去处理」。
# ★ optional：健康系统没有 issue 行，此时按钮不存在不算红。
- assertVisible:
    text: "去处理"
    optional: true

# ★ 「读不到 ≠ 0」是本轮硬契约：统计源读不到时必须显示占位符「暂不可用」，
#   而**不是**显示 0。线上此刻数据源可读 ⇒ 页面上不应出现占位符；
#   若出现，说明数据源真的读不到（那是降级路径，本断言会如实报出来）。
- assertNotVisible:
    text: "暂不可用"

# ── ⑤ 状态条：结论与明细由 assert-overview.mjs 断言 ─────────────────────
# ★ text 匹配是**元素完整文本相等**（不是子串包含）⇒ 状态条那两句都带数字
#   （「今日 116 笔请求 · 成功率 95.7% · 19 个上游可用」），文本断言匹配不到。
#   ⇒ 状态条的结论文案、data-tone 取值、明细是否非空，全部由
#     maestro/tools/assert-overview.mjs 在**页面内**断言（同页同刻）。

# ── ⑥ 常用操作：四个按钮都在（文案固定）────────────────────────────────
- assertVisible:
    text: "签发网关密钥"
- assertVisible:
    text: "查看请求"
- assertVisible:
    text: "打开对话"

# ── ⑦ 上游健康面板：分级文案在 ─────────────────────────────────────────
# ★ 「未探活」必须**单列一档**，不能与「可用」混在一起（四档：可用 / 有告警 /
#   不可达 / 未探活）。线上此刻未探活为 0 行 ⇒ 该文案可选；
#   精确分级由 assert-overview.mjs 断言。
- assertVisible:
    text: "可用"
    optional: true
- assertVisible:
    text: "未探活"
    optional: true

# ── ⑧ 常用操作逐个点：必须真的跳到对应页面 ────────────────────────────────
# ★ 落点路径必须真实存在 —— 2026-11-17 实测撞出过死链：
#   「查看用量」原先跳 /usage，而该路径**从来没有路由定义**（router.ts 里没有）
#   ⇒ 点了就是 vue-router 的 no-match 空白页。已改为 /request-logs。
# ★ 每个落点用**该页独有**的可见文本做判据（不能用导航项同名文案 ——
#   导航里也有「请求日志」「对话」，用它当判据会误判成「还在原页」）。
- tapOn:
    text: "接一个上游"
- extendedWaitUntil:
    visible:
      text: "上游账号、余额与健康状态"
    timeout: 20000

- runFlow:
    file: _shared/switch-simple-mode.yaml
# ★ 页面上有**两个**「签发网关密钥」按钮（页头主按钮 + 常用操作里的次级按钮），
#   文案完全相同 ⇒ 只按文案点会点到**页头那个**（r10 实跑的坐标是
#   bounds=[1303,101][1416,137]，而常用操作行在 y≈355）⇒ 本段的意图是「常用操作逐个点」，
#   必须点常用操作里那个 ⇒ 用 index 指第二个（0 基数）。
# ★ 判据用**副标题**（`simpleMode.keys.subtitle`），不用「客户端名称」：
#   标签元素的完整文本是「客户端名称 *」（带必填星号）⇒ 整句相等匹配不到
#   （r10 实跑 FAILED，截图证明其实已经落在签发页上 ⇒ 是判据写错，不是跳转错）。
- tapOn:
    text: "签发网关密钥"
    index: 1
- extendedWaitUntil:
    visible:
      text: "两个字段签发一个密钥，租户与应用自动填充为默认值"
    timeout: 20000

- runFlow:
    file: _shared/switch-simple-mode.yaml
- tapOn:
    text: "查看请求"
- extendedWaitUntil:
    visible:
      text: "自动刷新"
    timeout: 20000

- runFlow:
    file: _shared/switch-simple-mode.yaml
- tapOn:
    text: "打开对话"
- extendedWaitUntil:
    visible:
      text: "+ 新建"
    timeout: 20000

# ── ⑨ 回到总览页 + 刷新按钮可用 ───────────────────────────────────────────
- runFlow:
    file: _shared/switch-simple-mode.yaml
- tapOn:
    text: "刷新"
- extendedWaitUntil:
    visible:
      text: "今日请求"
    timeout: 20000
- assertVisible:
    text: "工作模式 · 简易模式"

# ── ⑩ 专家模式不受影响（总览页是简易模式专属） ──────────────────────────
# ★ 切回专家：点同一个切换按钮（此时按钮文案是「简易模式」），判据用专家面
#   首页的独有标题。
- tapOn:
    text: "简易模式"
- extendedWaitUntil:
    visible:
      text: "实时请求流"
    timeout: 20000
- openLink: ${BASE_URL}/dashboard
- extendedWaitUntil:
    visible:
      text: "实时请求流"
    timeout: 20000
# 专家面不应渲染简易模式总览页的独有内容
- assertNotVisible:
    text: "工作模式 · 简易模式"
- assertNotVisible:
    text: "今日请求"
