# 11-simple-overview.yaml —— 简易模式「总览页」的全面验证
#
# 覆盖对象：web/src/views/SimpleOverviewView.vue（简易模式总览页）
#
# ★★★ Maesto web 驱动（2.11.0）的能力边界（2026-11-17 逐条实测，本 flow 的写法全部受它约束）：
#
#   ① **evalScript 在 web 驱动下是 no-op**。
#      证据：`javap -p maestro.drivers.CdpWebDriver` 的方法表里**根本没有**
#      `evaluateScript`（只有私有 `executeJS`，供驱动内部用）⇒ 命令被吞掉并报
#      COMPLETED，但**什么都没发生**。
#      实测：evalScript 改 document.title / 写 localStorage / 插探针 div，
#      三步都 COMPLETED，页面与 DOM 一字未变（截图无探针、screen-hierarchy 无探针）。
#      ⇒ 本仓此前那些 `${output.x = ...}` 断言在 web 驱动下**永远拿不到 DOM 数据**
#        （`${...}` 只在 JVM 侧求值，那里没有 document）。
#
#   ② `${output.x = ...}` 只在 **Maestro 自己的 JS 引擎（JVM 侧）**求值
#      ⇒ 能做纯算术（1+1 ✔），碰不到 DOM（document 未定义 ⇒ TypeError）。
#
#   ③ 断言选择器：**css / text / id 三选一**，且 **css 与 text 不能组合**
#      （组合实测 FAILED）。其中：
#      · `id:` ⇒ 命中 HTML 的 `id` 属性，**也命中 `data-testid`**（web 驱动把
#        data-testid 映射成 resource-id）⇒ 秒级返回，本 flow 的锚点全用它。
#      · `text:` ⇒ 只匹配**可见文本**；**aria-label / title 不参与匹配**
#        （实测 tapOn "切到专家模式" ⇒ Element not found）。
#      · `css:` ⇒ **极慢**：一条 `assertVisible: {css: ...}` 实测耗时 **2 分 23 秒**，
#        而 `assertNotVisible: {css: ...}` 直接挂住 ⇒ 本 flow 一条 css 都不用。
#
#   ④ `--driver-host-port 9222` 是**移动端**的设备宿主端口，对 web 驱动无效：
#      web 驱动自己起 Chrome（独立 profile 与调试端口）。
#      ⇒ 本 flow **不传**该参数（传了也无效，还会让人误以为在复用某个浏览器）。
#
# ★ 因此本 flow 的分工：
#   · **行为与结构**（本 flow）：区块可见、交互、跳转、模式切换、专家面不回归
#     —— 全部用 id / text 断言，黑盒且可复现。
#   · **数值口径对拍**（页面内的逐字比较、per-key 扇出计数、精确计数）：
#     由 maestro/tools/assert-overview.mjs 走 CDP 在**页面内**做
#     （同一页面、同一时刻、同一份 board API 响应 ⇒ 口径天然一致）。
#
# ★ 登录与工作模式：
#   · 登录走仓内既有资产 _shared/login.yaml（真实 UI 登录，账号口令由
#     -e ADMIN_USER / -e ADMIN_PASSWORD 传入；口令不进仓内文件）。
#   · 工作模式是**本机选择**（localStorage `llmgw_work_mode`）：
#     `launchApp` 带 `clearState: true` 把 cookie 与 localStorage 一起清干净
#     ⇒ 登录后必定落在专家面（兜底 expert）。
#   · 切到简易模式：**点顶栏的真实切换按钮**（data-testid="work-mode-switch"），
#     判据用**总览页独有的副标题**（「下一步该做什么」），不用按钮自己的文案
#     （按钮文案随模式变化，aria-label 又不参与文本匹配 ⇒ 都不足以当判据）。
#   ★ 无口令时的替代路径：maestro/tools/seed-session.mjs 用 CDP 预置
#     HttpOnly 会话 cookie + localStorage（见 maestro/README.md §6.5）。
url: ${BASE_URL}
---
# ── 0. 启动：清空浏览器状态（cookie + localStorage）────────────────────────
# ★ clearState 是保证「登录后落在专家面」的前提：工作模式是本机选择，
#   上一次跑的残留（simple）会让 _shared/login.yaml 的收尾断言（「仪表盘」，
#   专家面首页标题）落到「总览」上而误红。
- launchApp:
    clearState: true

# ── ① 真实 UI 登录 ────────────────────────────────────────────────────────
- runFlow:
    file: _shared/login.yaml
    env:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

# ── ② 工作模式：先确认在专家面，再点顶栏的切换按钮切到简易模式 ───────────
# 专家面首页的独有标题（顶栏「专家模式」按钮的文案在简易面也会出现 ⇒ 不可用）
- assertVisible:
    text: "实时请求流"
- tapOn:
    id: "work-mode-switch"
# 切到简易模式 ⇒ 首页投影成总览页 ⇒ 总览页副标题出现（唯一文案）
- extendedWaitUntil:
    visible:
      text: "下一步该做什么"
    timeout: 30000

# ── ③ 简易模式下 /dashboard 落在「总览页」而不是旧的接入清单页 ────────────
- openLink: ${BASE_URL}/dashboard
- extendedWaitUntil:
    visible:
      id: "overview-status"
    timeout: 30000

# ── ④ 五个区块都在 ────────────────────────────────────────────────────────
- assertVisible:
    id: "overview-stats"
- assertVisible:
    id: "overview-quick-actions"
- assertVisible:
    id: "overview-access-list"
- assertVisible:
    id: "overview-provider-health"
- assertVisible:
    id: "overview-top-models"

# 旧接入清单页已被总览页取代：那个页面标记不该再出现
- assertNotVisible:
    id: "simple-access-list"

# ── ⑤ 统计卡：六张卡的标签都在（口径与专家面一致的那六个）────────────────
- assertVisible:
    text: "今日请求"
- assertVisible:
    text: "成功率"
- assertVisible:
    text: "Token 用量"
- assertVisible:
    text: "今日花费"
- assertVisible:
    text: "活跃密钥"
- assertVisible:
    text: "可用模型"

# ★ 「读不到 ≠ 0」是本轮硬契约：统计源读不到时必须显示占位符「暂不可用」，
#   而**不是**显示 0。线上此刻数据源可读 ⇒ 页面上不应出现占位符；
#   若出现，说明数据源真的读不到（那是降级路径，本断言会如实报出来）。
- assertNotVisible:
    text: "暂不可用"

# ── ⑥ 状态条：必须有明细（不是空壳）────────────────────────────────────
# 明细的固定尾部（「{n} 个上游可用」）证明状态条真的渲染出了内容。
# 结论本身随实况在三种文案间变化 ⇒ data-tone 的取值由 assert-overview.mjs 断言
# （text 断言拿不到属性）。
- assertVisible:
    text: "个上游可用"

# ── ⑦ 常用操作：四个按钮都在（文案固定）────────────────────────────────
- assertVisible:
    text: "接一个上游"
- assertVisible:
    text: "签发网关密钥"
- assertVisible:
    text: "查看请求"
- assertVisible:
    text: "打开对话"

# ── ⑧ 上游健康面板：面板在 + 分级文案在 ────────────────────────────────
# ★ 「未探活」必须**单列一档**，不能与「可用」混在一起（四档：可用 / 有告警 /
#   不可达 / 未探活）。线上此刻未探活为 0 行 ⇒ 该文案可选；
#   精确分级由 assert-overview.mjs 断言。
- assertVisible:
    text: "可用"
    optional: true
- assertVisible:
    text: "未探活"
    optional: true

# ── ⑨ 常用操作逐个点：必须真的跳到对应页面 ────────────────────────────────
# ★ 落点路径必须真实存在 —— 2026-11-17 实测撞出过死链：
#   「查看用量」原先跳 /usage，而该路径**从来没有路由定义**（router.ts 里没有）
#   ⇒ 点了就是 vue-router 的 no-match 空白页。已改为 /request-logs。
# ★ 每个落点用**该页独有**的可见文本做判据（不能用导航项同名文案 ——
#   导航里也有「请求日志」「对话」，用它当判据会误判成「还在原页」）。
- tapOn:
    id: "quick-add-provider"
- extendedWaitUntil:
    visible:
      text: "上游账号、余额与健康状态"
    timeout: 20000

- openLink: ${BASE_URL}/dashboard
- extendedWaitUntil:
    visible:
      id: "overview-quick-actions"
    timeout: 20000
- tapOn:
    id: "quick-sign-key"
- extendedWaitUntil:
    visible:
      text: "客户端名称"
    timeout: 20000

- openLink: ${BASE_URL}/dashboard
- extendedWaitUntil:
    visible:
      id: "overview-quick-actions"
    timeout: 20000
- tapOn:
    id: "quick-requests"
- extendedWaitUntil:
    visible:
      text: "自动刷新"
    timeout: 20000

- openLink: ${BASE_URL}/dashboard
- extendedWaitUntil:
    visible:
      id: "overview-quick-actions"
    timeout: 20000
- tapOn:
    id: "quick-chat"
- extendedWaitUntil:
    visible:
      text: "+ 新建"
    timeout: 20000

# ── ⑩ 回到总览页 + 刷新按钮可用 ───────────────────────────────────────────
- openLink: ${BASE_URL}/dashboard
- extendedWaitUntil:
    visible:
      id: "overview-status"
    timeout: 20000
- tapOn:
    text: "刷新"
- extendedWaitUntil:
    visible:
      id: "overview-status"
    timeout: 20000
- assertVisible:
    id: "overview-stats"

# ── ⑪ 专家模式不受影响（总览页是简易模式专属） ──────────────────────────
# ★ 切回专家同样点同一个按钮（testid 稳定），判据用专家面首页的独有标题。
- tapOn:
    id: "work-mode-switch"
- extendedWaitUntil:
    visible:
      text: "实时请求流"
    timeout: 20000
- openLink: ${BASE_URL}/dashboard
- extendedWaitUntil:
    visible:
      text: "实时请求流"
    timeout: 20000
# 专家面不应渲染简易模式的总览页标记
- assertNotVisible:
    id: "overview-status"
