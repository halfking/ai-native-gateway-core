# ── /admin/approvals/:id ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/admin/approvals/${APPROVAL_ID}"
- extendedWaitUntil:
    # ★ 本机没有审批数据（/api/admin/approvals 返回 items=[]）⇒ APPROVAL_ID 是哨兵值
    #   ⇒ 详情页必然是空态 ⇒ 断言降级为 optional（页面本身仍会被打开、路由仍会被验到）。
    visible: '审批请求详情'
    timeout: 20000
    optional: true
- evalScript: "${output.ms__admin_approvals_id = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
