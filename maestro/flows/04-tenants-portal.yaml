- openLink: "${BASE_URL}/users"
- extendedWaitUntil:
    visible: '用户管理'
    timeout: 20000
- evalScript: "${output.ms__users = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__users < 2000}"
    optional: true
    label: 'slow-check:/users'

# ── /tenant/models ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/tenant/models?tenant=${TENANT_CODE}"
- extendedWaitUntil:
    visible: '标准模型'
    timeout: 20000
- evalScript: "${output.ms__tenant_models = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__tenant_models < 2000}"
    optional: true
    label: 'slow-check:/tenant/models'

# ── /tenant/account ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/tenant/account?tenant=${TENANT_CODE}"
- extendedWaitUntil:
    # ★ 管理员视图（MaaSAccountView.vue:29）渲染 ctxPageTitle(t('tenants.account.adminTitle'))
    #   ⇒ 标题是「<租户名> · 账户」，**不是**「我的账户」（那是租户自助视图的标题）
    #   ⇒ 断言取账户卡片里与租户名无关的稳定文案。
    visible: '订阅额度'
    timeout: 20000
- evalScript: "${output.ms__tenant_account = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__tenant_account < 2000}"
    optional: true
    label: 'slow-check:/tenant/account'

# ── /tenant/pricing ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/tenant/pricing?tenant=${TENANT_CODE}"
- extendedWaitUntil:
    # ★ 实测（R176 CDP 探针）：标题原文 = 「默认租户 · 套餐与充值」——
    #   管理员视图带**租户名前缀**（MaaSAccountView.vue:29 的 ctxPageTitle）⇒
    #   「套餐与充值」单独写会因**全匹配**落空 ⇒ 只锚住稳定的后半段。
    visible: '.*套餐与充值.*'
    timeout: 20000
- evalScript: "${output.ms__tenant_pricing = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__tenant_pricing < 2000}"
    optional: true
    label: 'slow-check:/tenant/pricing'

# ── /tenant/orders/:id ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/tenant/orders/${ORDER_ID}?tenant=${TENANT_CODE}"
- extendedWaitUntil:
    # ★ 本机没有订单数据（/api/admin/maas/orders 返回 items=[]）⇒ ORDER_ID 是哨兵值
    #   ⇒ 详情页必然是空态 ⇒ 断言降级为 optional（页面本身仍会被打开、路由仍会被验到）。
    visible: '订单支付'
    timeout: 20000
    optional: true
- evalScript: "${output.ms__tenant_orders_id = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__tenant_orders_id < 2000}"
    optional: true
    label: 'slow-check:/tenant/orders/:id'

# ── /tenant/usage ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/tenant/usage?tenant=${TENANT_CODE}"
- extendedWaitUntil:
    # ★ 实测（R176 CDP 探针）：页面上的卡片标题是「积分消耗」（stat-label 元素原文精确等于它），
    #   「积分流水」是**旧文案**。
    visible: '积分消耗'
    timeout: 20000
- evalScript: "${output.ms__tenant_usage = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
