# 供应商 / 模型 / 定价
# providerConsole 与 platformOps 档的供应商、模型目录、定价、免费池。
# 路由清单来自 web/src/router.ts（见 maestro/README.md 的逐条核对表）。
# 计时：每个页面 openLink 前打点 output.t0，页面关键文案可见后算 output.ms__<slug>（毫秒）。
#       阈值 2000ms 用 optional 断言 —— 慢页只标记不失败，事后用 maestro/tools/slow-pages.mjs 筛。
url: ${BASE_URL}
---
- launchApp
- runFlow:
    file: _shared/login.yaml
    env:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

# ── /providers ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/providers"
- extendedWaitUntil:
    visible: '供应商管理'
    timeout: 20000
- evalScript: "${output.ms__providers = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__providers < 2000}"
    optional: true
    label: 'slow-check:/providers'

# ── /providers/:id ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/providers/${PROVIDER_ID}"
- extendedWaitUntil:
    # ★ 默认页签渲染的是「基础信息」区块（locale providerDetail.basicInfo）；
    #   「供应商名称（Name）」是**设置页签**里的表单标签（provider-detail/SettingsTab.vue:304）
    #   ⇒ 默认页签下永远看不到它。
    visible: '基础信息'
    timeout: 20000
- evalScript: "${output.ms__providers_id = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__providers_id < 2000}"
    optional: true
    label: 'slow-check:/providers/:id'

