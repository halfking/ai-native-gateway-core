# ── /key-applications ─────────────────────────────────────────────
- evalScript: "${output.t0 = Date.now()}"
- openLink: "${BASE_URL}/key-applications"
- extendedWaitUntil:
    # ★ 实测（R176 CDP 探针）：H2 原文 = 「密钥申请 1 待审」——徽标数字跟着数据变
    #   ⇒ 不能写死整串，也不能只写「密钥申请」（Maestro 的 visible 是**全匹配**）。
    #   ⇒ 用两侧 .* 的正则，只锚住稳定的那部分。
    visible: '.*密钥申请.*'
    timeout: 20000
- evalScript: "${output.ms__key_applications = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
- assertTrue:
    condition: "${output.ms__key_applications < 2000}"
    optional: true
    label: 'slow-check:/key-applications'
