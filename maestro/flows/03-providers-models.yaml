- openLink: "${BASE_URL}/free-pool"
- extendedWaitUntil:
    # ★ 实测（R176 CDP 探针）：按钮原文就是「写入 DB 凭据」——
    #   「写入免费池凭据（加密存 DB）」是**旧文案**，页面早就不这么写了。
    visible: '写入 DB 凭据'
    timeout: 20000
- evalScript: "${output.ms__free_pool = Math.max(output.t0 ? Date.now() - output.t0 : 0, (typeof performance !== 'undefined' && performance.now) ? Math.round(performance.now()) : 0) || -1}"
