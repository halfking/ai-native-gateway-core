# maestro/env.yaml —— 环境变量模板（★ 不含任何口令/密钥）
#
# ★★ 2026-10-28（R176）实测订正：**Maestro CLI 2.11.0 没有 `--env-file` 选项**，
#   而且 **shell 环境变量不参与 flow 的 `${}` 解析** ⇒ 这个文件**不会**被 Maestro 读取。
#   它现在的作用退化为两份：
#     ① **变量名清单 + 样例值**（人工看「哪些动态段需要什么变量」）；
#     ② **参考**（`maestro/run-local.sh` 传的 `-e` 就是这些键）。
#   ★ 真实取值由 `maestro/tools/resolve-ids.mjs` 从**活着的网关**解析并覆盖 ⇒
#     下面的样例 id 多数在本机并不存在，直接拿来跑会打开空页面。
#
# 推荐用法（唯一经过实跑的路径）：
#   bash maestro/run-local.sh            # 自动起 CDP Chrome + 解析真 ID + 逐 flow 跑
#
# 手工跑单个 flow 时，变量只能靠 `-e KEY=VALUE` 逐个传（口令从仓根 .env.local 读）：
#   maestro test --driver-host-port 9222 --headless --no-ansi \
#     -e BASE_URL=http://127.0.0.1:8782 -e "ADMIN_USER=<本机管理员>" \
#     -e "ADMIN_PASSWORD=<本机口令>" \
#     maestro/flows/02-overview-live.yaml
#
# BASE_URL —— 管理后台地址（OpenAI 兼容 API 在同源的 /v1）
BASE_URL: http://127.0.0.1:8782

# 登录账号 —— 只写占位符，真实口令由操作者在本地 env.local.yaml 里填
ADMIN_USER: admin
ADMIN_PASSWORD: ""

# ── 动态段路由的样例 id（见 README 的「动态路由 → 占位值」表）──────────────
PROVIDER_ID: "1"          # /providers/:id
WORK_TYPE_KEY: chat       # /routing-v2/work-types/:key
TENANT_ID: default        # /tenants/:tenantId
ORDER_ID: "1"             # /tenant/orders/:id、/maas/orders/:id
API_KEY_ID: "1"           # /keys/:id
REQUEST_ID: req-0001      # /live/request/:requestId、/request-detail/:requestId、
                          # /admin/request-actions/:id、/admin/request-registry/journey/:requestId
SESSION_OWNER: default    # /admin/session-analytics/users/:owner
CLIENT_ID: client-0001    # /admin/session-analytics/clients/:id
TASK_ID: task-0001        # /admin/session-analytics/tasks/:id
APPROVAL_ID: "1"          # /admin/approvals/:id
SESSION_ID: sess-0001     # /admin/sessions/:id
CREDENTIAL_ID: "1"        # /admin/connection-registry/:credentialId/recovery

# 租户门户上下文 —— /tenant/* 在默认租户的 platform-ops 身份下必须带 ?tenant=<code>
TENANT_CODE: acme
