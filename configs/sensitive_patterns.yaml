# 敏感信息检测配置
# 配置各种敏感信息的检测模式、关键词和阈值

# 全局配置
#
# ★ r1039（2026-10-20）：本节**不是规则源**——检测器不解析它。
# 理由（逐条）：
#   · min_confidence：检测器没有「置信度」概念。规则条目只读
#     regex/group/kind/scopes/action，`confidence` 字段本身也被忽略。
#     ⇒ 若哪天真按 0.7 实现，**medical.medication（confidence 0.65）会被
#     直接丢弃** —— 一个「看起来更完整」的实现反而让规则变少，所以本轮
#     不动它，只把语义写清楚。
#   · enable_cache / cache_ttl：检测器没有结果缓存层（缓存由网关的
#     会话级映射表承担，不在本文件里配置）。
# ⇒ 保留本节是为了不破坏运维已有的阅读习惯与外部文档引用；它在门禁
#   security/sanitize/r1039_yaml_rule_coverage_test.go 的「非规则段白名单」
#   里被显式登记，不会被当成「漏加载的规则族」。
global:
  min_confidence: 0.7  # 最小置信度阈值（当前未被检测器读取，见上）
  enable_cache: true   # 启用检测结果缓存（当前未被检测器读取）
  cache_ttl: 300       # 缓存过期时间（秒，当前未被检测器读取）

# PII (个人身份信息) 检测规则
pii:
  enabled: true
  patterns:
    # 中国身份证：18位数字或17位数字+X
    id_card:
      regex: '\b[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[\dXx]\b'
      confidence: 0.95
      description: "中国居民身份证号"
      
    # 手机号：1开头的11位数字
    phone:
      regex: '\b1[3-9]\d{9}\b'
      confidence: 0.95
      description: "中国手机号码"
      
    # 邮箱地址
    email:
      regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
      confidence: 0.95
      description: "电子邮箱地址"
      
    # 地址信息
    address:
      regex: '[^\s]{2,}[省市区县镇乡村路街道巷弄号栋单元室]\s*[\d\-号栋单元室]+'
      confidence: 0.7
      description: "详细地址信息"
      
    # 护照号
    #
    # r1039（2026-10-20）：收窄为**中国护照**的真实格式。
    # 原规则 `[EGP]\d{8}` 只要求「E/G/P + 8 位数字」，于是任何以这三个字母
    # 开头的 9 位 token 都会被判成护照号 —— 运维散文里的「配置项 P20240101
    # 生效」就是这么被误伤的（实测被判为敏感并遮蔽）。
    #
    # 中国护照号的真实形态：
    #   · 旧版：E + 8 位数字        （E12345678）
    #   · 电子护照：E + A~G + 7 位数字（EA1234567 / EG1234567）
    # ⇒ 规则改为这两种形态。
    #
    # ★ 取舍（明确写下）：**不再**识别 G 前缀与 P 前缀的 9 位数字串
    # （如 G12345678 / P20240101）。它们不是中国护照格式，而旧规则把它们
    # 一并吞掉，正是本次误伤的来源。
    passport:
      regex: '\bE(?:[A-G]\d{7}|\d{8})\b'
      confidence: 0.85
      description: "中国护照号码"
      
    account:
      # r1024（2026-10-13）：label 集合补 `user` 与 `*_user` 后缀形态（ssh_user= /
      # db_user= / user=）。此前只认 username|user_name|login|account 的确切拼写，
      # 部署配置散文里的 `ssh_user=deploy` 漏检——用户名以明文出网关，模型回显
      # 时又撞上输出侧凭据键检查，整条 tool 调用被掐断。用户名进占位符闭环
      # （TypeAccount）后，出向是占位符、回程可还原。
      regex: '(?i)(?:account|user(?:name|_name)?|[a-z0-9_]*_user|login|帐号|账号|账户|用户名)["'']?(?:\*{1,2}|`)?\s*(?:[:=：]\s*|(?:改成|改为|设置为|设为|更新为|是|为)\s*|\s+(?:is|(?:set|changed?|updated?)\s+to)\s+|\s+)((?:\$\{[^}\r\n]*\}|"(?:\\.|[^"\\])*"|''[^'']*''|`[^`]*`|“[^”]*”|‘[^’]*’|(?:\{SENSITIVE:[a-z_]+:[0-9]+\}|[^\s"''`“”‘’,;，；。！？<>{}=\]|][^\s"''`“”‘’,;，；。！？<>{}\]|]*)+))'
      group: 1
      description: "带标签的登录帐号"
    credential_pair_account:
      regex: '(?i)(?:(?:管理员)?(?:帐号|账号|账户)(?:\s*[/／和及、]\s*(?:密码|口令))?|(?:用户名|username|user)\s*[/／]\s*(?:密码|password)|admin(?:istrator)?\s+(?:account|credentials))\s*(?:改成|改为|设置为|设为|更新为|是|为|[:=：]|(?:set|changed?|updated?)\s+to|to|is)\s*((?:"[^"\r\n]+"|''[^''\r\n]+''|`[^`]+`|“[^”\r\n]+”|‘[^’\r\n]+’|[^\s/／:"''`“”‘’,;，；。！？<>{}=\]|]+))\s*[/／]\s*((?:\$\{[^}\r\n]*\}|"(?:\\.|[^"\\])*"|''[^'']*''|`[^`]*`|“[^”]*”|‘[^’]*’|(?:\{SENSITIVE:[a-z_]+:[0-9]+\}|[^\s"''`“”‘’,;，；。！？<>{}=\]|][^\s"''`“”‘’,;，；。！？<>{}\]|]*)+))'
      group: 1
    # 2026-10-10: server_ip / server_ipv6 不再进入脱敏范围。
    #
    # 地址类文本（http_proxy=http://127.0.0.1:7890、host: 10.24.7.91、
    # k8s service DNS、部署目标）是运维上下文而不是机密：把它脱敏只会把一条
    # 正确的、可直接复制执行的命令变成坏命令，代价由每一个请求承担，而收益
    # 为零。security/sanitize 的 ScopeRedact 因此不匹配这两条规则。
    #
    # 它们仍被载入——不是遗漏，是给输出侧的防外传守卫（ScopeEgress）用的：
    # 模型生成的 tool 参数里出现公网地址时，那是一个"外传目的地"而不是普通
    # 文本，仍然硬阻断（见 security/sanitize/output_sensitive.go）。
    server_ip:
      regex: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
      description: "公网及内网服务器 IPv4 —— 仅供 ScopeEgress 防外传守卫，不参与脱敏"
    server_ipv6:
      regex: '(?:[0-9A-Fa-f]{0,4}:){2,}[0-9A-Fa-f:.]*(?:%[A-Za-z0-9_.-]+)?'
      description: "服务器 IPv6 —— 仅供 ScopeEgress 防外传守卫，不参与脱敏"

  keywords:
    - "身份证"
    - "护照"
    - "驾驶证"
    - "户口"
    - "姓名"
    - "家庭住址"
    - "详细地址"
    - "出生日期"
    - "籍贯"
    
  redaction_rules:
    id_card: "show_first_3_last_4"  # 显示前3后4位
    phone: "show_last_4"             # 只显示后4位
    email: "show_first_char_domain"  # 显示首字符和域名
    address: "show_province_city"    # 只保留省市
    passport: "show_first_2_last_2"  # 显示前2后2位

# SECRET (密钥/密码) 检测规则
secret:
  enabled: true
  patterns:
    # API Key 格式
    # 2026-10-10: audit 244 F2 —— 键体放开中缀连字符，修 sk-proj- / sk-ant- /
    # sk-or-v1- 三家真实格式的系统性漏检（明文密钥会直接进上游并落库）。
    # 这里只描述「形状」：sk/ak- 前缀 + 连字符分段。16 位长度下限与「键体含数字」
    # 这两条是整串属性，RE2 无法用前瞻断言表达（Go regexp 直接报错），由
    # security/sanitize 的 credibleSecretCandidate 统一后置过滤 —— 内置 fallback
    # 与本文件共用同一个过滤器，两份规则因此不会各自漂移。
    api_key:
      regex: '\b(?:sk|ak|key|token|api|bearer)[-_]?[A-Za-z0-9]+(?:[-_][A-Za-z0-9]+)*\b'
      confidence: 0.9
      description: "API密钥"      
    # 密码字段
    # 2026-10-14 (r1028): 未加引号的值首字符不得为 `=`——原字符类放行纯 `=` 串，
    # `echo '=== pwd ==='`（bash 分节装饰）被解析成「pwd = 赋值 ==」，生产 154
    # 实测把 1279 字节纯 git 检查命令整流 output_policy_blocked（request
    # 5d9e1267），redact 侧同规则会把正文分节标题遮成 [REDACTED:secret]。
    # 带引号的值（含 "="）走引号分支不受影响。
    password:
      regex: '(?i)(?:password|passwd|pwd|secret|token|api_key|apikey|access_key|authorization|密码|口令)["'']?(?:\*{1,2}|`)?\s*(?:[:=：]\s*|(?:改成|改为|设置为|设为|更新为|是|为)\s*|\s+(?:is|(?:set|changed?|updated?)\s+to)\s+|\s+)((?:\$\{[^}\r\n]*\}|"(?:\\.|[^"\\])*"|''[^'']*''|`[^`]*`|“[^”]*”|‘[^’]*’|(?:\{SENSITIVE:[a-z_]+:[0-9]+\}|[^\s"''`“”‘’,;，；。！？<>{}=\]|][^\s"''`“”‘’,;，；。！？<>{}\]|]*)+))'
      group: 1
      confidence: 0.8
      description: "密码字段"
      
    credential_pair_secret:
      regex: '(?i)(?:(?:管理员)?(?:帐号|账号|账户)(?:\s*[/／和及、]\s*(?:密码|口令))?|(?:用户名|username|user)\s*[/／]\s*(?:密码|password)|admin(?:istrator)?\s+(?:account|credentials))\s*(?:改成|改为|设置为|设为|更新为|是|为|[:=：]|(?:set|changed?|updated?)\s+to|to|is)\s*((?:"[^"\r\n]+"|''[^''\r\n]+''|`[^`]+`|“[^”\r\n]+”|‘[^’\r\n]+’|[^\s/／:"''`“”‘’,;，；。！？<>{}=\]|]+))\s*[/／]\s*((?:\$\{[^}\r\n]*\}|"(?:\\.|[^"\\])*"|''[^'']*''|`[^`]*`|“[^”]*”|‘[^’]*’|(?:\{SENSITIVE:[a-z_]+:[0-9]+\}|[^\s"''`“”‘’,;，；。！？<>{}=\]|][^\s"''`“”‘’,;，；。！？<>{}\]|]*)+))'
      group: 2
    # JWT Token
    jwt:
      regex: '\beyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b'
      confidence: 0.95
      description: "JWT令牌"
      
    # AWS Access Key
    aws_key:
      regex: '\b(AKIA|ASIA)[A-Z0-9]{16}\b'
      confidence: 0.95
      description: "AWS访问密钥"
      
    # RSA Private Key
    rsa_key:
      regex: '(?s)-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----.*?(?:-----END (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----|$)'
      confidence: 1.0
      description: "RSA私钥"
      
    bearer:
      regex: '(?i)\bBearer\s+([A-Za-z0-9._~+/=-]+)'
      group: 1
      description: "Bearer 认证令牌"
    connection_credentials:
      regex: '\b(?:postgres(?:ql)?|mysql|redis|mongodb(?:\+srv)?|https?)://([^\s/@]+:[^\s/@]+)@'
      group: 1
      description: "连接串中的帐号密码"

  keywords:
    - "密码"
    - "password"
    - "secret"
    - "token"
    - "api key"
    - "access key"
    - "私钥"
    - "private key"
    - "credentials"
    
  redaction_rules:
    api_key: "show_first_4_last_4"   # 显示前4后4位
    password: "full_redact"           # 完全隐藏
    jwt: "show_first_10_last_10"     # 显示前10后10位
    aws_key: "show_first_4_last_4"   # 显示前4后4位
    rsa_key: "full_redact"            # 完全隐藏

# FINANCIAL (金融信息) 检测规则
financial:
  enabled: true
  patterns:
    # 银行卡号：按 IIN（发卡行前 6 位）前缀族约束，仍是 16-19 位、允许 4 位
    # 分组之间用空格或连字符。
    #
    # r1039（2026-10-20）：原规则 `\b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4,7}\b`
    # 只要求「16-19 位数字」，于是**任何**长数字串都是卡号 —— 17 位的纳秒
    # 时间戳（`时间戳 2026102012345678`）被判成 credit_card 并遮蔽。
    #
    # ⇒ 改为「IIN 前缀 + 长度」双约束：卡号必须落在真实发卡行前缀族里
    #（Visa 4 / Mastercard 51-55 / AmEx 34,37 / Discover 6011,65xx /
    #  UnionPay 62 / JCB 35），且长度 16-19（AmEx 例外为 15）。
    # 时间戳以 1 或 2 开头，落在所有前缀族之外 ⇒ 不再命中。
    #
    # ★ 取舍（明确写下）：**不再**识别不以已知 IIN 开头的 16-19 位数字串
    # （例如部分历史发行的、以 2 开头的老卡）。旧规则把它们全当卡号，
    # 代价是把时间戳、流水号一并遮蔽。
    bank_card:
      regex: '\b(?:3[47]\d{13}|(?:4\d{3}|5[1-5]\d{2}|3[47]\d{2}|6(?:011|5\d{2})|62\d{2}|35\d{2})[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4,7})\b'
      confidence: 0.85
      description: "银行卡号"
      
    # 信用卡 CVV
    cvv:
      regex: '\b(cvv|安全码)\s*[:=]?\s*\d{3,4}\b'
      confidence: 0.9
      description: "信用卡安全码"
      
    # 支付宝账号
    alipay:
      regex: '(支付宝|alipay)\s*[:：]\s*([1]\d{10}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,})'
      confidence: 0.85
      description: "支付宝账号"
      
    # 微信账号
    wechat:
      regex: '(微信|wechat|wx)\s*[:：]\s*[A-Za-z0-9_-]{6,20}'
      confidence: 0.75
      description: "微信账号"
      
    # IBAN (国际银行账号)
    #
    # r1039（2026-10-20）：原规则 `\b[A-Z]{2}\d{2}[A-Z0-9]{4,30}\b` 只有
    # 「两个大写字母 + 两位数字」这一条结构约束，于是 `US20240001`、
    # `DE1234ABCD` 这类 10 位 token 全部被判成 IBAN。
    #
    # ⇒ 改为「真实 IBAN 国家代码 + 合法长度」双约束：
    #   · 国家代码取 SWIFT IBAN 注册表里的代码表（US 不是 IBAN 国家 ⇒
    #     `US20240001` 直接出局）；
    #   · IBAN 总长 15-34 位（最短 NO 15 位），故 BBAN 段为 11-30 位
    #     ⇒ `DE1234ABCD`（10 位）因长度出局。
    #
    # ★ 取舍（明确写下）：**不再**识别国家代码不在表内、或长度不在
    # 15-34 位之间的形似 IBAN 串。旧规则把它们一并吞掉，是本次误伤的来源。
    iban:
      regex: '\b(?:AD|AE|AL|AT|AZ|BA|BE|BG|BH|BR|BY|CH|CR|CY|CZ|DE|DK|EE|EG|ES|FI|FO|FR|GB|GE|GI|GL|GR|GT|HR|HU|IE|IL|IQ|IS|IT|JO|KW|KZ|LB|LC|LI|LT|LU|LV|LY|MC|MD|ME|MK|MR|MT|MU|NL|NO|PK|PL|PS|PT|QA|RO|RS|SA|SC|SE|SI|SK|SM|ST|SV|TL|TN|TR|UA|VA|VG|XK)\d{2}[A-Z0-9]{11,30}\b'
      confidence: 0.8
      description: "国际银行账号"
      
  keywords:
    - "银行卡"
    - "信用卡"
    - "储蓄卡"
    - "账户余额"
    - "转账"
    - "支付宝"
    - "微信支付"
    - "卡号"
    - "CVV"
    - "安全码"
    
  redaction_rules:
    bank_card: "show_last_4"         # 只显示后4位
    cvv: "full_redact"                # 完全隐藏
    alipay: "show_last_4"            # 只显示后4位
    wechat: "show_first_3_last_3"    # 显示前3后3位
    iban: "show_first_4_last_4"      # 显示前4后4位

# MEDICAL (医疗信息) 检测规则
#
# ★ r1039（2026-10-20）：本族此前**完全没被加载**，而且**就算加载也会炸**——
# 下面两条正则里的 `\u4e00` 是 **Java/JS 风格的 Unicode 转义**，Go 的 RE2
# **不支持**（`regexp.Compile` 报 `invalid escape sequence: \u`）。而
# parsePatternConfig 是「整份文件全编译、全通过才替换」的语义 ⇒ 一条规则
# 编译失败 ⇒ **整个 configs/sensitive_patterns.yaml 加载失败** ⇒ 网关回落
# 到内置兜底规则集（连 pii/secret/financial 也一起没了）。
# ⇒ 字符类改用 RE2 支持的 `\x{...}` 写法（语义与原来的 CJK 基本区一致）。
#
# ★ 同族的 `keywords:` 与 `redaction_rules:` 仍**不是规则源**（检测器只读
# enabled/patterns/regex/group/kind/scopes/action），它们只是说明文档。
medical:
  enabled: true
  patterns:
    # 病历号
    medical_record:
      regex: '(病历号|就诊号|住院号)\s*[:：]?\s*[A-Z0-9]{6,20}'
      confidence: 0.85
      description: "病历号"

    # 诊断信息
    diagnosis:
      regex: '(诊断|确诊|患有|病情)\s*[:：]?\s*[\x{4e00}-\x{9fa5}]{2,20}'
      confidence: 0.7
      description: "诊断信息"

    # 药品名称
    medication:
      regex: '(服用|用药|处方)\s*[:：]?\s*[\x{4e00}-\x{9fa5}A-Za-z]{2,20}'
      confidence: 0.65
      description: "药品信息"
      
  keywords:
    - "病历"
    - "诊断"
    - "处方"
    - "病情"
    - "症状"
    - "治疗方案"
    - "手术"
    - "住院"
    - "就诊"
    - "病史"
    
  redaction_rules:
    medical_record: "show_first_2_last_2"  # 显示前2后2位
    diagnosis: "partial_redact"             # 部分隐藏
    medication: "partial_redact"            # 部分隐藏

# 脱敏规则详细说明
#
# ★ r1039（2026-10-20）：本节**不是规则源**——它只是各遮蔽样式的说明文档。
# 检测器实际只用统一占位符（{SENSITIVE:<type>:<n>}）与统一还原，不按
# `redaction_rules` / `redaction_methods` 的样式名分派。
redaction_methods:
  full_redact:
    description: "完全隐藏，显示为 ******"
    example: "password123 -> ******"
    
  show_first_3_last_4:
    description: "显示前3位和后4位，中间用 * 替代"
    example: "110101199001011234 -> 110***********1234"
    
  show_first_4_last_4:
    description: "显示前4位和后4位，中间用 * 替代"
    example: "sk-1234567890abcdef -> sk-1****cdef"
    
  show_last_4:
    description: "只显示后4位，前面用 * 替代"
    example: "13812345678 -> ****5678"
    
  show_first_char_domain:
    description: "邮箱只显示首字符和域名"
    example: "username@example.com -> u***@example.com"
    
  partial_redact:
    description: "部分隐藏，保留关键信息可识别性"
    example: "高血压糖尿病 -> 高***病"

# 性能优化配置
#
# ★ r1039（2026-10-20）：本节**不是规则源**——检测器不解析它（检测是同步
# 顺序执行的；限流/超时由网关其它层负责）。
performance:
  max_content_length: 1048576  # 最大内容长度（1MB）
  parallel_detection: true     # 并行检测
  max_goroutines: 10          # 最大并发数
  timeout_ms: 5000            # 超时时间（毫秒）

# 审计日志配置
#
# ★ r1039（2026-10-20）：本节**不是规则源**——检测器不解析它。审计台账由
# domains/sanitizerules（托管规则）那条链路负责，与本文件无关。
audit:
  log_detections: true        # 记录检测结果
  log_redactions: true        # 记录脱敏操作
  include_context: false      # 不包含敏感内容上下文
  retention_days: 90          # 日志保留天数

# 白名单配置
#
# ★ r1039（2026-10-20）：本节**不是规则源**——检测器不解析它，
#  白名单**不作为放行依据**（见下方 exclude_patterns 的说明）。
#  门禁 security/sanitize/r1039_yaml_rule_coverage_test.go 会断言
#  exclude_patterns 保持为空：往里加一条不会生效，却看起来像生效了 ——
#  那正是 r1039 要消灭的「静默失效」形态。
whitelist:
  # 测试环境白名单（仅作说明，当前不被检测器读取）
  test_patterns:
    - "test@example.com"
    - "1234567890"
    - "sk-test-"

  # 检测器目前仅解析 enabled/patterns/regex/group；白名单不作为放行依据。
  # 保持为空；加条目请先在代码里实现放行语义，否则门禁会红。
  exclude_patterns: []

# 自定义规则扩展
#
# ★ r1039（2026-10-20）：本节**不是规则源**——检测器只加载
#  「<族名>.patterns.<规则名>」这种结构（见 pii/secret/financial/medical），
#  而 custom_rules 用的是另一套 schema（name/type/confidence/redaction），
#  加载器不认 ⇒ 加在这里的规则**不会生效**。
#  ⇒ 门禁 security/sanitize/r1039_yaml_rule_coverage_test.go 断言 rules 保持
#  为空：加一条就会红，并提示把规则写进某个 `patterns:` 族里。
custom_rules:
  enabled: true
  rules: []
  # 示例：
  # - name: "internal_employee_id"
  #   type: "PII"
  #   regex: '\bEMP\d{6}\b'
  #   confidence: 0.9
  #   redaction: "show_first_3_last_2"
