# PostgreSQL Instance Sync Policy Configuration
# This file defines the sync behavior for database instances

# Database exclusion regex - databases matching this pattern will be excluded
# Patterns: test databases, development databases, sync metadata
EXCLUDE_DB_REGEX='(^|_)(test|e2e|bench|dev)($|_)|^llm_gateway_sync_'

# Schema-only databases - these databases will only sync schema, no data
# llm_gateway: Production data must never be modified
SCHEMA_ONLY_DBS='llm_gateway'

# Database aliases - map local database names to remote names
# Format: local_name=remote_name
# smm_data maps to smm on remote
DB_ALIASES='smm_data=smm'

# Local-only allowlist - these databases can be created on remote if missing
# They will use CREATE_REMOTE_AND_INSERT_ONLY mode
LOCAL_ONLY_ALLOWLIST='acc_swarm_db ai_alyy identity_shadow maintain_db'

# Per-database schema scope. llm_gateway follows the repository SQL SSOT;
# local integration schemas are intentionally not production sync inputs.
DATABASE_SCHEMA_ALLOWLIST='llm_gateway=public,maintain'
LLM_SCHEMA_EVENT_TRIGGER='enforce_columnar_trigger'
EXCLUDE_SCHEMA_REGEX='(^|_)(test|e2e|bench|dev|smoke)($|_)'

# Target owner overrides when the source login role is intentionally absent.
DATABASE_OWNER_MAP='maintain_db=llm_gateway'

# Reserved policy vocabulary for the future unified conflict executor.
# Current additive executors intentionally do not consume these settings.
# Schema sync configuration
SCHEMA_SYNC_MODE='additive-first'  # additive-first, local-wins, fail-on-conflict
SCHEMA_CONFLICT_RESOLUTION='local-wins'  # local-wins, remote-wins, manual

# Data sync configuration  
DATA_SYNC_MODE='insert-only'  # insert-only, upsert, replace
DATA_CONFLICT_RESOLUTION='do-nothing'  # do-nothing, skip, fail

# Safety settings
REQUIRE_MANIFEST_HASH=true
REQUIRE_FRESHNESS_CHECK=true
MAX_MANIFEST_AGE_HOURS=1
DESTRUCTIVE_OPERATIONS_REQUIRE_CONFIRMATION=true

# Extension handling
EXTENSION_UNAVAILABLE_BEHAVIOR='fail'  # fail, skip, warn

# Logging and monitoring
LOG_LEVEL='INFO'  # DEBUG, INFO, WARN, ERROR
ENABLE_PROGRESS_REPORTING=true
ENABLE_STATISTICS_COLLECTION=true