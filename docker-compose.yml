services:
  llm-gateway:
    build: .
    ports:
      - "127.0.0.1:8781:8781"
    environment:
      - LLM_GATEWAY_ENV=production
      - LLM_GATEWAY_LISTEN=:8781
      - LLM_GATEWAY_DATABASE_URL=${LLM_GATEWAY_DATABASE_URL:?LLM_GATEWAY_DATABASE_URL is required}
      - LLM_GATEWAY_CREDENTIAL_ENCRYPTION_KEY=${LLM_GATEWAY_CREDENTIAL_ENCRYPTION_KEY:?LLM_GATEWAY_CREDENTIAL_ENCRYPTION_KEY is required}
      - LLM_GATEWAY_API_KEY=${LLM_GATEWAY_API_KEY:?LLM_GATEWAY_API_KEY is required}
      - LLM_GATEWAY_ADMIN_API_KEY=${LLM_GATEWAY_ADMIN_API_KEY:?LLM_GATEWAY_ADMIN_API_KEY is required}
      - LLM_GATEWAY_SECRET_KEY=${LLM_GATEWAY_SECRET_KEY:?LLM_GATEWAY_SECRET_KEY is required}
      - LLM_GATEWAY_CENTER_URL=${LLM_GATEWAY_CENTER_URL:-https://llm.kxpms.cn}
      # 2026-08-04 (spec §10.4.1): IR as default protocol conversion path.
      # Emergency rollback: set to "false" or remove this line.
      - TRANSPORT_LAYER_IR_ENABLED=true
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8781/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.5
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data:
