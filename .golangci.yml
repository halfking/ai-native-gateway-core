# golangci-lint 配置 (Phase 0 任务 4/5)
# 目的: 强制依赖方向，支持弹性架构演进
#
# 格式: golangci-lint v2 (https://golangci-lint.run/product/migration-guide/)
# Round 39 — 升级 v1 → v2 以接入 CI（v1 不被 golangci-lint ≥2.0 支持）

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true
  exclusions:
    paths:
      - vendor
      - build

linters:
  default: none
  enable:
    # bodyclose 故意不启用 —— R88-s 实测结论（docs/全面审计v3/2026-10-01/82-*.md）：
    #   1) 全仓 bodyclose 只报 3 条，逐条读包围函数后 3/3 为误报；
    #   2) 其中 1 条报在 pkg/httputil.ReadPrefixAndDrain 的调用点上——本仓标准
    #      drain-and-close helper 对 bodyclose 不可见，且它没有任何 skip 能力
    #      （v2.13.2 还会静默接受 settings 下的未知键，写了 skip 也不报错、
    #       也不生效）。启用后凡按本仓标准写法新增的出口都会假报；
    #   3) bodyclose 不跨函数追踪，而本仓主出口是自定义 upstream.Client.Do，
    #      处于其结构盲区之外——即"主路径没覆盖、helper 写法却报"。
    # 若将来确要启用，须先让 bodyclose 认识 ReadPrefixAndDrain，否则
    # ratchet（--new-from-rev）会持续对本仓标准写法出假新发现。
    - depguard      # 依赖方向强制（架构护栏，v1 已启用）
    - govet         # go vet（默认）
    - errcheck      # 错误检查（默认）
    - staticcheck   # 静态分析（默认；v2 已合并 gosimple）
    - unused        # 未使用代码（默认）
    - ineffassign   # 无效赋值（默认）
  settings:
    depguard:
      rules:
        # 规则 1: domain/ 零依赖（叶子包）
        domain-zero-deps:
          files:
            - "domain/*.go"
          deny:
            - pkg: "github.com/kaixuan/llm-gateway-go/domain"
              desc: "domain/ 是叶子包，不应被业务包依赖（只能依赖接口）"

        # 规则 2: platform/ 不能依赖 application/gateway
        platform-no-app:
          files:
            - "**/db/**"
            - "**/auth/**"
            - "**/pool/**"
            - "**/secret/**"
          deny:
            - pkg: "github.com/kaixuan/llm-gateway-go/routing"
              desc: "platform 层不能依赖 application 层"
            - pkg: "github.com/kaixuan/llm-gateway-go/maas"
              desc: "platform 层不能依赖 application 层"
            - pkg: "github.com/kaixuan/llm-gateway-go/admin"
              desc: "platform 层不能依赖 application 层"
            - pkg: "github.com/kaixuan/llm-gateway-go/cmd"
              desc: "platform 层不能依赖 gateway 层"

        # 规则 3: 禁止循环依赖关键路径
        no-circular:
          files:
            - "$all"
          deny:
            - pkg: "github.com/kaixuan/llm-gateway-go/relay"
              desc: "relay/ 已废弃，不应再有新引用"

        # 规则 4: control/query 不能相互依赖（CQRS）
        cqrs-separation:
          files:
            - "**/control/**"
          deny:
            - pkg: "github.com/kaixuan/llm-gateway-go/query"
              desc: "CQRS: control/ (命令) 不能依赖 query/ (查询)"

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # 测试文件放宽规则
    - path: _test\.go
      linters:
        - errcheck
        - staticcheck

output:
  print-issued-lines: true
  print-linter-name: true

# Formatters (v2): 替代原 v1 中的 gofmt/goimports linter
# CI 中以 check 模式运行：发现未格式化文件即 fail
formatters:
  enable:
    - gofmt
    - goimports

severity:
  default: error
