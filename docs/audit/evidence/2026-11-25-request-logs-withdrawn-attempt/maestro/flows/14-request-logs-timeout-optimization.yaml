# 14-request-logs-timeout-optimization.yaml —— request-logs 页面查询超时优化验证
#
# 覆盖对象：web/src/views/RequestLogsView.vue（请求日志列表页）
#
# 验证目标：
#   1. 探测流量查询的动态超时机制（120秒）
#   2. 自动窗口限制（探测流量>12h自动截断）
#   3. 醒目的加载覆盖层UI（大型spinner + 动态消息）
#   4. 改进的超时错误消息
#
# 运行方法：
#   BASE_URL=http://192.168.31.211:8783 maestro/run-local.sh maestro/flows/14-request-logs-timeout-optimization.yaml
#
# 前置条件：
#   - 服务已部署到 192.168.31.211:8783
#   - .env.local 包含管理员凭据
#   - 浏览器可访问目标服务

appId: com.mobile.maestro.web

---
# ═══════════════════════════════════════════════════════════════════════════════
# Step 1: 访问登录页并登录
# ═══════════════════════════════════════════════════════════════════════════════
- launchApp:
    appId: ${BASE_URL}/
    clearState: true

- assertVisible: "登录"

- tapOn:
    text: "账号"
- inputText: "${ADMIN_USERNAME}"

- tapOn:
    text: "密码"  
- inputText: "${ADMIN_PASSWORD}"

- tapOn:
    text: "登录"

# 等待登录完成，主页加载
- assertVisible: "总览"

---
# ═══════════════════════════════════════════════════════════════════════════════
# Step 2: 导航到 request-logs 页面
# ═══════════════════════════════════════════════════════════════════════════════
- tapOn:
    text: "日志"
    
- tapOn:
    text: "请求日志"
    
- assertVisible: "请求日志"

---
# ═══════════════════════════════════════════════════════════════════════════════
# Test 1: 业务流量 24小时查询（应该成功，<60秒）
# ═══════════════════════════════════════════════════════════════════════════════
- tapOn:
    text: "最近24小时"

# 确保探测流量未选中（默认状态）
# 验证加载UI可见性
- tapOn:
    text: "查询"

# 加载状态应该可见（即使很短暂）
# 注意：由于加载可能很快，这个断言可能在加载完成后执行
# 如果业务流量查询很快（<2秒），可能看不到加载状态

# 等待结果加载
- assertVisible: "状态"

---
# ═══════════════════════════════════════════════════════════════════════════════
# Test 2: 探测流量 6小时查询（应该成功，<120秒，显示长查询提示）
# ═══════════════════════════════════════════════════════════════════════════════
- tapOn:
    text: "最近6小时"

# 启用探测流量
- tapOn:
    text: "包含探测流量"

- tapOn:
    text: "查询"

# 长查询应该显示特殊的加载消息
# 由于Maestro web driver的视口限制，可能无法断言覆盖层内的具体文本
# 但查询应该在120秒内完成

- assertVisible: "状态"

---
# ═══════════════════════════════════════════════════════════════════════════════
# Test 3: 探测流量 24小时查询（应该自动限制到12小时）
# ═══════════════════════════════════════════════════════════════════════════════
- tapOn:
    text: "最近24小时"

# 探测流量应该还是选中状态
- tapOn:
    text: "查询"

# 查询应该成功（因为窗口被自动限制到12小时）
- assertVisible: "状态"

# 验证窗口限制提示（如果可见）
# 注意：由于Maestro web driver的视口限制，页面底部的提示可能不可见
# 这取决于结果数量和页面布局

---
# ═══════════════════════════════════════════════════════════════════════════════
# Test 4: 验证查询成功后页面元素存在
# ═══════════════════════════════════════════════════════════════════════════════
# 验证表格列标题存在
- assertVisible: "时间"
- assertVisible: "会话标题"
- assertVisible: "调用方"
- assertVisible: "路由"

---
# ═══════════════════════════════════════════════════════════════════════════════
# 测试完成标记
# ═══════════════════════════════════════════════════════════════════════════════
- tapOn:
    text: "总览"
    
- assertVisible:
    text: "总览"
