/* ── 12. 浮窗（统计 + 过滤）接线 ────────────────────────────────
   ★ owner 第 4 轮：统计与过滤合并为**一个浮动层**，可拖动、可三档缩放。
   ★ 开关仍收敛到单一入口（hidden 与 aria-expanded 同点同步）——
     上一轮的教训：多处直改 hidden 会让「谁关的」不可指认。 */
const statnoteBtn=document.getElementById('statnoteBtn');
const statnoteBox=document.getElementById('statnote');
const hud=document.getElementById('hud');
const hudBar=document.getElementById('hudBar');
let hudZoom=1;                                   /* 0=小 1=中 2=大 */
const ZOOMS=['hud--s','hud--m','hud--l'];

function setHudOpen(open){
  hud.hidden=!open;
  statnoteBtn.setAttribute('aria-expanded', open?'true':'false');
  const caret=document.getElementById('statnoteCaret');
  if(caret) caret.textContent=open?'▴':'▾';
  if(open) renderHud();
}
function setHudZoom(z){
  hudZoom=Math.max(0,Math.min(2,z));
  hud.classList.remove('hud--s','hud--m','hud--l');
  hud.classList.add(ZOOMS[hudZoom]);
  /* 大档自动展开全部明细组（缩放＝看更多，不是只放大字号） */
  if(hudZoom===2){ statGroupOpen={clients:true,providers:true,models:true}; }
  renderHud();
}
/** 关闭所有多选下拉浮层（浮层互斥：统计面板与多选下拉不同时展开）。 */
function closeMsPops(){ document.querySelectorAll('.ms__pop').forEach(p=>p.setAttribute('hidden','')); }

statnoteBtn.addEventListener('click',e=>{
  e.stopPropagation();
  if(hud.hidden){ closeMsPops(); setHudOpen(true); }
  else setHudOpen(false);
});
document.getElementById('hudClose').addEventListener('click',e=>{ e.stopPropagation(); setHudOpen(false); });
document.getElementById('hudSmaller').addEventListener('click',e=>{ e.stopPropagation(); setHudZoom(hudZoom-1); });
document.getElementById('hudBigger').addEventListener('click',e=>{ e.stopPropagation(); setHudZoom(hudZoom+1); });
/* 拖动移动（标题栏空白处；按钮不触发拖动） */
hudBar.addEventListener('pointerdown',e=>{
  if(e.target.closest('.hud__b')) return;
  const r=hud.getBoundingClientRect();
  const dx=e.clientX-r.left, dy=e.clientY-r.top;
  hud.style.right='auto'; hud.style.bottom='auto';
  hud.style.left=r.left+'px'; hud.style.top=r.top+'px';
  const move=ev=>{
    hud.style.left=Math.max(0,Math.min(window.innerWidth-60,ev.clientX-dx))+'px';
    hud.style.top=Math.max(0,Math.min(window.innerHeight-30,ev.clientY-dy))+'px';
  };
  const up=()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
  window.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  e.preventDefault();
});
hud.addEventListener('click',e=>{
  e.stopPropagation();
  const int=e.target.closest('#spInterval');
  if(int){ statInterval=+int.value; renderHud(); return; }
  const gh=e.target.closest('.sp__ghead');
  if(gh){ const g=gh.dataset.g; statGroupOpen[g]=!statGroupOpen[g]; renderHud(); return; }
  const row=e.target.closest('.sp__row');
  if(row){                                   // 点明细行＝联动过滤（与原页同语义）
    const dim=row.dataset.dim, key=row.dataset.key;
    const list=filterState[dim];
    const i=list.indexOf(key);
    if(i>=0) list.splice(i,1); else list.push(key);
    applyFilters(); renderHud();
  }
});

/* 点空白处关闭所有浮层：用 composedPath() 判定（对 target 重定向免疫） */
document.addEventListener('click',e=>{
  const path=e.composedPath();
  const inHud=path.includes(hud);

document.getElementById('btnFullscreen').addEventListener('click',()=>{
  const el=document.documentElement;
  if(document.fullscreenElement) void document.exitFullscreen().catch(()=>{});
  else void el.requestFullscreen().catch(()=>{});
});

/* ── 13. 启动 ────────────────────────────────────────────────── */
/* 版面模式：auto（按窗口宽）/ wide / narrow —— 审核时可手动切换两种版面 */
let layoutMode='auto';
function applyLayout(){
  const narrow = layoutMode==='narrow' || (layoutMode==='auto' && window.innerWidth<=1023);
  document.documentElement.classList.toggle('layout-narrow', narrow);
}
window.addEventListener('resize', applyLayout);
document.getElementById('btnLayout').onclick=e=>{
  layoutMode = layoutMode==='auto'?'wide':(layoutMode==='wide'?'narrow':'auto');
  e.target.textContent='版面：'+(layoutMode==='auto'?'自动':(layoutMode==='wide'?'宽屏树':'窄屏卡片'));
  applyLayout();
};
applyLayout();

DIMS.forEach(mountMulti);          // 原页四维多选过滤
buildStageHead(); updateStats(); startTimers();
setTimeout(()=>{ spawnRequest(); totalReq++; updateStats(); }, 120);

setTimeout(()=>{ spawnRequest(); totalReq++; updateStats(); }, 1100);
setTimeout(()=>{ spawnRequest({failAt:'route'}); totalReq++; updateStats(); }, 1600);
setTimeout(()=>{ spawnRequest(); totalReq++; updateStats(); }, 2100);
setTimeout(()=>scrollToBottom(), 400);
</script>
