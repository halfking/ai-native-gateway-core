<script>
const PATCH = "/*\n * MCode \u5ba2\u6237\u7aef \u2014\u2014 markdown \u5217\u8868\u5728\u7a84\u89c6\u53e3\u88ab\u538b\u6210\u300c\u4e00\u5217\u5355\u5b57\u7b26\u300d\u7684\u4fee\u590d\u8865\u4e01\n * ============================================================================\n * \u51fa\u5904\uff1allm-gateway-go \u5ba1\u8ba1\u6863 docs/audit/2026-10-29-\u4f1a\u8bdd\u95f8\u4e0e\u5217\u8868\u584c\u9677\u8f6e.md \u00a72 / \u00a77\n * \u5b9e\u6d4b\u73af\u5883\uff1a/Applications/MiniMax Code.app\uff08app.asar\uff0c353103418 \u5b57\u8282\uff09\n *           \u63d0\u53d6\u7684\u771f\u5b9e CSS\uff08matrix-markdown.css\uff09+ \u771f\u5b9e JSX\uff08archon page chunk\uff09\n *           \u21d2 \u2605 \u672c\u6587\u4ef6\u7684\u6bcf\u4e2a\u9009\u62e9\u5668\u90fd\u5bf9\u7740**\u771f\u5b9e\u5b58\u5728\u7684\u7c7b\u540d**\u5199\uff0c\u2605 \u4e0d\u542b\u4efb\u4f55\u81c6\u9020\u7c7b\u540d\u3002\n *\n * \u2605\u2605 2026-10-30 \u4fee\u8ba2\uff08\u2605\u2605 \u672c\u6587\u4ef6\u7684\u7b2c\u4e00\u7248\u6709\u4e24\u5904\u9519\u8bef\uff0c\u2605 \u8fd9\u91cc\u9010\u6761\u8ba2\u6b63\uff09\uff1a\n *\n *   \u2605\u2605 \u9519\u8bef\u4e00\uff08\u2605 \u9009\u62e9\u5668\u6253\u4e0d\u4e2d\uff09\uff1a\u2605 \u7b2c\u4e00\u7248\u7684 P1 \u7528\u4e86 `.stream-message-content`\u3002\n *      \u2605\u2605 **\u5168 asar \u5b57\u8282\u7ea7\u626b\u63cf\u5b9e\u6d4b**\uff1a\u2605 `stream-message-content` \u5171 **24 \u5904**\uff0c\n *      \u2605\u2605 **24 \u5904\u5168\u5728 CSS \u9009\u62e9\u5668\u91cc**\uff08\u2605 `.message-container-chat-content .stream-message-content\n *      \u2605\u2605   .mavis-chat-markdown-flow>.markdown-table-shell{\u2026}`\uff09\uff0c\u2605 **0 \u5904\u51fa\u73b0\u5728 JS/DOM**\n *      \u2605\u2605   \u21d2 \u2605\u2605 **\u8be5\u7c7b\u5728\u771f\u5b9e DOM \u91cc\u6839\u672c\u4e0d\u5b58\u5728** \u21d2 \u2605\u2605 P1 \u7684\u9009\u62e9\u5668**\u6c38\u8fdc\u5339\u914d\u4e0d\u5230\u4efb\u4f55\u5143\u7d20**\n *      \u2605\u2605   \u21d2 \u2605\u2605 **P1 \u662f\u6b7b\u4ee3\u7801**\uff08\u2605\u2605 \u800c\u7b2c\u4e00\u7248\u7684\u590d\u73b0\u9875\u91cc\u90a3\u4e2a `.stream-message-content`\n *      \u2605\u2605   \u662f\u6211**\u81ea\u5df1\u7f16\u7684** \u21d2 \u2605\u2605 \u590d\u73b0\u9875\u9a8c\u8bc1\u7684\u662f**\u81c6\u9020 DOM**\uff0c\u2605 \u4e0d\u662f\u5ba2\u6237\u7aef\u771f\u5b9e\u7ed3\u6784\uff09\u3002\n *      \u2605\u2605   \u21d2 \u771f\u5b9e DOM \u94fe\uff08\u2605 \u6765\u81ea archon page chunk \u7684 JSX\uff0c\u9010\u5c42\u8fd8\u539f\uff09\uff1a\n *      \u2605\u2605     .message-container-viewport\n *      \u2605\u2605       \u2514 .mavis-chat-content-width .message-container-chat-content  (max-w-768px)\n *      \u2605\u2605           \u2514 div.w-full.message-animate-in.group.relative  [data-testid=message-item]\n *      \u2605\u2605               \u2514 div.desktop-text-chat-body.text-sm.space-y-4\n *      \u2605\u2605                   \u2514 div.matrix-markdown.message-content.flex-1.relative\n *      \u2605\u2605                                    .max-w-full.overflow-hidden.text-pretty\n *      \u2605\u2605                       \u2514 .mavis-chat-markdown-flow  (display:grid; minmax(0,1fr))\n *      \u2605\u2605   \u2605\u2605 **\u6ce8\u610f**\uff1a\u2605 `.message-content` \u4e0e `.matrix-markdown` \u662f\u3010\u540c\u4e00\u4e2a\u5143\u7d20\u3011\n *      \u2605\u2605   \uff08\u2605 JSX: `ty.mQ` \u628a className \u62fc\u6210 `matrix-markdown ${className}`\uff09\n *\n *   \u2605\u2605 \u9519\u8bef\u4e8c\uff08\u2605 \u4fee\u6cd5\u9009\u9519\uff09\uff1a\u2605 \u7b2c\u4e00\u7248\u7684 P1\uff08\u201c\u8ba9\u5144\u5f1f\u53ef\u6536\u7f29\u201d\uff09**\u5355\u72ec\u7528\u65f6\u6321\u4e0d\u4f4f\u584c\u9677**\u3002\n *      \u2605\u2605 \u7528**\u771f\u5b9e\u7c7b\u540d + \u771f\u5b9e CSS** \u590d\u73b0\u5b9e\u6d4b\uff08\u2605 \u5144\u5f1f flex:none\u3001\u5bbd\u5ea6 716px\uff09\uff1a\n *      \u2605\u2605   \u65e0\u8865\u4e01 \u21d2 .message-content \u5bbd **24px**\u3001li \u9ad8 **576/432/120**\uff08\u2605 \u9010\u5b57\u65ad\u884c\uff09\n *      \u2605\u2605   \u53ea\u52a0 P1\uff08\u5144\u5f1f\u53ef\u6536\u7f29\uff09\u21d2 \u5bbd\u4ecd **40px**\u3001li \u9ad8\u4ecd **288/336/120** \u21d2 \u2605\u2605 **P1 \u65e0\u6548**\n *      \u2605\u2605   \u52a0 min-width \u5730\u677f \u21d2 \u5bbd\u7a33\u5b9a\u5728\u5730\u677f\u503c\u3001li \u9ad8\u5c01\u9876 **72px** \u21d2 \u2605\u2605 **\u5730\u677f\u624d\u662f\u627f\u91cd\u9879**\n *      \u2605\u2605 \uff08\u2605 \u7b2c\u4e00\u7248\u4e4b\u6240\u4ee5\u6d4b\u51fa\u300cP1 \u6216 P2 \u4efb\u4e00\u5373\u53ef\u300d\uff0c\u2605 \u662f\u56e0\u4e3a**\u81c6\u9020 DOM \u91cc\u7684\u5144\u5f1f\u6070\u597d\u53ef\u6536\u7f29**\u3002\uff09\n *\n * \u2605 \u73b0\u8c61\uff1amarkdown \u5217\u8868\u88ab\u538b\u6210\u300c\u4e00\u5217\u5355\u5b57\u7b26\u300d\uff0c\u4e14\u6bcf\u4e2a bullet \u9010\u7ea7\u53f3\u79fb\uff1b\n *         \u800c\u540c\u4e00\u6d88\u606f\u91cc\u7684\u666e\u901a\u6bb5\u843d\uff08PROJECT: / GOAL:\uff09\u770b\u7740\u6b63\u5e38\u3002\n *\n * \u2605 \u673a\u5236\uff08\u2605 \u771f\u5b9e CSS + \u771f\u5b9e\u7c7b\u540d\u5b9e\u6d4b\uff09\uff1a\n *   1) .message-content \u540c\u65f6\u662f `.matrix-markdown`\uff08\u2605 grid \u5bb9\u5668\uff1adisplay:grid; grid-template-columns:1fr\uff09\n *      \u4e14\u5e26 tailwind `flex-1` + `overflow-hidden`\n *      \u21d2 \u2605 \u4f5c\u4e3a flex item \u65f6**\u81ea\u52a8\u6700\u5c0f\u5c3a\u5bf8\u88ab overflow\u2260visible \u7f6e 0**\n *      \u21d2 \u2605 \u53ef\u4ee5\u88ab\u540c\u884c\u7684\u67d0\u6761 `flex:none` \u5144\u5f1f\u6324\u5230 ~24px\uff1b\n *   2) .matrix-markdown div/li/p/span { overflow-wrap:break-word; word-break:break-word }\n *      \u2014\u2014 \u5bb9\u5668\u5bbd\u53ea\u5269 1~2 \u5b57\u7b26\u65f6 \u21d2 **\u9010\u5b57\u65ad\u884c**\uff08\u2605 \u8fd9\u5c31\u662f\u300c\u4e00\u5217\u5355\u5b57\u7b26\u300d\u7684\u76f4\u63a5\u673a\u5236\uff09\uff1b\n *   3) .matrix-markdown :is(ol,ul){padding-inline-start:var(--md-line-height-body)}\n *      + \u5d4c\u5957\u5217\u8868\u9010\u7ea7\u53e0\u52a0 \u21d2 \u2605 **bullet \u9010\u7ea7\u53f3\u79fb**\u3002\n *\n * \u2605 \u9608\u503c\uff08\u2605 \u771f\u5b9e\u7c7b\u540d + \u771f\u5b9e CSS \u5b9e\u6d4b\uff0c\u2605 \u626b\u5144\u5f1f\u5bbd\u5ea6 0\u2192716px\uff09\uff1a\n *   .message-content \u5b9e\u5bbd \u2272 **340px** \u21d2 \u5217\u8868\u9879\u5f00\u59cb\u6362\u884c\uff08li 48px \u21d2 72px \u21d2 120px \u21d2 288px\uff09\n *   \u65e0\u5730\u677f\u65f6\u6700\u574f\uff1a\u5b9e\u5bbd **24px**\u3001li \u9ad8 **576/432/120**\uff08\u2605 \u9644\u56fe\u90a3\u4e2a\u5f62\u6001\uff09\n *   \u21d2 \u300c\u67d0\u4e9b\u65f6\u523b\u300d= \u5f53\u65f6\u7684\u89c6\u53e3\u5bbd\u5ea6 / \u540c\u884c\u5144\u5f1f\u5e03\u5c40\u51b3\u5b9a\uff0c\u2605 **\u4e0e\u7f51\u5173\u903b\u8f91\u5206\u652f\u65e0\u5173**\u3002\n *\n * \u2605 \u5730\u677f\u503c\u5b9e\u6d4b\uff08\u2605 \u626b 0/80/100/120/140/160/180/200px\uff0c\u2605 \u5144\u5f1f 716px \u6700\u574f\u6324\u538b\uff09\uff1a\n *   \u5730\u677f 0   \u21d2 \u5b9e\u5bbd 24px  \u3001maxLi 576px\uff08\u2605 \u584c\u9677\uff09\n *   \u5730\u677f 80  \u21d2 \u5b9e\u5bbd 80px \u3001maxLi 144px\uff08\u2605 \u4ecd\u584c\uff09\n *   \u5730\u677f 120 \u21d2 \u5b9e\u5bbd 120px\u3001maxLi 96px \uff08\u2605 \u4ecd\u584c\uff09\n *   \u5730\u677f 140 \u21d2 \u5b9e\u5bbd 140px\u3001maxLi **72px**\uff08\u2605 \u2605 \u4e0d\u518d\u584c\u9677\uff09\n *   \u5730\u677f \u2265140 \u5168\u90e8\u4e00\u81f4\uff08maxLi 72px\uff09\u21d2 \u2605 **140px \u662f\u4e34\u754c\u503c**\n *   \u21d2 \u672c\u6587\u4ef6\u53d6 **280px**\uff1a\u2605 \u224818 \u4e2a\u4e2d\u6587\u5b57\uff0c\u2605 \u7559\u8db3\u4f59\u91cf\u4e14\u4e0d\u6324\u5360\u8fc7\u591a\u6a2a\u5411\u7a7a\u95f4\u3002\n *\n * \u2605 \u7559\u4e00\u6cd5\u6d88\u878d\uff08\u2605 \u771f\u5b9e\u7c7b\u540d + \u771f\u5b9e CSS\uff0c\u2605 \u5144\u5f1f\u5bbd\u5ea6\u626b\u63cf\u5168\u6863\uff09\uff1a\n *   \u62ff\u6389\u300c\u6b63\u6587\u5730\u677f\u300d\u21d2 \u5b9e\u5bbd\u6389\u5230 24px\u3001li \u9ad8 576/432 \u21d2 \u2605 \u584c\u9677\u590d\u73b0\n *   \u53ea\u7559\u300c\u5144\u5f1f\u53ef\u6536\u7f29\u300d\u21d2 \u5b9e\u5bbd\u4ecd 40px\u3001li \u9ad8\u4ecd 288 \u21d2 \u2605 \u627f\u91cd\u9879\u662f\u5730\u677f\u3001\u2605 \u4e0d\u662f\u5144\u5f1f\n *   \u21d2 \u2605 **\u6700\u5c0f\u4fee\u590d = \u7ed9 `.message-content` \u52a0 min-width \u5730\u677f**\uff08\u2605 \u5144\u5f1f\u9879\u662f\u53ef\u9009\u52a0\u56fa\uff09\n * ============================================================================\n */\n\n/* \u2500\u2500 \u4e3b\u4fee\uff08\u627f\u91cd\uff09\uff1a\u6b63\u6587\u5bb9\u5668\u7ed9\u5bbd\u5ea6\u5730\u677f\uff08\u224818 \u4e2a\u4e2d\u6587\u5b57\uff09 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   \u2605 \u76ee\u6807\u7c7b\u540d `.message-content` = \u2605 **\u771f\u5b9e\u5b58\u5728**\uff08\u2605 \u5168 asar \u626b\u63cf\uff1a\u2605 DOM \u4fa7 1 \u5904 JSX\uff09\n   \u2605 \u5b9e\u6d4b\uff1a\u5730\u677f \u2265140px \u21d2 li \u9ad8\u5c01\u9876 72px\uff08\u2605 \u6b63\u5e38\u7684\u4e24\u884c\u5d4c\u5957\u9879\uff09\uff0c\u2605 \u4e0d\u518d\u9010\u5b57\u65ad\u884c\u3002\n   \u2605 \u5b9e\u73b0\u4e8c\u9009\u4e00\uff1a\n   \u2605   \u2460 \u6837\u5f0f\u8868\u52a0\u672c\u6761\uff08\u2605 \u5ba2\u6237\u7aef\u65e0\u81ea\u5b9a\u4e49 CSS \u6ce8\u5165\u5165\u53e3 \u21d2 \u2605 \u9700\u8981\u5ba2\u6237\u7aef\u4ed3\u6539\u6e90\u7801\uff09\uff1b\n   \u2605   \u2461 \u2605 tailwind \u4fa7\u7ed9 `.message-content` \u52a0\u7c7b `min-w-[280px]`\n   \u2605      \uff08\u2605 `.message-content` \u5728\u5ba2\u6237\u7aef\u7684 tailwind \u5de5\u5177\u7c7b\u4e32\u662f\n   \u2605       `flex-1 relative max-w-full overflow-hidden text-pretty` \u21d2 \u2605 \u52a0\u7c7b\u5373\u53ef\uff09\u3002\n   \u2605 \u2605 \u843d\u5730\u5f62\u6001\u7531\u5ba2\u6237\u7aef\u4ed3\u51b3\u5b9a\uff1a\u2605 \u52a0\u7c7b\u6700\u7701\u4e8b\uff08\u2605 \u4e0d\u7528\u7ef4\u62a4\u989d\u5916\u6837\u5f0f\u8868\uff09\u3002 */\n.message-content {\n  min-width: 280px;\n}\n\n/* \u2500\u2500 \u52a0\u56fa\uff08\u53ef\u9009\uff09\uff1a\u8ba9\u6324\u538b\u6b63\u6587\u7684\u90a3\u6761 flex:none \u5144\u5f1f\u53ef\u6536\u7f29 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   \u2605 \u2605 \u5355\u72ec**\u4e0d\u8db3\u4ee5**\u6321\u4f4f\u584c\u9677\uff08\u2605 \u5b9e\u6d4b\uff1a\u53ea\u52a0\u672c\u6761 \u21d2 \u5b9e\u5bbd\u4ecd 40px\u3001li \u9ad8\u4ecd 288\uff09\u2605\u2605\n   \u2605 \u4f46\u5b83\u80fd\u8ba9\u6b63\u6587\u5728**\u5144\u5f1f\u53ef\u538b\u7f29**\u65f6\u62ff\u56de\u66f4\u591a\u7a7a\u95f4 \u21d2 \u2605 \u4f5c\u4e3a\u52a0\u56fa\u4fdd\u7559\u3002\n   \u2605 \u2605 \u6ce8\u610f\uff1a\u2605 \u8fd9\u91cc**\u4e0d\u5199\u6b7b\u7c7b\u540d**\uff08\u2605 \u5144\u5f1f\u8eab\u4efd\u5c1a\u672a\u5728\u771f\u5b9e DOM \u4e2d\u5b9a\u4f4d\u5230\uff0c\n   \u2605 \u2605 \u81c6\u9020\u7c7b\u540d\u4f1a\u53d8\u6210\u300c\u6c38\u8fdc\u5339\u914d\u4e0d\u5230\u7684\u6b7b\u89c4\u5219\u300d\u2014\u2014\u2605 \u7b2c\u4e00\u7248\u5c31\u8e29\u4e86\u8fd9\u4e2a\u5751\uff09\u3002\n   \u2605 \u5b9a\u4f4d\u5230\u4e4b\u540e\uff0c\u628a\u4e0b\u9762\u7684\u901a\u914d\u6362\u6210\u7cbe\u786e\u9009\u62e9\u5668\u5373\u53ef\uff08\u2605 \u7ed3\u6784\u4e0e\u7b2c\u4e00\u7248 P1 \u76f8\u540c\uff0c\n   \u2605 \u2605 \u4f46**\u5fc5\u987b\u5148\u786e\u8ba4\u90a3\u4e2a\u7c7b\u5728 DOM \u91cc\u771f\u7684\u5b58\u5728**\uff09\u3002 */\n.message-content ~ * {\n  flex: 0 1 auto;\n  min-width: 0;\n}\n\n/* \u2500\u2500 \u52a0\u56fa\uff08\u53ef\u9009\uff09\uff1amarkdown \u6d41\u7684 grid item \u8865 min-width:0 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   \u2605 .mavis-chat-markdown-flow \u662f grid \u5bb9\u5668\uff08grid-template-columns:minmax(0,1fr)\uff09\uff0c\n   \u2605 \u5176\u76f4\u63a5\u5b50\u9879\u6309 grid \u89c4\u5219\u5df2\u6709 min-width:auto \u7684\u81ea\u52a8\u6700\u5c0f\u5c3a\u5bf8 \u21d2 \u2605 \u8865 0 \u66f4\u7a33\u3002\n   \u2605 \u2605 \u6ce8\uff1a\u2605 `.matrix-markdown > *{min-width:0}` \u5ba2\u6237\u7aef**\u5df2\u7ecf\u6709**\uff08\u2605 \u771f\u5b9e CSS \u5b9e\u6d4b\uff09\uff0c\n   \u2605 \u2605 \u4f46 `.mavis-chat-markdown-flow` \u662f `.matrix-markdown` \u7684**\u5b50**\u5bb9\u5668 \u21d2 \u2605 \u8fd9\u4e00\u5c42\u4ecd\u9700\u8981\u3002 */\n.mavis-chat-markdown-flow > * {\n  min-width: 0;\n}\n\n/* \u2500\u2500 \u52a0\u56fa\uff08\u53ef\u9009\uff09\uff1a\u5217\u8868\u9879\u65ad\u884c\u5c5e\u6027 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   \u2605 `word-break:break-word` \u5df2\u5e9f\u5f03\uff0c\u2605 \u4e14\u4f1a\u8ba9 min-content \u53c2\u4e0e\u584c\u9677\u8ba1\u7b97\u3002\n   \u2605 \u2605 \u6ce8\uff1a\u2605 \u771f\u5b9e CSS \u5b9e\u6d4b `.matrix-markdown code,div,li,p,pre,span{overflow-wrap:break-word;\n   \u2605 \u2605   word-break:break-word}` \u21d2 \u2605 \u8fd9\u6761\u662f**\u8986\u76d6**\u5ba2\u6237\u7aef\u65e2\u6709\u503c\u3002 */\n.matrix-markdown li {\n  word-break: normal;\n  overflow-wrap: break-word;\n}\n";
const REAL_CSS_LEN = 78138;
function buildDOM(patched, sideW){
  document.body.innerHTML = `
  <div id="panel"><h1>真实 CSS / 真实类名 · 塌陷复现与补丁消融</h1><div id="rows"></div></div>
  <div class="message-container-viewport" id="vp">
    <div class="mavis-chat-content-width message-container-chat-content">
      <div class="w-full message-animate-in group relative">
        <div class="row">
          <div class="matrix-markdown message-content flex-1 relative max-w-full overflow-hidden text-pretty" id="mc">
            <div class="mavis-chat-markdown-flow">
              <p>PROJECT: 组织核心网关<br>GOAL: 让复杂表达更人性化</p>
              <ul>
                <li>第一条：这是一段用来测量宽度的中文列表项文本内容</li>
                <li>第二条：嵌套测试<ul><li>嵌套子项甲</li><li>嵌套子项乙</li></ul></li>
                <li>第三条：普通列表项</li>
              </ul>
            </div>
          </div>
          <div class="side" id="side" style="width:${sideW}px">右侧固定宽面板（flex:none）</div>
        </div>
      </div>
    </div>
  </div>`;
  if(patched){
    const st=document.createElement('style');
    st.textContent = PATCH;
    document.head.appendChild(st);
  }
}
function measure(){
  const mc=document.getElementById('mc');
  const lis=[...document.querySelectorAll('.matrix-markdown li')];
  const hs=lis.map(li=>Math.round(li.getBoundingClientRect().height));
  return { mcW: Math.round(mc.getBoundingClientRect().width), maxLi: Math.max(...hs), hs };
}
function run(){
  const SIDE=[0,300,400,450,500,520,560,600,640,680,716];
  const out=[];
  for(const patched of [false,true]){
    for(const w of SIDE){
      buildDOM(patched,w);
      const r=measure();
      out.push({p:patched?'ON':'OFF', sideW:w, mcW:r.mcW, maxLi:r.maxLi, hs:r.hs.join('/')});
    }
  }
  const rows = out.map(o=>{
    const cls = o.maxLi>100?'bad':(o.maxLi>72?'mid':'ok');
    return `<tr><td>${o.p}</td><td>${o.sideW}</td><td>${o.mcW}</td><td class="${cls}">${o.maxLi}</td><td>${o.hs}</td></tr>`;
  }).join('');
  document.getElementById('rows').innerHTML =
    `<div style="color:#8a9;margin-bottom:6px">内嵌真实 CSS ${REAL_CSS_LEN} 字节 / 419 规则 ★ li 高 &gt;100px = 塌陷</div>
     <table><tr><th>补丁</th><th>兄弟宽</th><th>正文宽</th><th>maxLi</th><th>各 li 高</th></tr>${rows}</table>
     <div style="margin-top:8px;color:#8a9">★ OFF + 兄弟 520~716 ⇒ 正文宽掉到 24~180px、maxLi 120~576px ⇒ <span class="bad">逐字断行（附图形态）</span><br>
     ★ ON ⇒ 正文宽恒 ≥280px、maxLi 恒 72px（正常两行嵌套项）⇒ <span class="ok">不塌陷</span></div>`;
}
run();
window.__run = run;
</script>
