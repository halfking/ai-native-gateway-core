# ============================================================================
# 指标收集要求
# ============================================================================
# 以下指标需要在应用代码中暴露（Prometheus格式）：
#
# 1. 统计对账：
#   - stats_minute_rollup_last_resweep_timestamp
#   - stats_minute_client_count / stats_minute_rollup_count
#   - request_stats_minute_cost_usd_zero_count / request_stats_minute_total_count
#   - stats_event_inbox_partition_errors_total
#
# 2. 行情同步：
#   - market_price_sync_last_success_timestamp
#   - market_price_reference_sync_rejected_rows
#   - market_price_fx_rate_update_timestamp
#   - market_price_sync_redline_violation_total
#
# 3. 探测恢复：
#   - credential_health_status / credential_last_probe_attempt_timestamp
#   - credential_probe_fallback_all_failed_total / credential_probe_fallback_attempts_total
#   - balance_floor_guard_warn_gate_throttled_total
#   - balance_floor_guard_rearm_errors_total
#
# 4. 营销活动：
#   - promotion_campaigns_granted_credits / promotion_campaigns_total_budget_credits
#   - promotion_redemption_failures_total / promotion_redemption_attempts_total
#   - promotion_discount_calculation_errors_total
#   - promotion_redemptions_credits_granted_sum / credit_ledger_campaign_credits_sum
#
# 5. 定价版本化：
#   - model_price_versions_last_sync_timestamp
#   - model_price_versions_current_period_violations
#   - model_price_versions_period_gaps_total
#
# 6. 免费模型：
#   - omnifree_seed_errors_total
#   - freediscovery_last_scan_timestamp
#   - probe_success{target="freellmapi:3001"}
