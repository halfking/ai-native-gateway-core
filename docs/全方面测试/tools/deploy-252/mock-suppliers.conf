# mock-suppliers.conf — Nginx 负载均衡配置 for mock suppliers
# 挂载到现有 nginx 的 /etc/nginx/conf.d/ 目录
#
# upstream: 60 个 mock supplier 实例 (19080-19139)
# 监听路径: /mock/v1/*

upstream mock_suppliers {
    least_conn;

    # Group A (ports 19080-19084)
    server 127.0.0.1:19080 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:19081 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:19082 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:19083 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:19084 max_fails=3 fail_timeout=10s;

