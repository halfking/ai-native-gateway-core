<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型价格可视化分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .header .subtitle {
            opacity: 0.9;
            font-size: 16px;
        }
        .content {
            padding: 40px;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .summary-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }
        .summary-card .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .summary-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        .summary-card .unit {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }
        .chart-container {
            margin-bottom: 40px;
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
        }
        .chart-container h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 20px;
        }
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background: #f5f7fa;
            font-weight: 600;
            color: #666;
            font-size: 14px;
        }
        td {
            font-size: 14px;
        }
        .tier-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .tier-free { background: #e3f2fd; color: #1976d2; }
        .tier-basic { background: #f3e5f5; color: #7b1fa2; }
        .tier-standard { background: #e8f5e9; color: #388e3c; }
        .tier-premium { background: #fff3e0; color: #f57c00; }
        .tier-enterprise { background: #fce4ec; color: #c2185b; }
        .model-name {
            font-weight: 500;
            color: #333;
        }
        .vendor {
            color: #666;
            font-size: 13px;
        }
        .price {
            font-family: "Monaco", "Courier New", monospace;
            color: #1976d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 模型价格可视化分析</h1>
            <div class="subtitle">基于原厂标准价格的内部结算体系 | 生成时间: 2026-11-17</div>
        </div>

        <div class="content">
            <!-- 摘要卡片 -->
            <div class="summary">
                <div class="summary-card">
                    <div class="label">基准模型</div>
                    <div class="value">minimax-m3</div>
                    <div class="unit">MiniMax</div>
                </div>
                <div class="summary-card">
                    <div class="label">基准价格</div>
                    <div class="value">$1.50</div>
                    <div class="unit">per 1M tokens</div>
                </div>
                <div class="summary-card">
                    <div class="label">内部基数</div>
                    <div class="value">100</div>
                    <div class="unit">credits</div>
                </div>
                <div class="summary-card">
                    <div class="label">价格档位</div>
                    <div class="value">5</div>
                    <div class="unit">个档位</div>
                </div>
                <div class="summary-card">
                    <div class="label">覆盖模型</div>
                    <div class="value">16</div>
                    <div class="unit">个模型</div>
                </div>
                <div class="summary-card">
                    <div class="label">价格跨度</div>
                    <div class="value">40x</div>
                    <div class="unit">倍</div>
                </div>
            </div>

            <!-- 图表1: 相对价格对比 -->
            <div class="chart-container">
                <h2>📊 模型相对价格对比(按内部结算价)</h2>
                <div class="chart-wrapper">
                    <canvas id="relativeChart"></canvas>
                </div>
            </div>

            <!-- 图表2: 档位分布 -->
            <div class="chart-container">
                <h2>📈 档位分布与模型数量</h2>
                <div class="chart-wrapper">
                    <canvas id="tierChart"></canvas>
                </div>
            </div>

            <!-- 详细表格 -->
            <div class="chart-container">
                <h2>📋 完整价格清单</h2>
                <table>
                    <thead>
                        <tr>
                            <th>模型</th>
                            <th>厂商</th>
                            <th>输入价格</th>
                            <th>输出价格</th>
                            <th>总价</th>
                            <th>相对基准</th>
                            <th>档位</th>
                        </tr>
                    </thead>
                    <tbody id="modelTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 模型数据
        const models = [
            { name: "minimax-m3", vendor: "minimax", input: 0.3, output: 1.2, relative: 100, tier: "free" },
            { name: "minimax-m2", vendor: "minimax", input: 0.3, output: 1.2, relative: 100, tier: "free" },
            { name: "minimax-m2.1", vendor: "minimax", input: 0.3, output: 1.2, relative: 100, tier: "free" },
            { name: "minimax-m2.5", vendor: "minimax", input: 0.3, output: 1.2, relative: 100, tier: "free" },
            { name: "minimax-m2.7", vendor: "minimax", input: 0.3, output: 1.2, relative: 100, tier: "free" },
            { name: "minimax-m2.5-highspeed", vendor: "minimax", input: 0.6, output: 2.4, relative: 200, tier: "basic" },
            { name: "minimax-m2.7-highspeed", vendor: "minimax", input: 0.6, output: 2.4, relative: 200, tier: "basic" },
            { name: "claude-haiku-4-5", vendor: "anthropic", input: 1.0, output: 5.0, relative: 400, tier: "basic" },
            { name: "gpt-5.3-codex", vendor: "openai", input: 1.75, output: 14.0, relative: 1050, tier: "standard" },
            { name: "claude-sonnet-4-5", vendor: "anthropic", input: 3.0, output: 15.0, relative: 1200, tier: "standard" },
            { name: "claude-sonnet-4-6", vendor: "anthropic", input: 3.0, output: 15.0, relative: 1200, tier: "standard" },
            { name: "claude-opus-4-5", vendor: "anthropic", input: 5.0, output: 25.0, relative: 2000, tier: "premium" },
            { name: "claude-opus-4-6", vendor: "anthropic", input: 5.0, output: 25.0, relative: 2000, tier: "premium" },
            { name: "claude-opus-4-7", vendor: "anthropic", input: 5.0, output: 25.0, relative: 2000, tier: "premium" },
            { name: "claude-opus-4-8", vendor: "anthropic", input: 5.0, output: 25.0, relative: 2000, tier: "premium" },
            { name: "claude-fable-5", vendor: "anthropic", input: 10.0, output: 50.0, relative: 4000, tier: "enterprise" }
        ];

        // 档位颜色
        const tierColors = {
            free: '#2196F3',
            basic: '#9C27B0',
            standard: '#4CAF50',
            premium: '#FF9800',
            enterprise: '#E91E63'
        };

        // 图表1: 相对价格对比
        const relativeCtx = document.getElementById('relativeChart').getContext('2d');
        new Chart(relativeCtx, {
            type: 'bar',
            data: {
                labels: models.map(m => m.name),
                datasets: [{
                    label: '相对价格(基准=100)',
                    data: models.map(m => m.relative),
                    backgroundColor: models.map(m => tierColors[m.tier]),
                    borderColor: models.map(m => tierColors[m.tier]),
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const model = models[context.dataIndex];
                                return [
                                    `相对价格: ${model.relative}`,
                                    `原厂价: $${model.input}/$${model.output}`,
                                    `档位: ${model.tier}`
                                ];
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: '相对价格(credits)'
                        }
                    }
                }
            }
        });

        // 图表2: 档位分布
        const tierCounts = models.reduce((acc, m) => {
            acc[m.tier] = (acc[m.tier] || 0) + 1;
            return acc;
        }, {});

        const tierCtx = document.getElementById('tierChart').getContext('2d');
        new Chart(tierCtx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(tierCounts).map(t => 
                    t.charAt(0).toUpperCase() + t.slice(1)
                ),
                datasets: [{
                    data: Object.values(tierCounts),
                    backgroundColor: Object.keys(tierCounts).map(t => tierColors[t]),
                    borderWidth: 3,
                    borderColor: '#fff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percentage = ((context.parsed / total) * 100).toFixed(1);
                                return `${context.label}: ${context.parsed} 模型 (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });

        // 填充表格
        const tbody = document.getElementById('modelTable');
        models.forEach(model => {
            const row = tbody.insertRow();
            row.innerHTML = `
                <td><span class="model-name">${model.name}</span></td>
                <td><span class="vendor">${model.vendor}</span></td>
                <td class="price">$${model.input.toFixed(2)}</td>
                <td class="price">$${model.output.toFixed(2)}</td>
                <td class="price">$${(model.input + model.output).toFixed(2)}</td>
                <td><strong>${model.relative}</strong></td>
                <td><span class="tier-badge tier-${model.tier}">${model.tier}</span></td>
            `;
        });
    </script>
</body>
</html>
