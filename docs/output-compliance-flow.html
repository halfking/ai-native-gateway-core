<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>输出合规检测 - 流程图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 40px;
            font-size: 16px;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .node:hover rect, .node:hover circle {
            filter: brightness(1.1);
            stroke-width: 3;
        }
        .legend {
            margin-top: 30px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-box {
            width: 40px;
            height: 24px;
            border-radius: 4px;
            border: 2px solid #2d3748;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>输出合规检测流程</h1>
        <p class="subtitle">Output Compliance Check Flow - LLM Gateway R1.13</p>
        
        <svg viewBox="0 0 1200 1400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#4a5568" />
                </marker>
                <filter id="shadow">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
                </filter>
            </defs>
            
            <!-- Entry -->
            <g class="node">
                <rect x="450" y="20" width="300" height="60" rx="30" fill="#48bb78" filter="url(#shadow)"/>
                <text x="600" y="55" text-anchor="middle" fill="white" font-size="18" font-weight="bold">LLM 响应完成</text>
            </g>
            <line x1="600" y1="80" x2="600" y2="120" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- Pipeline Hook -->
            <g class="node">
                <rect x="450" y="120" width="300" height="80" rx="8" fill="#4299e1" filter="url(#shadow)"/>
                <text x="600" y="150" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Output Compliance Hook</text>
                <text x="600" y="175" text-anchor="middle" fill="white" font-size="13">(after_completion)</text>
            </g>
            <line x1="600" y1="200" x2="600" y2="240" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- Load Policy -->
            <g class="node">
                <rect x="450" y="240" width="300" height="60" rx="8" fill="#ed8936" filter="url(#shadow)"/>
                <text x="600" y="275" text-anchor="middle" fill="white" font-size="15" font-weight="bold">加载策略 (Policy)</text>
            </g>
            <line x1="600" y1="300" x2="600" y2="340" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- Detection Engine -->
            <g class="node">
                <rect x="350" y="340" width="500" height="100" rx="8" fill="#805ad5" filter="url(#shadow)"/>
                <text x="600" y="370" text-anchor="middle" fill="white" font-size="16" font-weight="bold">检测引擎并行执行</text>
            </g>
            
            <!-- Detectors -->
            <g class="node">
                <rect x="70" y="470" width="140" height="60" rx="6" fill="#9f7aea" filter="url(#shadow)"/>
                <text x="140" y="505" text-anchor="middle" fill="white" font-size="13">PII 检测</text>
            </g>
            <line x1="450" y1="390" x2="140" y2="470" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <g class="node">
                <rect x="230" y="470" width="140" height="60" rx="6" fill="#9f7aea" filter="url(#shadow)"/>
                <text x="300" y="505" text-anchor="middle" fill="white" font-size="13">Toxicity 检测</text>
            </g>
            <line x1="500" y1="390" x2="300" y2="470" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <g class="node">
                <rect x="390" y="470" width="140" height="60" rx="6" fill="#9f7aea" filter="url(#shadow)"/>
                <text x="460" y="505" text-anchor="middle" fill="white" font-size="13">Secrets 检测</text>
            </g>
            <line x1="550" y1="390" x2="460" y2="470" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <g class="node">
                <rect x="550" y="470" width="140" height="60" rx="6" fill="#9f7aea" filter="url(#shadow)"/>
                <text x="620" y="505" text-anchor="middle" fill="white" font-size="13">Internal IP</text>
            </g>
            <line x1="630" y1="390" x2="620" y2="470" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <g class="node">
                <rect x="710" y="470" width="140" height="60" rx="6" fill="#9f7aea" filter="url(#shadow)"/>
                <text x="780" y="505" text-anchor="middle" fill="white" font-size="13">Bias (LLM)</text>
            </g>
            <line x1="680" y1="390" x2="780" y2="470" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <g class="node">
                <rect x="870" y="470" width="160" height="60" rx="6" fill="#9f7aea" filter="url(#shadow)"/>
                <text x="950" y="505" text-anchor="middle" fill="white" font-size="13">Hallucination (LLM)</text>
            </g>
            <line x1="750" y1="390" x2="950" y2="470" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- Merge Results -->
            <line x1="140" y1="530" x2="600" y2="600" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            <line x1="300" y1="530" x2="600" y2="600" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            <line x1="460" y1="530" x2="600" y2="600" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            <line x1="620" y1="530" x2="600" y2="600" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            <line x1="780" y1="530" x2="600" y2="600" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            <line x1="950" y1="530" x2="600" y2="600" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <g class="node">
                <rect x="450" y="600" width="300" height="60" rx="8" fill="#38b2ac" filter="url(#shadow)"/>
                <text x="600" y="635" text-anchor="middle" fill="white" font-size="15" font-weight="bold">聚合检测结果 (Issues)</text>
            </g>
            <line x1="600" y1="660" x2="600" y2="700" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- Exception Check -->
            <g class="node">
                <rect x="450" y="700" width="300" height="80" rx="8" fill="#f6ad55" filter="url(#shadow)"/>
                <text x="600" y="730" text-anchor="middle" fill="white" font-size="15" font-weight="bold">例外规则匹配</text>
                <text x="600" y="755" text-anchor="middle" fill="white" font-size="12">(owner_user / role / app)</text>
            </g>
            
            <!-- Exception Matched Branch -->
            <line x1="750" y1="740" x2="900" y2="740" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="825" y="730" text-anchor="middle" fill="#48bb78" font-size="13" font-weight="bold">匹配</text>
            
            <g class="node">
                <rect x="900" y="710" width="200" height="60" rx="8" fill="#48bb78" filter="url(#shadow)"/>
                <text x="1000" y="745" text-anchor="middle" fill="white" font-size="14" font-weight="bold">跳过脱敏/阻断</text>
            </g>
            <line x1="1000" y1="770" x2="1000" y2="1200" stroke="#4a5568" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
            
            <!-- No Match Continue -->
            <line x1="600" y1="780" x2="600" y2="820" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="620" y="810" text-anchor="start" fill="#e53e3e" font-size="13" font-weight="bold">未匹配</text>
            
            <!-- Action Decision -->
            <g class="node">
                <rect x="450" y="820" width="300" height="80" rx="8" fill="#4299e1" filter="url(#shadow)"/>
                <text x="600" y="850" text-anchor="middle" fill="white" font-size="15" font-weight="bold">根据策略决定动作</text>
                <text x="600" y="875" text-anchor="middle" fill="white" font-size="12">(log / warn / redact / block)</text>
            </g>
            
            <!-- Actions -->
            <line x1="500" y1="900" x2="200" y2="970" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="350" y="935" text-anchor="middle" fill="#718096" font-size="12">log/warn</text>
            
            <g class="node">
                <rect x="100" y="970" width="200" height="60" rx="8" fill="#4fd1c5" filter="url(#shadow)"/>
                <text x="200" y="1005" text-anchor="middle" fill="white" font-size="14">记录审计日志</text>
            </g>
            <line x1="200" y1="1030" x2="200" y2="1200" stroke="#4a5568" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
            
            <line x1="600" y1="900" x2="600" y2="970" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="620" y="935" text-anchor="start" fill="#718096" font-size="12">redact</text>
            
            <g class="node">
                <rect x="450" y="970" width="300" height="60" rx="8" fill="#ed8936" filter="url(#shadow)"/>
                <text x="600" y="1005" text-anchor="middle" fill="white" font-size="14">脱敏输出 (Redact)</text>
            </g>
            <line x1="600" y1="1030" x2="600" y2="1200" stroke="#4a5568" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
            
            <line x1="700" y1="900" x2="900" y2="970" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="800" y="935" text-anchor="middle" fill="#718096" font-size="12">block</text>
            
            <g class="node">
                <rect x="800" y="970" width="200" height="60" rx="8" fill="#e53e3e" filter="url(#shadow)"/>
                <text x="900" y="1005" text-anchor="middle" fill="white" font-size="14">阻断响应 (403)</text>
            </g>
            <line x1="900" y1="1030" x2="900" y2="1100" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- Block End -->
            <g class="node">
                <circle cx="900" cy="1130" r="30" fill="#c53030" filter="url(#shadow)"/>
                <text x="900" y="1140" text-anchor="middle" fill="white" font-size="16" font-weight="bold">END</text>
            </g>
            
            <!-- Post-processing -->
            <g class="node">
                <rect x="200" y="1200" width="700" height="60" rx="8" fill="#38b2ac" filter="url(#shadow)"/>
                <text x="550" y="1235" text-anchor="middle" fill="white" font-size="15" font-weight="bold">后处理：告警/复核队列/反馈</text>
            </g>
            <line x1="550" y1="1260" x2="550" y2="1300" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
            
            <!-- Return -->
            <g class="node">
                <rect x="400" y="1300" width="300" height="60" rx="30" fill="#48bb78" filter="url(#shadow)"/>
                <text x="550" y="1335" text-anchor="middle" fill="white" font-size="18" font-weight="bold">返回客户端</text>
            </g>
        </svg>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-box" style="background: #48bb78;"></div>
                <span>入口/出口</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #4299e1;"></div>
                <span>流程节点</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #805ad5;"></div>
                <span>检测引擎</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #ed8936;"></div>
                <span>策略/脱敏</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #e53e3e;"></div>
                <span>阻断</span>
            </div>
            <div class="legend-item">
                <div class="legend-box" style="background: #38b2ac;"></div>
                <span>聚合/后处理</span>
            </div>
        </div>
    </div>
</body>
</html>
