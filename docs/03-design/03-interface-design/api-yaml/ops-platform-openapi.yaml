openapi: 3.0.3
info:
  title: Operations Platform API
  description: |
    完整的运维平台后端API规范，包含5个核心模块：
    - License管理 (15个端点)
    - 故障管理 (11个端点)
    - 自动升级 (9个端点)
    - 中心运维 (9个端点)
    - VibeCoding (21个端点)
  version: 1.0.0
  contact:
    name: Operations Platform Team
    email: ops@kxpms.cn

servers:
  - url: https://ops.kxpms.cn
    description: Production Server
  - url: http://localhost:8080
    description: Local Development

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: License Admin
    description: License管理后台API (9个端点)
  - name: License Gateway
    description: License网关端API (6个端点)
  - name: Fault Management
    description: 故障管理API (11个端点)
  - name: Auto Update
    description: 自动升级API (9个端点)
  - name: Center Operations
    description: 中心运维API (9个端点)
  - name: VibeCoding Projects
    description: VibeCoding项目管理 (7个端点)
  - name: VibeCoding Sessions
    description: VibeCoding会话管理 (7个端点)
  - name: VibeCoding Reviews
    description: VibeCoding代码审查 (4个端点)

paths:
  # ==================== License Admin API ====================
  /api/admin/licenses:
    post:
      tags: [License Admin]
      summary: 创建许可证
      operationId: createLicense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, customer_name, customer_email, max_devices, subscription_tier, expires_at]
              properties:
                license_key:
                  type: string
                  example: "LIC-2026-ABC123"
                customer_name:
                  type: string
                  example: "Acme Corporation"
                customer_email:
                  type: string
                  format: email
                  example: "admin@acme.com"
                max_devices:
                  type: integer
                  minimum: 1
                  example: 10
                subscription_tier:
                  type: string
                  enum: [basic, professional, enterprise]
                  example: "enterprise"
                features:
                  type: array
                  items:
                    type: string
                  example: ["api_access", "advanced_analytics", "priority_support"]
                expires_at:
                  type: string
                  format: date-time
                  example: "2027-12-31T23:59:59Z"
      responses:
        '201':
          description: 许可证创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/License'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    
    get:
      tags: [License Admin]
      summary: 列出所有许可证
      operationId: listLicenses
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 许可证列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  licenses:
                    type: array
                    items:
                      $ref: '#/components/schemas/License'
                  total:
                    type: integer
                    example: 150
                  offset:
                    type: integer
                    example: 0
                  limit:
                    type: integer
                    example: 20
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/licenses/{key}:
    get:
      tags: [License Admin]
      summary: 获取许可证详情
      operationId: getLicense
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          example: "LIC-2026-ABC123"
      responses:
        '200':
          description: 许可证详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/License'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/licenses/{key}/revoke:
    post:
      tags: [License Admin]
      summary: 吊销许可证
      operationId: revokeLicense
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 许可证已吊销
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "license revoked"
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/licenses/{key}/devices:
    get:
      tags: [License Admin]
      summary: 列出许可证绑定的设备
      operationId: listDevices
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/licenses/{key}/devices/{hash}/deactivate:
    post:
      tags: [License Admin]
      summary: 停用设备
      operationId: deactivateDevice
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: hash
          in: path
          required: true
          schema:
            type: string
          description: 设备硬件哈希
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "设备更换"
      responses:
        '200':
          description: 设备已停用
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "device deactivated"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/offline-requests/{id}/approve:
    post:
      tags: [License Admin]
      summary: 批准离线许可证请求
      operationId: approveOfflineRequest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 离线请求ID
      responses:
        '200':
          description: 离线许可证已批准
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed_license:
                    $ref: '#/components/schemas/SignedLicense'
                  base64:
                    type: string
                    description: Base64编码的签名许可证
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== License Gateway API ====================
  /api/license/activate:
    post:
      tags: [License Gateway]
      summary: 激活许可证
      operationId: activateLicense
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
      responses:
        '200':
          description: 激活成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/license/deactivate:
    post:
      tags: [License Gateway]
      summary: 停用许可证
      operationId: deactivateLicense
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateRequest'
      responses:
        '200':
          description: 停用成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "deactivated"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/license/heartbeat:
    post:
      tags: [License Gateway]
      summary: 发送心跳
      operationId: licenseHeartbeat
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, hardware_hash]
              properties:
                license_key:
                  type: string
                hardware_hash:
                  type: string
      responses:
        '200':
          description: 心跳成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/license/validate:
    post:
      tags: [License Gateway]
      summary: 验证许可证
      operationId: validateLicense
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_key, hardware_hash]
              properties:
                license_key:
                  type: string
                hardware_hash:
                  type: string
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  signed_license:
                    $ref: '#/components/schemas/SignedLicense'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/license/offline/request:
    post:
      tags: [License Gateway]
      summary: 创建离线许可证请求
      operationId: createOfflineRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineRequest'
      responses:
        '200':
          description: 离线请求已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  request_data:
                    type: string
                    description: Base64编码的请求数据
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/license/offline/verify:
    post:
      tags: [License Gateway]
      summary: 验证离线许可证
      operationId: verifyOfflineLicense
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signed_license]
              properties:
                signed_license:
                  type: string
                  description: 签名的离线许可证
      responses:
        '200':
          description: 验证成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  license:
                    $ref: '#/components/schemas/License'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== Fault Management API ====================
  /api/admin/faults/rules:
    post:
      tags: [Fault Management]
      summary: 创建故障检测规则
      operationId: createFaultRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaultRule'
      responses:
        '201':
          description: 规则创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    
    get:
      tags: [Fault Management]
      summary: 列出所有规则
      operationId: listFaultRules
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 规则列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/FaultRule'
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/faults/rules/{id}:
    get:
      tags: [Fault Management]
      summary: 获取规则详情
      operationId: getFaultRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 规则详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultRule'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    
    put:
      tags: [Fault Management]
      summary: 更新规则
      operationId: updateFaultRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaultRule'
      responses:
        '200':
          description: 规则已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    
    delete:
      tags: [Fault Management]
      summary: 删除规则
      operationId: deleteFaultRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 规则已删除
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "rule deleted"
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/faults/events:
    get:
      tags: [Fault Management]
      summary: 列出故障事件
      operationId: listFaultEvents
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, acknowledged, resolving, resolved, ignored]
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 事件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/FaultEvent'
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/faults/events/{id}:
    get:
      tags: [Fault Management]
      summary: 获取事件详情
      operationId: getFaultEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 事件详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/faults/events/{id}/acknowledge:
    post:
      tags: [Fault Management]
      summary: 确认事件
      operationId: acknowledgeFaultEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor]
              properties:
                actor:
                  type: string
                  example: "admin@example.com"
      responses:
        '200':
          description: 事件已确认
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "event acknowledged"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/faults/events/{id}/resolve:
    post:
      tags: [Fault Management]
      summary: 解决事件
      operationId: resolveFaultEvent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor]
              properties:
                actor:
                  type: string
                  example: "admin@example.com"
      responses:
        '200':
          description: 事件已解决
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "event resolved"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/faults/stats:
    get:
      tags: [Fault Management]
      summary: 获取故障仪表盘统计
      operationId: getFaultStats
      responses:
        '200':
          description: 统计数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultDashboardStats'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/faults/reload:
    post:
      tags: [Fault Management]
      summary: 重新加载规则
      operationId: reloadFaultRules
      responses:
        '200':
          description: 规则已重新加载
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "rules reloaded"
        '500':
          $ref: '#/components/responses/InternalError'

  # ==================== Auto Update API ====================
  /api/admin/releases:
    post:
      tags: [Auto Update]
      summary: 创建发布版本
      operationId: createRelease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, build_seq, channel, title, image_tag, created_by]
              properties:
                version:
                  type: string
                  example: "v1.2.3"
                build_seq:
                  type: integer
                  example: 456
                channel:
                  type: string
                  enum: [stable, beta, canary]
                  example: "stable"
                title:
                  type: string
                  example: "Production Release v1.2.3"
                description:
                  type: string
                changelog:
                  type: string
                image_tag:
                  type: string
                  example: "registry.kxpms.cn/ops-platform:v1.2.3"
                image_digest:
                  type: string
                min_version:
                  type: string
                  example: "v1.0.0"
                mandatory:
                  type: boolean
                  default: false
                created_by:
                  type: string
                  example: "admin@example.com"
      responses:
        '201':
          description: 版本创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    
    get:
      tags: [Auto Update]
      summary: 列出发布版本
      operationId: listReleases
      parameters:
        - name: channel
          in: query
          schema:
            type: string
            enum: [stable, beta, canary]
            default: stable
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Release'
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/releases/{version}:
    get:
      tags: [Auto Update]
      summary: 获取版本详情
      operationId: getRelease
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 版本详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/releases/{version}/publish:
    post:
      tags: [Auto Update]
      summary: 发布版本
      operationId: publishRelease
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 版本已发布
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "release published"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/releases/{version}/unpublish:
    post:
      tags: [Auto Update]
      summary: 取消发布
      operationId: unpublishRelease
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 版本已取消发布
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "release unpublished"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/admin/releases/{version}/gray:
    post:
      tags: [Auto Update]
      summary: 创建灰度发布
      operationId: createGrayRelease
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase, percent]
              properties:
                phase:
                  type: string
                  enum: [canary, batch_1, batch_2, batch_3, full]
                  example: "canary"
                percent:
                  type: integer
                  minimum: 0
                  maximum: 100
                  example: 10
                selectors:
                  type: string
                  format: byte
                  description: JSON格式的选择器规则
      responses:
        '201':
          description: 灰度规则创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrayReleaseRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    
    patch:
      tags: [Auto Update]
      summary: 更新灰度阶段
      operationId: updateGrayPhase
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phase, percent]
              properties:
                phase:
                  type: string
                  enum: [canary, batch_1, batch_2, batch_3, full]
                percent:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          description: 灰度阶段已更新
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "gray phase updated"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

