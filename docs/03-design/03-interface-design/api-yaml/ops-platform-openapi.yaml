components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token认证
    
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key认证

  parameters:
    Offset:
      name: offset
      in: query
      description: 分页偏移量
      schema:
        type: integer
        minimum: 0
        default: 0
    
    Limit:
      name: limit
      in: query
      description: 分页限制
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "invalid request"
    
    Unauthorized:
      description: 未授权
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "unauthorized"
    
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "not found"
    
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "internal server error"

  schemas:
    # ==================== License Schemas ====================
    License:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        license_key:
          type: string
          example: "LIC-2026-ABC123"
        customer_name:
          type: string
          example: "Acme Corporation"
        customer_email:
          type: string
          format: email
          example: "admin@acme.com"
        max_devices:
          type: integer
          example: 10
        subscription_tier:
          type: string
          enum: [basic, professional, enterprise]
          example: "enterprise"
        features:
          type: array
          items:
            type: string
          example: ["api_access", "advanced_analytics"]
        expires_at:
          type: string
          format: date-time
          example: "2027-12-31T23:59:59Z"
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
    
    SignedLicense:
      type: object
      properties:
        data:
          type: string
          format: byte
          description: Base64编码的许可证数据
        signature:
          type: string
          format: byte
          description: Base64编码的签名
    
    Device:
      type: object
      properties:
        id:
          type: integer
          format: int64
