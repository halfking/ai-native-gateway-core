    # ==================== Fault Management Schemas ====================
    FaultRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: "高CPU使用率告警"
        description:
          type: string
          example: "当CPU使用率超过80%持续5分钟时触发"
        metric:
          type: string
          example: "cpu_percent"
        operator:
          type: string
          enum: [gte, lte, eq, ne]
          example: "gte"
        threshold:
          type: number
          format: float
          example: 80.0
        duration:
          type: string
          example: "5m"
        severity:
          type: string
          enum: [info, warning, error, critical]
          example: "warning"
        action:
          type: string
          enum: [restart, scale_up, notify, failover, auto_recover, run_script]
          example: "notify"
        action_config:
          type: string
          format: byte
          description: JSON格式的动作配置
        enabled:
          type: boolean
          default: true
        cooldown:
          type: string
          example: "10m"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
