# s60-mock-suppliers.conf — 暴露 mock suppliers 到公网 via itestu.cn subdomain
#
# 用途: S60 跨环境网络模拟测试
#  local loadtest.py → http://s60.itestu.cn/v1/chat/completions
#                                  ↓ nginx:80
#                            localhost:19900 (nginx upstream)
#                                  ↓
#                       127.0.0.1:19080-19139 (mock suppliers)
#
# 注意: s60.itestu.cn 需要 DNS 指向 115.29.212.252
# 252 本机验证：curl http://127.0.0.1:19900/healthz
# 公网客户端：只访问 http://s60.itestu.cn/healthz 和 /v1/*
# /admin/* 仅通过 127.0.0.1:19080-19139 在 252 本机管理

upstream mock_suppliers_s60 {
    least_conn;

    # Group A (ports 19080-19084)
    server 127.0.0.1:19080 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:19081 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:19082 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:19083 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:19084 max_fails=3 fail_timeout=10s;

