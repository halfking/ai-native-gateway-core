    keepalive 200;
}

server {
    listen 80;
    server_name s60.itestu.cn;

    # Only expose supplier API and health checks. Administrative controls stay local.
    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 403;
    }

    location = /healthz {
        return 200 "s60-nginx ok\n";
        add_header Content-Type text/plain;
    }

    location ^~ /v1/ {
        proxy_pass http://mock_suppliers_s60;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (longer for LLM responses)
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for streaming
        proxy_buffering off;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
    }

    location / {
        return 404;
    }
}
