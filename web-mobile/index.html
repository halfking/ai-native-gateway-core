<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- UI规范 01 §4：viewport-fit=cover 消费刘海/Home 指示条 insets -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f6f9" />
    <!--
      2026-10-19：应用图标标准（开轩 icon）。**路径必须相对**（不带前导 /），
      理由与下面 entry-switch.js 的注释同一条：生产下 index.html 由 /m/ 提供，
      相对引用解析为 /m/favicon.svg（mobile_static.go 的 ServeSPA 从
      web-mobile/dist 根取文件）；dev serve 下应用在根路径，解析为
      /favicon.svg（vite public 目录）。写成根绝对路径 /favicon.svg 则两侧
      必有一侧错——生产下会去桌面 web 根取图，移动端自己的 public 资产永远
      不会被请求，两侧图标一旦分叉，移动端会静默显示桌面图标。
      门：middleware/mobile_index_asset_path_test.go。
    -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="favicon-32-dark.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" href="favicon-180-dark.png" media="(prefers-color-scheme: dark)" />
    <!--
      部署序号（UI规范 18 §3）：构建期由 vite.config.ts 的 llmgwDeploySeq 插件
      替换占位符。取值优先 LLMGW_DEPLOY_SEQ / BUILD_SEQ（bump-version 管线
      source 出的环境变量，接既有 build_seq 不新造序号源），其次 git 短 SHA，
      都没有时 'unknown'——运行期按「不可判定」展示，不得谎报一致。
      src meta 记录序号来源（build-seq / git-sha / unknown）。dev serve 同样注入。
    -->
    <meta name="llmgw:deploy-seq" content="__LLMGW_DEPLOY_SEQ__" />
    <meta name="llmgw:deploy-seq-src" content="__LLMGW_DEPLOY_SEQ_SRC__" />
    <title>LLM Gateway</title>
    <!--
      首帧脚本（主题防 FOUC + large→/m 反向入口切换）走外部文件，不用内联
      <script>：网关 CSP 为 script-src 'self' 'unsafe-eval'，不含
      'unsafe-inline'（middleware/security_headers_mw.go），而 /m 挂载在安全头
      中间件之内，内联脚本会被直接拦掉。桌面端 web/index.html 为同一理由已把
      theme-init.js 外链化。
      src 用相对路径（不带前导 /）：生产下 index.html 由 /m/ 提供，相对引用
      解析为 /m/entry-switch.js（ServeSPA）；dev serve 下应用在根路径，解析为
      /entry-switch.js（vite public 目录）。根绝对路径在两侧必有一侧错。
    -->
    <script src="entry-switch.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
