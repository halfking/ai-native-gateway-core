name: integration-testcontainers-ci

on:
  push:
    branches: [main]
    paths:
      - "domains/**"
      - "tests/integration/**"
      - "internal/**"
      - "durable/**"
      - "db/**"
      - "bg/**"
      - "autoupdate/**"
      - "center/**"
      - "fault/**"
      - "licensing/**"
      - "vibecoding/**"
      - "sql/migrations/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration-testcontainers-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "domains/**"
      - "tests/integration/**"
      - "internal/**"
      - "durable/**"
      - "db/**"
      - "bg/**"
      - "autoupdate/**"
      - "center/**"
      - "fault/**"
      - "licensing/**"
      - "vibecoding/**"
      - "sql/migrations/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration-testcontainers-ci.yml"
  workflow_dispatch:

concurrency:
  group: integration-testcontainers-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.23"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

  integration-testcontainers:
    name: integration (testcontainers, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    services:
      docker:
        image: docker:24-dind
        options: >-
          --privileged
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      TESTCONTAINERS_HOST_OVERRIDE: "host.docker.internal"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run testcontainers-backed integration tests
        run: go test -tags=integration -timeout 30m -count=1 ./...

      - name: Upload go test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-testcontainers-logs
          path: |
            **/test-output.log
            **/*.test.log
          if-no-files-found: ignore
          retention-days: 7


  # ─────────────────────────────────────────────────────────────────────────
  # NOT WIRED: integration-gate job (removed in the round-43 self-audit)
  # ─────────────────────────────────────────────────────────────────────────
  #
  # A previous version of this file contained a third job, `integration-gate`,
  # that drove scripts/audit/run-integration-gate.sh against a disposable
  # database. The harness itself is real and works (measured locally: ./db
  # → 68 PASS / 5 SKIP / 0 FAIL). The job around it was removed because it was
  # **provably non-functional in three independent ways** — not merely
  # untested, but guaranteed to fail on its first run:
  #
  #   1. Wrong image tag. It pinned `kx-citus-pg17:offline-arm64`. The tag that
  #      actually exists in this registry is `kx-citus-pg17:13.3.0-vector-arm64`
  #      (verified with `docker image inspect` on the live local container).
  #      `offline-arm64` was inferred from a grep, never pulled.
  #   2. Wrong architecture. That image is linux/arm64. `ubuntu-latest`
  #      GitHub-hosted runners are x64. `docker run` fails with an exec-format
  #      error before PostgreSQL ever starts.
  #   3. Missing password. The container was started with POSTGRES_PASSWORD,
  #      but PG_PASSWORD was never exported to the harness. The harness then
  #      builds a passwordless DSN and dies at its own DSN precheck. Measured
  #      against the local container: a passwordless TCP DSN fails with
  #      `fe_sendauth: no password supplied`, the passworded one succeeds.
  #
  # Two smaller defects in the same block: the `services: docker:24-dind`
  # service was dead configuration (the steps drive the runner's native docker
  # CLI; no DOCKER_HOST is ever exported, so the dind daemon is never used),
  # and the failure artifact pointed at a single `/tmp/itgate-run.log` that the
  # per-package loop overwrites, so an uploaded artifact would have shown only
  # the last package's log.
  #
  # Re-adding this job is gated: see
  # docs/audit/2026-10-01-integration-gate-ci-preconditions.md
  # and sql/schema/integration_gate_test.go
  # (TestIntegrationGateCIJobStaysUnwiredUntilPreconditionsLand), which turns
  # red the moment that doc exists — i.e. it tells the next person to re-add
  # the job deliberately, instead of letting a broken one be re-added quietly.
