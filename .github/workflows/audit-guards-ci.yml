name: audit-guards-ci

# R70 新增。背景见 docs/全面审计v3/2026-10-01/39-R69-守卫执行路径接线.md
# 与 40-R70-修正与CI守卫独立job.md。
#
# 为什么需要一个**独立**的守卫 job，而不是把守卫塞进现有 workflow：
#
# 1. 触发面错配：`integration-testcontainers-ci.yml` 的 paths 过滤里**没有
#    `admin/**`**，而守卫扫描的是**全仓** Go 源码。改 admin 不会唤醒那个
#    workflow —— 守卫自然也不会跑。
# 2. 成本/信噪比：守卫只是静态分析（7 个包约 4s、无 DB、无网络），却要等
#    testcontainers 起 docker、30 分钟超时。守卫的红一旦混在重型 job 的
#    噪声里，就等于没有信号。
# 3. 独立性：守卫门红时必须单独红，不能被某个 integration job 的
#    「本来就在红」淹没。
#
# 因此这里的 paths 用 `**/*.go` —— 守卫的输入是整个 Go 树，任何一个 Go 文件
# 改动都可能让某个守卫退化（它扫的就是全仓），所以触发面必须覆盖全仓。

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "Makefile"
      - "scripts/checks/**"
      - ".github/workflows/audit-guards-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - "Makefile"
      - "scripts/checks/**"
      - ".github/workflows/audit-guards-ci.yml"
  workflow_dispatch:

concurrency:
  # 必须带 matrix.os：同名组 + cancel-in-progress 会让两个平台互相取消，
  # 于是第二个平台静默消失 —— 而「一个平台没跑」正是本 job 要防的那类静默失效。
  group: audit-guards-ci-${{ github.ref }}-${{ matrix.os }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.23"

jobs:
  guards:
    name: audit guards (${{ matrix.os }})
    # R99 补：守卫此前**只在 ubuntu 上被执行过**，而其中三个族（routeguard /
    # rowsguard / errdiscard）用 filepath.Rel 构造键、人工键表全用正斜杠 ——
    # Linux 上两者恰好相同，Windows 上永不匹配，于是三个族同时在 Windows 上
    # 失效（routeguard 覆盖下限数到 0、rowsguard 虚增 11 处违规、errdiscard
    # 棘轮双向断裂）却长期无人发现。详见
    # docs/全面审计v3/2026-10-03/199-R89DJ-*.md。
    #
    # 「一条路径坏掉时另一条路径是静默的」——补平台不是锦上添花，是让这些门
    # 在开发机（多为 Windows）上真正成立。fail-fast:false 让两个平台各自
    # 报告，一个平台的噪声不会掩盖另一个的结果。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # guards-sync / install-entrypoints / user-scripts-sync 都是 bash 脚本；
        # windows-latest 的默认 shell 是 pwsh，不显式声明会直接找不到 bash。
        # 这三个脚本内部已有 Windows 感知（install-entrypoints 里的 Windows
        # 实跑段在 Linux 上按 skip 处理），本 job 让它们在 Windows 上真正跑到。
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 登记门先行：没有新守卫被漏登记，再谈「跑守卫」才有意义。
      # 顺序不是随意的 —— guards-sync 是「守卫体系本身没腐化」的前提。
      - name: guards-sync (no unregistered *guard package)
        run: bash scripts/checks/guards-sync.sh

      - name: go build ./...
        run: go build ./...

      # 守卫本体。它们是纯静态门：无 TEST_DATABASE_URL 也能跑。
      #
      # R88 改：直接调 `make guards`，让 Makefile 的 GUARD_PACKAGES 保持唯一
      # 事实源。原先这里硬编码了 7 个包，而 Makefile 早已是 10 个——
      # metricguard / partguard / routeguard 三者从未在这个专用 job 里执行。
      # 更糟的是当时那句注释「guards-sync 已校验二者一致」是假的：
      # guards-sync.sh 只校验「磁盘→Makefile 登记」，从不看任何 CI 文件。
      # 可视性不受影响：`go test` 仍逐包打印 ok/FAIL，定位到包不成问题。
      - name: audit guards
        run: make guards

      # R37 接线：安装入口域两道门。f35823167 落地时声称「接进 maintain 的
      # static-check」属实，但那只覆盖 maintain 仓侧——本仓 CI 从未执行过
      # 它们，两道门此前只活在作者本地（「一门没人跑的守卫是文档，不是门」，
      # 本仓 guards-sync.sh 自己的标准）。两门均无网络依赖；npm 入口探针
      # 需要 node（runner 自带，脚本内 command -v 已守卫）；Windows 实跑段
      # 在 Linux 上按 skip 处理。触发面已含 scripts/checks/**。
      - name: install entrypoints gate
        run: bash scripts/checks/install-entrypoints-test.sh

      - name: user scripts sync gate
        run: bash scripts/checks/user-scripts-sync-test.sh
