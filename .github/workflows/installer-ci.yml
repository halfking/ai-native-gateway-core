name: Installer CI

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/installer-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/installer-ci.yml"
  workflow_dispatch:

concurrency:
  group: installer-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: loong64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: go build (cross-compile)
        working-directory: installer
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p ../dist-ci
          go build -o ../dist-ci/llm-gw-installer-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/llm-gw-installer/

      - name: go vet
        working-directory: installer
        run: go vet ./...

  activation-tests:
    name: activation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Run installer module tests
        working-directory: installer
        run: go test -count=1 ./...

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-activation-test-logs
          path: |
            installer/**/*.test.log
            installer/**/test-output.log
          if-no-files-found: ignore
          retention-days: 7
