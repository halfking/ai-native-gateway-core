# Dev Research 本地集成 docker-compose
#
# 用途: 研发本地集成环境 (shared host PG, dev convenience)
#       与 customer-instance 路径独立 (见 docker-compose.deploy-test.yml)
#
# 用法:
#   cp .env.dev-research.example .env.dev-research   # 首次: 复制模板
#   编辑 .env.dev-research 设置本地凭证                # dev-research 是共享 host PG
#   ./scripts/local-up.sh                              # 启动 + 等健康
#   ./scripts/local-down.sh [--volumes]                # 停止 + 清理 volumes
#
# 端口映射 (避免与本地其他 compose 冲突):
#   - 5432  postgres  (citusdata/citus:11.3.0, 与生产一致)
#   - 6379  redis
#   - 1080  llm-mock       (nginx 健康桩, 供 healthcheck 依赖)
#   - ${LLM_MOCK_HOST_PORT:-19080} llm-mock-upstream (真 OpenAI 兼容 mock, aiohttp)
#   - 8781  gateway        (v1 生产入口, cmd/gateway)
#   - 8782  gateway-v2     (v2 演示入口, cmd/gateway-v2)
#   - 10302 memora-mcp     (mock 占位, 注释说明)
#
# 所有凭证 (POSTGRES_PASSWORD / REDIS_PASSWORD / LLM_GATEWAY_CREDENTIAL_ENCRYPTION_KEY /
# LLM_GATEWAY_JWT_SECRET / LLM_GATEWAY_ADMIN_API_KEY / LLM_GATEWAY_SEED_ADMIN_PASSWORD)
# 必须从 .env.dev-research 提供 (chmod 0600, gitignore)。本文件不固化任何明文。
#
# 容器/volume 名前缀 r112_ 保留历史命名 (避免破坏已存在 volumes)。

version: "3.9"

services:
  # ─────────────────────────────────────────────────────────────────────
  # 注意: dev-research 路径复用本机 host 上的 llm-gateway-pg 共享实例
  # (host.docker.internal:5432), 数据库名固定 llm_gateway_test_dev,
  # 凭证 (POSTGRES_USER / POSTGRES_PASSWORD) 从 .env.dev-research 注入。
  # 与 customer-instance 路径 (deploy-test / one-click) 完全独立。
  # ─────────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: r112_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - r112_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # Memora MCP server (mock 占位)
  # ─────────────────────────────────────────────────────────────────────
  # TODO(r112): 替换为真实 mcp-server 镜像 (registry.internal.example.com/kx-memora-mcp:<tag>)
  # 当前用 nginx:alpine + 假 /healthz 端点保证 gateway-v2 启动不报错
  # ─────────────────────────────────────────────────────────────────────
  memora-mcp:
    image: nginx:alpine
    container_name: r112_memora_mcp
    ports:
      - "10302:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz | grep -q ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      # 注入假 healthz 响应
      - ./scripts/mocks/memora-healthz.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # LLM mock (nginx 健康桩, 供 gateway-v2 启动 healthcheck 依赖)
  # ─────────────────────────────────────────────────────────────────────
  llm-mock:
    image: nginx:alpine
    container_name: r112_llm_mock
    ports:
      - "1080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ | grep -q llm-mock-ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./scripts/mocks/llm-mock.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # LLM mock upstream (真 OpenAI 兼容 mock, aiohttp, 支持 chat/completions)
  # 用于 v1/v2 gateway 的真正端到端转发测试
  # ─────────────────────────────────────────────────────────────────────
  llm-mock-upstream:
    build:
      context: ./scripts/mocks/llm-mock-upstream
      dockerfile: Dockerfile
    image: r112-llm-mock-upstream:local
    container_name: r112_llm_mock_upstream
    ports:
      - "${LLM_MOCK_HOST_PORT:-19080}:18080"
    environment:
      # 本地快速验证: 50-100ms 延迟 (非 fp_slot 回归的 10-15s)
      MOCK_LATENCY_MS_MIN: "50"
      MOCK_LATENCY_MS_MAX: "100"
      MOCK_TOKEN: "local-mock"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:18080/healthz | grep -q '\\\"ok\\\"' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # Gateway v1 (生产入口, cmd/gateway, 本地构建)
  # 监听 8781, 复用同一套 PG/Redis/mock-upstream
  # ─────────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.local-arm64
    image: r112-gateway:local-arm64
    container_name: r112_gateway
    env_file:
      - .env.dev-research
    depends_on:
      redis:
        condition: service_healthy
      llm-mock-upstream:
        condition: service_healthy
    ports:
      - "8781:8781"
    volumes:
      # Mount configs directory for sensitive_words.json
      - ./configs:/configs:ro
    environment:
      # ── 监听与运行环境 ──
      LLM_GATEWAY_LISTEN: ":8781"
      LLM_GATEWAY_ENV: "local"           # 非 production, 避免 fail-closed panic
      LOG_LEVEL: "info"
      STICKY_MULTILEVEL_DEBUG: "1"
      # ── 依赖 (compose 内服务名) ──
      # POSTGRES_USER / POSTGRES_PASSWORD 从 .env.dev-research 注入
      # 默认: 复用本机 host llm-gateway-pg (dev-research 共享 host PG)
      LLM_GATEWAY_DATABASE_URL: "postgres://${POSTGRES_USER:-kxuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env.dev-research}@host.docker.internal:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-llm_gateway_test_dev}?sslmode=disable"
      LLM_GATEWAY_REDIS_ADDR: "redis:${REDIS_PORT:-6379}"
      # ── credential 解密 key (.env.dev-research 注入) ──
      # 32-byte deterministic key, base64url. LOCAL ONLY, never production.
      # LLM_GATEWAY_CREDENTIAL_ENCRYPTION_KEY: <from .env.dev-research>
      # ── JWT signing secret (.env.dev-research 注入) ──
      # LLM_GATEWAY_JWT_SECRET: <from .env.dev-research>
      # ── 关闭数据面 auth (本地测试, 不设 API_KEY 即默认 off) ──
      # LLM_GATEWAY_API_KEY 留空 → auth middleware 不生效
      # ── Admin API token (.env.dev-research 注入) ──
      # LLM_GATEWAY_ADMIN_API_KEY: <from .env.dev-research>
      # ── CORS (v1 启动时 panic 若未设; 本地用通配) ──
      LLM_GATEWAY_CORS_ORIGINS: "*"
      # ── 附件目录 (容器内可写, 避免启动时 mkdir 失败) ──
      LLM_GATEWAY_ATTACHMENT_DIR: "/tmp/attachments"
      LLM_GATEWAY_BACKUP_DIR: "/tmp/llm-gateway-backups"
      # ── 指向真 mock upstream (仅用于无 credential 命中时的兜底) ──
      LLM_GATEWAY_UPSTREAM: "http://llm-mock-upstream:18080"
      # ── Seed admin password (.env.dev-research 注入) ──
      # LLM_GATEWAY_SEED_ADMIN_PASSWORD: <from .env.dev-research>
      # ── 运维节点标识（写入 gateway_instances.region）──
      OPS_NODE_REGION: "local"
      # ── 首次激活/中心注册地址 ──
      # 本地环回: 指到宿主机 ai-native-maintain dev compose (127.0.0.1:8082)
      LLM_GATEWAY_CENTER_URL: "http://host.docker.internal:8082"
      OPS_COLLECT_URL: "http://host.docker.internal:8082"
      # ── Frontend static dir (Docker image 中的路径) ──
      LLM_GATEWAY_STATIC_DIR: "/opt/llm-gateway-go/web/dist"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8781/healthz | grep -q ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # Gateway v2 (本地 build, cmd/gateway-v2/Dockerfile)
  # 2026-07-14: disabled for arm64 local test (Dockerfile still amd64)
  # ─────────────────────────────────────────────────────────────────────
  gateway-v2:
    image: r112-gateway-v2:disabled
    container_name: r112_gateway_v2
    profiles: ["v2"]
    env_file:
      - .env.dev-research
    depends_on:
      redis:
        condition: service_healthy
      memora-mcp:
        condition: service_healthy
      llm-mock:
        condition: service_healthy
      llm-mock-upstream:
        condition: service_healthy
    ports:
      - "8782:8782"
    environment:
      # ── 基础 ──
      GIN_MODE: release
      LOG_LEVEL: info
      LISTEN_ADDR: ":8080"
      # ── 依赖指向 compose 内服务名 (docker DNS 自动解析) ──
      # DATABASE_URL 从 .env.dev-research 注入 (docker-compose v1/v2 共享同一份 env)
      # REDIS_URL: compose 内服务名解析
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}/0
      MEMORA_URL: http://memora-mcp:80
      # 指向真 OpenAI 兼容 mock (支持 chat/completions 真实回包)
      OPENAI_BASE_URL: http://llm-mock-upstream:18080
      # ── v2 特性开关 ──
      GATEWAY_V2_ENABLED: "true"
      COMPRESSOR_ENABLED: "true"
      ARMOR_ENABLED: "true"
      CREDENTIAL_FP_SLOTS_ENABLED: "true"
      # ── 关闭外部认证 (本地测试不需要 Casdoor) ──
      AUTH_DISABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8782/healthz | grep -q ok || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      - r112_net

  # ─────────────────────────────────────────────────────────────────────
  # Test runner (alpine + curl, 用于一次性跑 curl 测试)
  # ─────────────────────────────────────────────────────────────────────
  test-runner:
    image: alpine:3.20
    container_name: r112_test_runner
    entrypoint: ["sleep", "infinity"]
    networks:
      - r112_net
    profiles:
      - test

volumes:
  r112_redis_data:
    name: r112_redis_data

networks:
  r112_net:
    name: r112_net
    driver: bridge
