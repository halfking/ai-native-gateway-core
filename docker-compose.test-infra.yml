version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: llm-gateway-test-postgres
    environment:
      POSTGRES_DB: llm_gateway_test
      POSTGRES_USER: gateway_rls_test
      POSTGRES_PASSWORD: gateway_test_lowpriv_20260719
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_rls_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: llm-gateway-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
