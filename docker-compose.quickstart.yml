# AI Native Gateway - Quick Start Compose
# Minimal self-contained stack for local evaluation and development
# Not for production - see docs/deployment/ for production guidance

version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: llm_gateway
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d llm_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    ports:
      - "127.0.0.1:8781:8781"
    environment:
      - LLM_GATEWAY_ENV=development
      - LLM_GATEWAY_LISTEN=:8781
      - LLM_GATEWAY_DATABASE_URL=postgres://gateway_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/llm_gateway?sslmode=disable
      - LLM_GATEWAY_REDIS_ADDR=redis:6379
      - LLM_GATEWAY_REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - LLM_GATEWAY_REDIS_DB=0
      - LLM_GATEWAY_CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
      - LLM_GATEWAY_API_KEY=${API_KEY}
      - LLM_GATEWAY_ADMIN_API_KEY=${ADMIN_API_KEY}
      - LLM_GATEWAY_SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./logs:/app/logs
      - ./data/attachments:/app/data/attachments
      - ./data/raw-logs:/app/data/raw-logs
      - ./data/backups:/app/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8781/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
